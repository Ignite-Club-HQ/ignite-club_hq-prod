workflows:
  android-debug-workflow:
    name: Android Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - android_signing
      java: 21
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add Android platform
        script: npx cap add android || true
      - name: Copy Firebase config
        script: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Patch Firebase receiver for Android 12+
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "FirebaseInstanceIdReceiver" "$MANIFEST"; then
            sed -i '' 's|</application>|<receiver android:name="com.google.firebase.iid.FirebaseInstanceIdReceiver" android:exported="true" android:permission="com.google.android.c2dm.permission.SEND"><intent-filter><action android:name="com.google.android.c2dm.intent.RECEIVE" /></intent-filter></receiver></application>|' "$MANIFEST"
            echo "FirebaseInstanceIdReceiver injected into AndroidManifest.xml"
          else
            echo "FirebaseInstanceIdReceiver already present"
          fi
      - name: Add AdMob App ID to AndroidManifest
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '' '/<\/application>/i\
                <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>
            ' "$MANIFEST"
            echo "AdMob App ID injected into AndroidManifest.xml"
          else
            echo "AdMob App ID already present"
          fi
      - name: Add Crashlytics Gradle plugin
        script: |
          cd android
          # Add crashlytics classpath to project build.gradle (macOS sed doesn't support \n)
          if ! grep -q "firebase-crashlytics-gradle" build.gradle 2>/dev/null; then
            sed -i '' '/dependencies {/a\
                    classpath "com.google.firebase:firebase-crashlytics-gradle:3.0.3"
            ' build.gradle
          fi
          echo "=== Project build.gradle dependencies ==="
          grep -A5 "dependencies {" build.gradle
          # Apply crashlytics plugin to app build.gradle
          if ! grep -q "firebase-crashlytics" app/build.gradle 2>/dev/null; then
            echo "" >> app/build.gradle
            echo "apply plugin: 'com.google.firebase.crashlytics'" >> app/build.gradle
          fi
          echo "=== app/build.gradle tail ==="
          tail -5 app/build.gradle
      - name: Copy app icons
        script: |
          # Remove ALL Capacitor default icons first (including vector drawables and all density folders)
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable/ic_launcher*
          rm -rf android/app/src/main/res/drawable-v24
          rm -rf android/app/src/main/res/drawable-hdpi
          rm -rf android/app/src/main/res/drawable-mdpi
          rm -rf android/app/src/main/res/drawable-xhdpi
          rm -rf android/app/src/main/res/drawable-xxhdpi
          rm -rf android/app/src/main/res/drawable-xxxhdpi
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable/splash.png
          # Copy our mipmap directories (includes mipmap-anydpi-v26 for adaptive icons)
          cp -r android-assets/mipmap-* android/app/src/main/res/
          # Copy drawable assets (foreground icon and notification icon)
          mkdir -p android/app/src/main/res/drawable
          cp android-assets/drawable/ic_launcher_foreground.png android/app/src/main/res/drawable/
          cp android-assets/drawable/ic_launcher_background.xml android/app/src/main/res/drawable/
          cp android-assets/drawable/ic_notification.xml android/app/src/main/res/drawable/
          # Remove ALL Capacitor default colors.xml files to avoid duplicate resource errors
          rm -f android/app/src/main/res/values/colors.xml
          rm -f android/app/src/main/res/values-night/colors.xml
          # Copy our colors.xml with uniquely named resources
          mkdir -p android/app/src/main/res/values
          cp android-assets/res-values/colors.xml android/app/src/main/res/values/colors.xml
          # Debug: List what we have
          echo "=== drawable contents ===" && ls -la android/app/src/main/res/drawable/
          echo "=== mipmap-hdpi contents ===" && ls -la android/app/src/main/res/mipmap-hdpi/
          echo "=== mipmap-anydpi-v26 contents ===" && ls -la android/app/src/main/res/mipmap-anydpi-v26/
      - name: Add custom URL scheme intent-filter
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android:scheme="igniteclubhq"' "$MANIFEST"; then
            # Insert intent-filter before the closing </activity> tag (first occurrence)
            sed -i '' '/<\/activity>/i\
                <intent-filter>\
                    <action android:name="android.intent.action.VIEW" />\
                    <category android:name="android.intent.category.DEFAULT" />\
                    <category android:name="android.intent.category.BROWSABLE" />\
                    <data android:scheme="igniteclubhq" />\
                </intent-filter>
            ' "$MANIFEST"
            echo "=== igniteclubhq:// intent-filter injected ==="
          else
            echo "=== igniteclubhq:// intent-filter already present ==="
          fi
      - name: Add App Links intent-filter for igniteclubhq.app
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android:host="igniteclubhq.app"' "$MANIFEST"; then
            # Insert App Links intent-filter before the closing </activity> tag
            sed -i '' '/<\/activity>/i\
                <intent-filter android:autoVerify="true">\
                    <action android:name="android.intent.action.VIEW" />\
                    <category android:name="android.intent.category.DEFAULT" />\
                    <category android:name="android.intent.category.BROWSABLE" />\
                    <data android:scheme="https" android:host="igniteclubhq.app" />\
                </intent-filter>
            ' "$MANIFEST"
            echo "=== App Links intent-filter for igniteclubhq.app injected ==="
          else
            echo "=== App Links intent-filter for igniteclubhq.app already present ==="
          fi
      - name: Configure notification icon
        script: |
          # Add meta-data for default notification icon and color to AndroidManifest.xml
          # macOS sed requires '' after -i for in-place editing without backup
          sed -i '' 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_notification"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ignite_green"/></application>|' android/app/src/main/AndroidManifest.xml
      - name: Disable lint abort for release
        script: |
          cd android/app
          # Append lintOptions to disable abort on error
          cat >> build.gradle << 'GRADLE'

          android {
              lintOptions {
                  abortOnError false
              }
          }
          GRADLE
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > /tmp/ignite-upload.keystore
          cat > android/key.properties << EOF
          storeFile=/tmp/ignite-upload.keystore
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Configure signing in build.gradle
        script: |
          cd android/app
          cat >> build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      def props = new Properties()
                      props.load(new FileInputStream(rootProject.file("key.properties")))
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
      - name: Increment version code
        script: |
          GRADLE_FILE="android/app/build.gradle"
          # Use epoch-based versionCode to guarantee uniqueness across all builds
          # Format: minutes since 2024-01-01 — gives ~4 years of unique codes
          EPOCH_BASE=1704067200  # 2024-01-01 00:00:00 UTC
          NOW=$(date +%s)
          NEW_VC=$(( NOW - EPOCH_BASE ))
          echo "=== Target versionCode: $NEW_VC (epoch-seconds, timestamp: $NOW) ==="
          echo "=== Before replacement ==="
          grep -n "versionCode" "$GRADLE_FILE" || echo "WARNING: no versionCode found!"
          # Use a broad regex to replace any versionCode value (handles both Groovy and Kotlin DSL)
          sed -i '' -E "s/versionCode[ =]+[0-9]+/versionCode = $NEW_VC/" "$GRADLE_FILE"
          echo "=== After replacement ==="
          grep -n "versionCode" "$GRADLE_FILE"
      - name: Build Android Release
        script: |
          cd android
          ./gradlew clean
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
  ios-debug-workflow:
    name: iOS Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Ensure GADApplicationIdentifier in Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST" 2>/dev/null; then
            echo "=== Injecting GADApplicationIdentifier into Info.plist ==="
            /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-3940256099942544~3347511713" "$PLIST"
          else
            echo "=== GADApplicationIdentifier already present ==="
          fi
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST"
      - name: Patch AppDelegate for Firebase, Crashlytics & Push Notifications
        script: |
          DELEGATE="ios/App/App/AppDelegate.swift"
          echo "=== Patching AppDelegate.swift with push notification support ==="
          cat > "$DELEGATE" << 'SWIFT'
          import UIKit
          import Capacitor
          import FirebaseCore
          import FirebaseCrashlytics
          import FirebaseMessaging

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate, MessagingDelegate, UNUserNotificationCenterDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  FirebaseApp.configure()
                  Crashlytics.crashlytics().setCrashlyticsCollectionEnabled(true)
                  Messaging.messaging().delegate = self
                  UNUserNotificationCenter.current().delegate = self
                  application.registerForRemoteNotifications()
                  return true
              }

              // MARK: - APNs Token Forwarding
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  Messaging.messaging().apnsToken = deviceToken
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  print("[AppDelegate] Failed to register for remote notifications: \(error.localizedDescription)")
              }

              // MARK: - Background Notification Handling
              func application(_ application: UIApplication, didReceiveRemoteNotification userInfo: [AnyHashable: Any], fetchCompletionHandler completionHandler: @escaping (UIBackgroundFetchResult) -> Void) {
                  completionHandler(.newData)
              }

              // MARK: - Firebase MessagingDelegate
              func messaging(_ messaging: Messaging, didReceiveRegistrationToken fcmToken: String?) {
                  if let token = fcmToken {
                      print("[AppDelegate] FCM token refreshed: \(token.prefix(20))...")
                  }
              }

              // MARK: - UNUserNotificationCenterDelegate
              func userNotificationCenter(_ center: UNUserNotificationCenter, willPresent notification: UNNotification, withCompletionHandler completionHandler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  completionHandler([.banner, .badge, .sound])
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter, didReceive response: UNNotificationResponse, withCompletionHandler completionHandler: @escaping () -> Void) {
                  completionHandler()
              }

              func applicationWillResignActive(_ application: UIApplication) {}
              func applicationDidEnterBackground(_ application: UIApplication) {}
              func applicationWillEnterForeground(_ application: UIApplication) {}
              func applicationDidBecomeActive(_ application: UIApplication) {}
              func applicationWillTerminate(_ application: UIApplication) {}

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          SWIFT
          echo "=== Patched AppDelegate.swift with push support ==="
      - name: Overwrite SPM Package.swift with full dependencies
        script: |
          PACKAGE="ios/App/CapApp-SPM/Package.swift"
          echo "=== Overwriting Package.swift with full push notification dependencies ==="
          cat > "$PACKAGE" << 'SWIFTPKG'
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "CapApp-SPM",
              platforms: [.iOS(.v15)],
              products: [
                  .library(
                      name: "CapApp-SPM",
                      targets: ["CapApp-SPM"])
              ],
              dependencies: [
                  .package(url: "https://github.com/ionic-team/capacitor-swift-pm.git", exact: "8.0.0"),
                  .package(url: "https://github.com/firebase/firebase-ios-sdk.git", .upToNextMajor(from: "12.7.0")),
                  .package(name: "CapacitorFirebaseMessaging", path: "../../../node_modules/@capacitor-firebase/messaging"),
                  .package(name: "CapacitorApp", path: "../../../node_modules/@capacitor/app"),
                  .package(name: "CapacitorBrowser", path: "../../../node_modules/@capacitor/browser"),
                  .package(name: "CapacitorCamera", path: "../../../node_modules/@capacitor/camera"),
                  .package(name: "CapacitorKeyboard", path: "../../../node_modules/@capacitor/keyboard"),
                  .package(name: "CapacitorPushNotifications", path: "../../../node_modules/@capacitor/push-notifications"),
                  .package(name: "CapacitorShare", path: "../../../node_modules/@capacitor/share"),
                  .package(name: "CapacitorStatusBar", path: "../../../node_modules/@capacitor/status-bar"),
                  .package(name: "CapgoCapacitorNativeBiometric", path: "../../../node_modules/@capgo/capacitor-native-biometric")
              ],
              targets: [
                  .target(
                      name: "CapApp-SPM",
                      dependencies: [
                          .product(name: "Capacitor", package: "capacitor-swift-pm"),
                          .product(name: "Cordova", package: "capacitor-swift-pm"),
                          .product(name: "FirebaseCore", package: "firebase-ios-sdk"),
                          .product(name: "FirebaseCrashlytics", package: "firebase-ios-sdk"),
                          .product(name: "FirebaseMessaging", package: "firebase-ios-sdk"),
                          .product(name: "CapacitorFirebaseMessaging", package: "CapacitorFirebaseMessaging"),
                          .product(name: "CapacitorApp", package: "CapacitorApp"),
                          .product(name: "CapacitorBrowser", package: "CapacitorBrowser"),
                          .product(name: "CapacitorCamera", package: "CapacitorCamera"),
                          .product(name: "CapacitorKeyboard", package: "CapacitorKeyboard"),
                          .product(name: "CapacitorPushNotifications", package: "CapacitorPushNotifications"),
                          .product(name: "CapacitorShare", package: "CapacitorShare"),
                          .product(name: "CapacitorStatusBar", package: "CapacitorStatusBar"),
                          .product(name: "CapgoCapacitorNativeBiometric", package: "CapgoCapacitorNativeBiometric")
                      ]
                  )
              ]
          )
          SWIFTPKG
          echo "=== Package.swift overwritten ==="
          cat "$PACKAGE"
      - name: Generate push notification entitlements
        script: |
          ENTITLEMENTS="ios/App/App/App.entitlements"
          echo "=== Generating push notification entitlements ==="
          cat > "$ENTITLEMENTS" << 'ENTXML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>development</string>
          </dict>
          </plist>
          ENTXML

          # Link entitlements to Xcode project
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' }

          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end

          # Also add entitlements file to project if not already there
          app_group = project.main_group.find_subpath('App', false)
          existing_ref = app_group.files.find { |f| f.path == 'App.entitlements' }
          if existing_ref.nil?
            app_group.new_file('App.entitlements')
          end

          project.save
          puts "=== Linked App.entitlements to Xcode project ==="
          RUBY_SCRIPT
      - name: Inject UIBackgroundModes into Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          echo "=== Injecting UIBackgroundModes for push notifications ==="
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string fetch" "$PLIST"
            echo "=== UIBackgroundModes added ==="
          else
            echo "=== UIBackgroundModes already present ==="
          fi
          # Also add NSPhotoLibraryAddUsageDescription if missing
          if ! /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Save photos to your library'" "$PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
      - name: Copy Firebase config and add to Xcode project
        script: |
          cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          echo "=== Copied Firebase config to iOS ==="
          
          # Add GoogleService-Info.plist to Xcode project so it's included in the bundle
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'
          
          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          target = project.targets.find { |t| t.name == 'App' }
          app_group = project.main_group.find_subpath('App', false)
          
          existing_ref = app_group.files.find { |f| f.path == 'GoogleService-Info.plist' }
          
          if existing_ref.nil?
            file_ref = app_group.new_file('GoogleService-Info.plist')
            target.resources_build_phase.add_file_reference(file_ref)
            project.save
            puts "=== Added GoogleService-Info.plist to Xcode project ==="
          else
            puts "=== GoogleService-Info.plist already in project ==="
          end
          RUBY_SCRIPT
      - name: Copy app icons
        script: |
          cp android-assets/mipmap-xxxhdpi/ic_launcher.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Build iOS Debug
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - ios/App/build/Build/Products/Debug-iphonesimulator/*.app

  ios-workflow:
    name: iOS Build & Publish
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lovable.igniteteamhub
      vars:
        # Numeric App Store ID for this app — used to ask ASC for the latest
        # build number for this exact marketing version via the Codemagic-managed integration. Public value;
        # safe to commit. Find it in App Store Connect → My Apps → App
        # Information → "Apple ID". This may also be supplied as a Codemagic env var.
        APP_STORE_APPLE_ID: "6758928691"
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: |
          npm run build
          echo "=== Verifying dist folder exists ==="
          ls -la dist/
      - name: Add iOS platform
        script: |
          echo "=== Capacitor version ==="
          npx cap --version
          echo "=== Adding iOS platform ==="
          npx cap add ios || echo "iOS platform may already exist"
          echo "=== Checking ios folder structure ==="
          ls -la ios/ || echo "ERROR: ios folder not created!"
          ls -la ios/App/ || echo "ERROR: ios/App folder not found!"
      - name: Copy Firebase config and add to Xcode project
        script: |
          # Copy GoogleService-Info.plist to iOS app directory
          cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          echo "=== Copied Firebase config to iOS ==="
          
          # Add GoogleService-Info.plist to Xcode project using Ruby script
          # This is necessary because just copying the file doesn't add it to the bundle
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'
          
          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Find the App target
          target = project.targets.find { |t| t.name == 'App' }
          
          # Find the App group
          app_group = project.main_group.find_subpath('App', false)
          
          # Check if GoogleService-Info.plist already exists in project
          existing_ref = app_group.files.find { |f| f.path == 'GoogleService-Info.plist' }
          
          if existing_ref.nil?
            # Add file reference
            file_ref = app_group.new_file('GoogleService-Info.plist')
            
            # Add to resources build phase
            target.resources_build_phase.add_file_reference(file_ref)
            
            project.save
            puts "=== Added GoogleService-Info.plist to Xcode project ==="
          else
            puts "=== GoogleService-Info.plist already in project ==="
          end
          RUBY_SCRIPT
      - name: Sync Capacitor
        script: |
          npx cap sync ios
          echo "=== Verifying SPM Package.swift exists ==="
          cat ios/App/CapApp-SPM/Package.swift | head -20
      - name: Ensure GADApplicationIdentifier in Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          if ! /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST" 2>/dev/null; then
            echo "=== Injecting GADApplicationIdentifier into Info.plist ==="
            /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-3940256099942544~3347511713" "$PLIST"
          else
            echo "=== GADApplicationIdentifier already present ==="
          fi
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$PLIST"
      - name: Patch AppDelegate for Firebase, Crashlytics & Push Notifications
        script: |
          DELEGATE="ios/App/App/AppDelegate.swift"
          echo "=== Patching AppDelegate.swift with push notification support ==="
          cat > "$DELEGATE" << 'SWIFT'
          import UIKit
          import Capacitor
          import FirebaseCore
          import FirebaseCrashlytics
          import FirebaseMessaging

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate, MessagingDelegate, UNUserNotificationCenterDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  FirebaseApp.configure()
                  Crashlytics.crashlytics().setCrashlyticsCollectionEnabled(true)
                  Messaging.messaging().delegate = self
                  UNUserNotificationCenter.current().delegate = self
                  application.registerForRemoteNotifications()
                  return true
              }

              // MARK: - APNs Token Forwarding
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  Messaging.messaging().apnsToken = deviceToken
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  print("[AppDelegate] Failed to register for remote notifications: \(error.localizedDescription)")
              }

              // MARK: - Background Notification Handling
              func application(_ application: UIApplication, didReceiveRemoteNotification userInfo: [AnyHashable: Any], fetchCompletionHandler completionHandler: @escaping (UIBackgroundFetchResult) -> Void) {
                  completionHandler(.newData)
              }

              // MARK: - Firebase MessagingDelegate
              func messaging(_ messaging: Messaging, didReceiveRegistrationToken fcmToken: String?) {
                  if let token = fcmToken {
                      print("[AppDelegate] FCM token refreshed: \(token.prefix(20))...")
                  }
              }

              // MARK: - UNUserNotificationCenterDelegate
              func userNotificationCenter(_ center: UNUserNotificationCenter, willPresent notification: UNNotification, withCompletionHandler completionHandler: @escaping (UNNotificationPresentationOptions) -> Void) {
                  completionHandler([.banner, .badge, .sound])
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter, didReceive response: UNNotificationResponse, withCompletionHandler completionHandler: @escaping () -> Void) {
                  completionHandler()
              }

              func applicationWillResignActive(_ application: UIApplication) {}
              func applicationDidEnterBackground(_ application: UIApplication) {}
              func applicationWillEnterForeground(_ application: UIApplication) {}
              func applicationDidBecomeActive(_ application: UIApplication) {}
              func applicationWillTerminate(_ application: UIApplication) {}

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          SWIFT
          echo "=== Patched AppDelegate.swift with push support ==="
          cat "$DELEGATE"
