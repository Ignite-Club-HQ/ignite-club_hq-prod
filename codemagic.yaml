workflows:
  android-debug-workflow:
    name: Android Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add Android platform
        script: npx cap add android || true
      - name: Copy Firebase config
        script: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Copy app icons
        script: |
          # Remove ALL Capacitor default icons first (including vector drawables and all density folders)
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable/ic_launcher*
          rm -rf android/app/src/main/res/drawable-v24
          rm -rf android/app/src/main/res/drawable-hdpi
          rm -rf android/app/src/main/res/drawable-mdpi
          rm -rf android/app/src/main/res/drawable-xhdpi
          rm -rf android/app/src/main/res/drawable-xxhdpi
          rm -rf android/app/src/main/res/drawable-xxxhdpi
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable/splash.png
          # Copy our mipmap directories (includes mipmap-anydpi-v26 for adaptive icons)
          cp -r android-assets/mipmap-* android/app/src/main/res/
          # Copy drawable assets (foreground icon and notification icon)
          mkdir -p android/app/src/main/res/drawable
          cp android-assets/drawable/ic_launcher_foreground.png android/app/src/main/res/drawable/
          cp android-assets/drawable/ic_launcher_background.xml android/app/src/main/res/drawable/
          cp android-assets/drawable/ic_notification.xml android/app/src/main/res/drawable/
          # Remove ALL Capacitor default colors.xml files to avoid duplicate resource errors
          rm -f android/app/src/main/res/values/colors.xml
          rm -f android/app/src/main/res/values-night/colors.xml
          # Copy our colors.xml with uniquely named resources
          mkdir -p android/app/src/main/res/values
          cp android-assets/res-values/colors.xml android/app/src/main/res/values/colors.xml
          # Debug: List what we have
          echo "=== drawable contents ===" && ls -la android/app/src/main/res/drawable/
          echo "=== mipmap-hdpi contents ===" && ls -la android/app/src/main/res/mipmap-hdpi/
          echo "=== mipmap-anydpi-v26 contents ===" && ls -la android/app/src/main/res/mipmap-anydpi-v26/
      - name: Configure notification icon
        script: |
          # Add meta-data for default notification icon and color to AndroidManifest.xml
          # macOS sed requires '' after -i for in-place editing without backup
          sed -i '' 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_notification"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ignite_green"/></application>|' android/app/src/main/AndroidManifest.xml
      - name: Build Android
        script: |
          cd android
          # Clean build to ensure no cached icons
          ./gradlew clean
          ./gradlew assembleDebug
      # Emulator crash-test step removed — Codemagic M2 machines do not support
      # the Apple Hypervisor Framework (HVF) required by the Android emulator.
      # The debug APK is still built and available as an artifact for manual testing.
    artifacts:
      - android/app/build/outputs/**/*.apk
      - full_logcat.txt

  android-workflow:
    name: Android Build & Publish
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 22
      groups:
        - google_play_credentials
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add Android platform
        script: npx cap add android || true
      - name: Copy Firebase config
        script: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Copy app icons
        script: |
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable/ic_launcher*
          rm -rf android/app/src/main/res/drawable-v24
          rm -rf android/app/src/main/res/drawable-hdpi
          rm -rf android/app/src/main/res/drawable-mdpi
          rm -rf android/app/src/main/res/drawable-xhdpi
          rm -rf android/app/src/main/res/drawable-xxhdpi
          rm -rf android/app/src/main/res/drawable-xxxhdpi
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable/splash.png
          cp -r android-assets/mipmap-* android/app/src/main/res/
          mkdir -p android/app/src/main/res/drawable
          cp android-assets/drawable/ic_launcher_foreground.png android/app/src/main/res/drawable/
          cp android-assets/drawable/ic_launcher_background.xml android/app/src/main/res/drawable/
          cp android-assets/drawable/ic_notification.xml android/app/src/main/res/drawable/
          rm -f android/app/src/main/res/values/colors.xml
          rm -f android/app/src/main/res/values-night/colors.xml
          mkdir -p android/app/src/main/res/values
          cp android-assets/res-values/colors.xml android/app/src/main/res/values/colors.xml
      - name: Configure notification icon
        script: |
          sed -i '' 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_notification"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ignite_green"/></application>|' android/app/src/main/AndroidManifest.xml
      - name: Set version code
        script: |
          cd android
          LATEST_BUILD=$(google-play get-latest-build-number --package-name "app.lovable.igniteteamhub" --tracks internal || echo 0)
          NEW_BUILD=$((LATEST_BUILD + 1))
          echo "Setting versionCode to $NEW_BUILD"
          sed -i '' "s/versionCode [0-9]*/versionCode $NEW_BUILD/" app/build.gradle
      - name: Build Android Release Bundle
        script: |
          cd android
          ./gradlew clean
          ./gradlew bundleRelease
      - name: Sign AAB
        script: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore $CM_KEYSTORE_PATH \
            -storepass $CM_KEYSTORE_PASSWORD \
            -keypass $CM_KEY_PASSWORD \
            android/app/build/outputs/bundle/release/app-release.aab \
            $CM_KEY_ALIAS
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-debug-workflow:
    name: iOS Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Copy app icons
        script: |
          cp android-assets/mipmap-xxxhdpi/ic_launcher.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Build iOS Debug
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            archive
    artifacts:
      - ios/App/build/**/*.app

  ios-workflow:
    name: iOS Build & Publish
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lovable.igniteteamhub
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: |
          npm run build
          echo "=== Verifying dist folder exists ==="
          ls -la dist/
      - name: Add iOS platform
        script: |
          echo "=== Capacitor version ==="
          npx cap --version
          echo "=== Adding iOS platform ==="
          npx cap add ios || echo "iOS platform may already exist"
          echo "=== Checking ios folder structure ==="
          ls -la ios/ || echo "ERROR: ios folder not created!"
          ls -la ios/App/ || echo "ERROR: ios/App folder not found!"
      - name: Copy Firebase config and add to Xcode project
        script: |
          # Copy GoogleService-Info.plist to iOS app directory
          cp firebase/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          echo "=== Copied Firebase config to iOS ==="
          
          # Add GoogleService-Info.plist to Xcode project using Ruby script
          # This is necessary because just copying the file doesn't add it to the bundle
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'
          
          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          
          # Find the App target
          target = project.targets.find { |t| t.name == 'App' }
          
          # Find the App group
          app_group = project.main_group.find_subpath('App', false)
          
          # Check if GoogleService-Info.plist already exists in project
          existing_ref = app_group.files.find { |f| f.path == 'GoogleService-Info.plist' }
          
          if existing_ref.nil?
            # Add file reference
            file_ref = app_group.new_file('GoogleService-Info.plist')
            
            # Add to resources build phase
            target.resources_build_phase.add_file_reference(file_ref)
            
            project.save
            puts "=== Added GoogleService-Info.plist to Xcode project ==="
          else
            puts "=== GoogleService-Info.plist already in project ==="
          end
          RUBY_SCRIPT
      - name: Sync Capacitor
        script: |
          npx cap sync ios
          echo "=== Verifying SPM Package.swift exists ==="
          cat ios/App/CapApp-SPM/Package.swift | head -20
      - name: Copy app icons
        script: |
          # Copy Ignite icon to iOS app icon (use the highest resolution Android icon)
          # iOS requires 1024x1024 icon named appropriately
          cp android-assets/mipmap-xxxhdpi/ic_launcher.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          echo "=== Copied Ignite icon to iOS ==="
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset/
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number 6758928691 || echo 0)
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))
      - name: Build iOS Release
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            archive
      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ~/export_options.plist
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Note: Internal testers are added directly in App Store Connect, not via beta_groups
