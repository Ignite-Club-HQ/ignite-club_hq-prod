# Codemagic CI for Ignite Club HQ native apps.
#
# Workflows:
#   android-debug   — unsigned debug APK, no secrets needed. Use this first to
#                     prove the pipeline end to end.
#   android-workflow — signed AAB for Google Play. Requires the environment
#                     variables listed below to be configured in the Codemagic
#                     UI (Application -> Environment variables, group
#                     "android_release"):
#   Signing key — EITHER generate one in the Codemagic UI (app -> Code
#                       signing -> Android -> Generate keystore; no Java needed,
#                       its variables are injected automatically), OR set:
#                       CM_KEYSTORE            base64 of the upload keystore (.jks)
#                       CM_KEYSTORE_PASSWORD   keystore store password
#                       CM_KEY_ALIAS           key alias inside the keystore
#                       CM_KEY_PASSWORD        key password
#                       GOOGLE_SERVICES_JSON   base64 of google-services.json
#                                              (Firebase project used for push)
#   ios-debug       — unsigned simulator build, no Apple account needed. Use this
#                     to prove the iOS pipeline before touching any Apple secrets.
#   ios-workflow    — signed App Store IPA. Requires an Apple Developer Program
#                     membership and an "app_store_connect" integration in the
#                     Codemagic team settings (Issuer ID + Key ID + the .p8 key
#                     downloaded from App Store Connect -> Users and Access ->
#                     Integrations -> App Store Connect API, App Manager access).
#                     Optional group "ios_release":
#                       GOOGLE_SERVICE_INFO_PLIST  base64 of GoogleService-Info.plist
#                                                  (Firebase, for push on iOS)
#
# All workflows build the live web app (frontend/scripts/build-live.mjs ->
# frontend/dist-live), scaffold the Capacitor native project in CI (android/ and
# ios/ are intentionally NOT committed), sync, then build natively.
#
# NOTE on the install step: scripts/ensure-frontend-deps.mjs lives at the repo
# root, not inside frontend/. It resolves frontend/ itself, so it must be run
# from the repo root — running it with working_directory: frontend fails with
# "Cannot find module".

workflows:
  android-debug:
    name: Android debug APK
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install frontend dependencies
        script: node scripts/ensure-frontend-deps.mjs
      - name: Build live web app
        working_directory: frontend
        script: |
          # The live build bakes the backend addresses into the bundle; the guard
          # (frontend/scripts/check-live-config.mjs) exits before vite runs when
          # they are missing. Same public defaults as
          # .github/workflows/deploy-frontend-canister.yml; both can be overridden
          # by setting the variable in a Codemagic environment group.
          # Codemagic is PROD-only: default to the PROD backend and never build
          # store apps against DEV. The PROD anon key must come from the
          # Codemagic environment group (no committed default).
          export IGNITE_LIVE_SUPABASE_URL="${IGNITE_LIVE_SUPABASE_URL:-https://yabcfiuntwqjwvschnji.supabase.co}"
          case "$IGNITE_LIVE_SUPABASE_URL" in *ecsdwrarzfexssxtrymj*) echo "Refusing PROD build against DEV backend"; exit 1;; esac
          export IGNITE_LIVE_SUPABASE_ANON_KEY="${IGNITE_LIVE_SUPABASE_ANON_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-}}"
          if [ -z "${IGNITE_LIVE_SUPABASE_ANON_KEY:-}" ]; then echo "IGNITE_LIVE_SUPABASE_ANON_KEY (PROD) must be set in Codemagic"; exit 1; fi
          export IGNITE_LIVE_SUPABASE_ANON_KEY
          # Blockchain canister IDs come from the committed ID table (same source
          # the site build uses), so the native bundle targets the real canisters.
          # PROD canisters only ("{}" until provisioned) — never the DEV/test set.
          export IGNITE_ICP_ENV=prod
          node --input-type=module -e 'import {resolveHostBuildEnv} from "../scripts/host-build-env.mjs"; resolveHostBuildEnv(process.env)'
          node ../scripts/icp-environments.mjs guard prod "$IGNITE_LIVE_SUPABASE_URL"
          node ../scripts/sync-canister-ids.mjs
          export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(node ../scripts/icp-environments.mjs ids prod)"
          npm run build:live
      - name: Scaffold and sync Capacitor Android
        working_directory: frontend
        script: |
          set -euo pipefail
          # Fail loudly here (not later in Gradle) if the web build is missing.
          # The live build emits live-index.html; Capacitor needs index.html.
          [ -f dist-live/index.html ] || cp dist-live/live-index.html dist-live/index.html 2>/dev/null || true
          test -f dist-live/index.html || { echo "dist-live/index.html missing - web build failed"; exit 1; }
          rm -rf android
          npx cap add android
          # Capacitor writes capacitor.settings.gradle during update; regenerate if absent.
          [ -f android/capacitor.settings.gradle ] || npx cap update android
          npx cap sync android
          test -f android/capacitor.settings.gradle || { echo "capacitor.settings.gradle was not generated"; exit 1; }
          # Optional: notifications in the test build when the Firebase file is set.
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//' | head -c1 | grep -q '{' && printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json || printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \r\n' | base64 --decode > android/app/google-services.json
          fi
          # Internet Identity sign-in returns via com.igniteclubhq.app://ii-callback
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = ('<intent-filter><action android:name="android.intent.action.VIEW" />'
               '<category android:name="android.intent.category.DEFAULT" />'
               '<category android:name="android.intent.category.BROWSABLE" />'
               '<data android:scheme="com.igniteclubhq.app" android:host="ii-callback" /></intent-filter>')
          if "ii-callback" not in s:
              s = s.replace("</activity>", f + "</activity>", 1)
          open(p, "w").write(s)
          PY
          python3 ../scripts/configure-android-status-bar.py
      - name: Build debug APK
        working_directory: frontend/android
        script: ./gradlew assembleDebug
    artifacts:
      - frontend/android/app/build/outputs/apk/debug/*.apk

  android-workflow:
    name: Android Build & Publish
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      # ignite_upload is the only upload key Codemagic holds. Play Console must
      # have it registered (App integrity -> Request upload key reset) — the
      # build log prints its certificate for that request.
      # Same settings group the pre-merge prod workflow used (Play
      # credentials + upload keystore as CM_KEYSTORE_PATH etc.).
      groups:
        - google_play_credentials
        - android_signing
        - supabase_prod
    scripts:
      - name: Require successful production promotions for this commit
        script: node scripts/prod-publication-gate.mjs
      - name: Install frontend dependencies
        script: node scripts/ensure-frontend-deps.mjs
      - name: Build live web app
        working_directory: frontend
        script: |
          # The live build bakes the backend addresses into the bundle; the guard
          # (frontend/scripts/check-live-config.mjs) exits before vite runs when
          # they are missing. Same public defaults as
          # .github/workflows/deploy-frontend-canister.yml; both can be overridden
          # by setting the variable in a Codemagic environment group.
          # Codemagic is PROD-only: default to the PROD backend and never build
          # store apps against DEV. The PROD anon key must come from the
          # Codemagic environment group (no committed default).
          export IGNITE_LIVE_SUPABASE_URL="${IGNITE_LIVE_SUPABASE_URL:-https://yabcfiuntwqjwvschnji.supabase.co}"
          case "$IGNITE_LIVE_SUPABASE_URL" in *ecsdwrarzfexssxtrymj*) echo "Refusing PROD build against DEV backend"; exit 1;; esac
          export IGNITE_LIVE_SUPABASE_ANON_KEY="${IGNITE_LIVE_SUPABASE_ANON_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-}}"
          if [ -z "${IGNITE_LIVE_SUPABASE_ANON_KEY:-}" ]; then echo "IGNITE_LIVE_SUPABASE_ANON_KEY (PROD) must be set in Codemagic"; exit 1; fi
          export IGNITE_LIVE_SUPABASE_ANON_KEY
          # Blockchain canister IDs come from the committed ID table (same source
          # the site build uses), so the native bundle targets the real canisters.
          # PROD canisters only ("{}" until provisioned) — never the DEV/test set.
          export IGNITE_ICP_ENV=prod
          node --input-type=module -e 'import {resolveHostBuildEnv} from "../scripts/host-build-env.mjs"; resolveHostBuildEnv(process.env)'
          node ../scripts/icp-environments.mjs guard prod "$IGNITE_LIVE_SUPABASE_URL"
          node ../scripts/sync-canister-ids.mjs
          export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(node ../scripts/icp-environments.mjs ids prod)"
          npm run build:live
      - name: Scaffold and sync Capacitor Android
        working_directory: frontend
        script: |
          set -euo pipefail
          # Fail loudly here (not later in Gradle) if the web build is missing.
          # The live build emits live-index.html; Capacitor needs index.html.
          [ -f dist-live/index.html ] || cp dist-live/live-index.html dist-live/index.html 2>/dev/null || true
          test -f dist-live/index.html || { echo "dist-live/index.html missing - web build failed"; exit 1; }
          rm -rf android
          npx cap add android
          # Capacitor writes capacitor.settings.gradle during update; regenerate if absent.
          [ -f android/capacitor.settings.gradle ] || npx cap update android
          npx cap sync android
          test -f android/capacitor.settings.gradle || { echo "capacitor.settings.gradle was not generated"; exit 1; }
          # Internet Identity sign-in returns via com.igniteclubhq.app://ii-callback
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = ('<intent-filter><action android:name="android.intent.action.VIEW" />'
               '<category android:name="android.intent.category.DEFAULT" />'
               '<category android:name="android.intent.category.BROWSABLE" />'
               '<data android:scheme="com.igniteclubhq.app" android:host="ii-callback" /></intent-filter>')
          if "ii-callback" not in s:
              s = s.replace("</activity>", f + "</activity>", 1)
          open(p, "w").write(s)
          PY
          python3 ../scripts/configure-android-status-bar.py
      - name: Decode signing and Firebase files
        working_directory: frontend/android
        script: |
          # Signing key: Codemagic-managed (android_signing) or manual CM_KEYSTORE.
          if [ -n "$CM_KEYSTORE_PATH" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            cp "$CM_KEYSTORE_PATH" app/upload-keystore.jks
          elif [ -n "$CM_KEYSTORE" ]; then
            printf '%s' "$CM_KEYSTORE" | tr -d ' \r\n' | base64 --decode > app/upload-keystore.jks
          else
            echo "No signing key found. Add the ignite_upload key under Code signing -> Android."
            exit 1
          fi
          # Report (never fail on) the key fingerprint, and print the PUBLIC
          # certificate so it can be attached to a Play upload key reset.
          EXPECTED_SHA1_PREFIX="33:46:AD:FC"
          SHA1=$(keytool -list -v -keystore app/upload-keystore.jks -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" 2>/dev/null | sed -n 's/.*SHA1: *//p' | head -n1)
          echo "Upload key SHA1: ${SHA1:-unreadable}"
          case "$SHA1" in
            "$EXPECTED_SHA1_PREFIX"*) echo "Upload key matches Play Console." ;;
            *) echo "WARNING: Play Console expects a key starting $EXPECTED_SHA1_PREFIX. Request an upload key reset with the certificate below, then upload this build."
               keytool -exportcert -rfc -keystore app/upload-keystore.jks -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" -file upload_certificate.pem 2>/dev/null && cat upload_certificate.pem ;;
          esac
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | sed 's/^[[:space:]]*//' | head -c1 | grep -q '{' && printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json || printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \r\n' | base64 --decode > app/google-services.json
          else
            cp ../../firebase/google-services.json app/google-services.json
          fi
          # Pre-merge launcher + notification icons.
          rm -rf app/src/main/res/mipmap-* app/src/main/res/drawable/ic_launcher* app/src/main/res/drawable-v24
          rm -f app/src/main/res/values/colors.xml app/src/main/res/values-night/colors.xml
          cp -r ../../android-assets/mipmap-* app/src/main/res/
          mkdir -p app/src/main/res/drawable app/src/main/res/values
          cp ../../android-assets/drawable/* app/src/main/res/drawable/
          cp ../../android-assets/res-values/colors.xml app/src/main/res/values/colors.xml
          python3 - <<'PY2'
          p = "app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "default_notification_icon" not in s:
              s = s.replace("</application>", '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_notification"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ignite_green"/></application>', 1)
          open(p, "w").write(s)
          PY2
      - name: Configure signing
        working_directory: frontend/android
        script: |
          set -euo pipefail
          # Google Play requires every upload to have a higher versionCode than
          # any previous one. Use minutes since 1970: always increasing, never
          # reused, independent of Codemagic's per-workflow build counter, and
          # far below Play's 2,100,000,000 limit. Written straight into the
          # generated defaultConfig (replacing Capacitor's "versionCode 1") so
          # no second Gradle block can be ignored or overridden.
          # Next number after the latest Play build (pre-merge behaviour).
          VC=$(node ../../scripts/native-release-version.mjs android)
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode $VC/; s/versionName[[:space:]]+\"[^\"]*\"/versionName \"1.0.$VC\"/" app/build.gradle
          grep -q "versionCode $VC" app/build.gradle || { echo "Could not set versionCode in app/build.gradle"; grep -n "version" app/build.gradle; exit 1; }
          echo "Android versionCode set to $VC"
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('CM_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('CM_KEY_ALIAS')
                      keyPassword (System.getenv('CM_KEY_PASSWORD') ?: System.getenv('CM_KEYSTORE_PASSWORD'))
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      // Play Console flags un-obfuscated DEX code; R8 shrinks
                      // and obfuscates while the keep rules below protect
                      // everything the web layer reaches by reflection.
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF
          cat >> app/proguard-rules.pro <<'EOF'

          # Capacitor bridge + plugins are discovered by reflection/annotations.
          -keep class com.getcapacitor.** { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * { *; }
          -keep class * extends com.getcapacitor.Plugin { *; }
          -keepclassmembers class * { @com.getcapacitor.PluginMethod public *; @android.webkit.JavascriptInterface <methods>; }
          -keep class com.capacitorjs.** { *; }
          -keep class io.ionic.** { *; }
          -keep class ee.forgr.** { *; }
          -keep class com.google.firebase.** { *; }
          -keep class com.android.billingclient.** { *; }
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,SourceFile,LineNumberTable
          -dontwarn **
          EOF
      - name: Build release AAB
        working_directory: frontend/android
        script: ./gradlew bundleRelease
    artifacts:
      - frontend/android/app/build/outputs/bundle/release/*.aab
      - frontend/android/upload_certificate.pem
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  # Proves the iOS toolchain without needing an Apple Developer account: builds
  # the app for the simulator with code signing switched off. The .app cannot be
  # installed on a real phone — it is a pipeline check only.
  ios-debug:
    name: iOS debug build (simulator, unsigned)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install frontend dependencies
        script: node scripts/ensure-frontend-deps.mjs
      - name: Build live web app
        working_directory: frontend
        script: |
          # The live build bakes the backend addresses into the bundle; the guard
          # (frontend/scripts/check-live-config.mjs) exits before vite runs when
          # they are missing. Same public defaults as
          # .github/workflows/deploy-frontend-canister.yml; both can be overridden
          # by setting the variable in a Codemagic environment group.
          # Codemagic is PROD-only: default to the PROD backend and never build
          # store apps against DEV. The PROD anon key must come from the
          # Codemagic environment group (no committed default).
          export IGNITE_LIVE_SUPABASE_URL="${IGNITE_LIVE_SUPABASE_URL:-https://yabcfiuntwqjwvschnji.supabase.co}"
          case "$IGNITE_LIVE_SUPABASE_URL" in *ecsdwrarzfexssxtrymj*) echo "Refusing PROD build against DEV backend"; exit 1;; esac
          export IGNITE_LIVE_SUPABASE_ANON_KEY="${IGNITE_LIVE_SUPABASE_ANON_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-}}"
          if [ -z "${IGNITE_LIVE_SUPABASE_ANON_KEY:-}" ]; then echo "IGNITE_LIVE_SUPABASE_ANON_KEY (PROD) must be set in Codemagic"; exit 1; fi
          export IGNITE_LIVE_SUPABASE_ANON_KEY
          # Blockchain canister IDs come from the committed ID table (same source
          # the site build uses), so the native bundle targets the real canisters.
          # PROD canisters only ("{}" until provisioned) — never the DEV/test set.
          export IGNITE_ICP_ENV=prod
          node --input-type=module -e 'import {resolveHostBuildEnv} from "../scripts/host-build-env.mjs"; resolveHostBuildEnv(process.env)'
          node ../scripts/icp-environments.mjs guard prod "$IGNITE_LIVE_SUPABASE_URL"
          node ../scripts/sync-canister-ids.mjs
          export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(node ../scripts/icp-environments.mjs ids prod)"
          npm run build:live
      - name: Scaffold and sync Capacitor iOS
        working_directory: frontend
        script: |
          [ -f dist-live/index.html ] || cp dist-live/live-index.html dist-live/index.html
          npx cap add ios
          npx cap sync ios
          # Internet Identity sign-in returns via com.igniteclubhq.app://ii-callback
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.igniteclubhq.app" "$PL"
      - name: Build for simulator (no signing)
        working_directory: frontend/ios/App
        script: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-workflow:
    name: iOS Build & Publish
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Must match the name of the App Store Connect integration created in
      # Codemagic team settings.
      app_store_connect: Codemagic
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lovable.igniteteamhub
      groups:
        - supabase_prod
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # App Store Connect -> App -> General -> App Information -> the numeric
        # Apple ID. Fill this in once the app record exists.
        APP_STORE_APP_ID: 6758928691
    scripts:
      - name: Require successful production promotions for this commit
        script: node scripts/prod-publication-gate.mjs
      - name: Install frontend dependencies
        script: node scripts/ensure-frontend-deps.mjs
      - name: Build live web app
        working_directory: frontend
        script: |
          # The live build bakes the backend addresses into the bundle; the guard
          # (frontend/scripts/check-live-config.mjs) exits before vite runs when
          # they are missing. Same public defaults as
          # .github/workflows/deploy-frontend-canister.yml; both can be overridden
          # by setting the variable in a Codemagic environment group.
          # Codemagic is PROD-only: default to the PROD backend and never build
          # store apps against DEV. The PROD anon key must come from the
          # Codemagic environment group (no committed default).
          export IGNITE_LIVE_SUPABASE_URL="${IGNITE_LIVE_SUPABASE_URL:-https://yabcfiuntwqjwvschnji.supabase.co}"
          case "$IGNITE_LIVE_SUPABASE_URL" in *ecsdwrarzfexssxtrymj*) echo "Refusing PROD build against DEV backend"; exit 1;; esac
          export IGNITE_LIVE_SUPABASE_ANON_KEY="${IGNITE_LIVE_SUPABASE_ANON_KEY:-${VITE_SUPABASE_PUBLISHABLE_KEY:-}}"
          if [ -z "${IGNITE_LIVE_SUPABASE_ANON_KEY:-}" ]; then echo "IGNITE_LIVE_SUPABASE_ANON_KEY (PROD) must be set in Codemagic"; exit 1; fi
          export IGNITE_LIVE_SUPABASE_ANON_KEY
          # Blockchain canister IDs come from the committed ID table (same source
          # the site build uses), so the native bundle targets the real canisters.
          # PROD canisters only ("{}" until provisioned) — never the DEV/test set.
          export IGNITE_ICP_ENV=prod
          node --input-type=module -e 'import {resolveHostBuildEnv} from "../scripts/host-build-env.mjs"; resolveHostBuildEnv(process.env)'
          node ../scripts/icp-environments.mjs guard prod "$IGNITE_LIVE_SUPABASE_URL"
          node ../scripts/sync-canister-ids.mjs
          export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(node ../scripts/icp-environments.mjs ids prod)"
          npm run build:live
      - name: Scaffold and sync Capacitor iOS
        working_directory: frontend
        script: |
          [ -f dist-live/index.html ] || cp dist-live/live-index.html dist-live/index.html
          npx cap add ios
          npx cap sync ios
          # Internet Identity sign-in returns via com.igniteclubhq.app://ii-callback
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.igniteclubhq.app" "$PL"
      - name: Install CocoaPods dependencies
        working_directory: frontend/ios/App
        script: pod install
      - name: Wire Firebase push (iOS)
        working_directory: frontend
        script: |
          # Fall back to the committed Firebase file (pre-merge behaviour).
          export GOOGLE_SERVICE_INFO_PLIST="${GOOGLE_SERVICE_INFO_PLIST:-$(base64 < ../firebase/GoogleService-Info.plist | tr -d '\n')}"
          bash ../scripts/native-push-ios.sh
          cp ../android-assets/mipmap-xxxhdpi/ic_launcher.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Increment build number
        working_directory: frontend/ios/App
        script: |
          set -euo pipefail
          NEXT_BUILD=$(node ../../../scripts/native-release-version.mjs ios)
          APP_VERSION=$(node -p "require('../../../scripts/native-release-settings.json').marketingVersion")
          case "$APP_VERSION" in *[!0-9.]*|'') echo 'Invalid marketing version'; exit 1;; esac
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$NEXT_BUILD"
          node -e 'const fs=require("fs"); fs.writeFileSync(".native-release-version.json", JSON.stringify({version: process.argv[1], build: process.argv[2]}))' "$APP_VERSION" "$NEXT_BUILD"
      - name: Set up code signing
        working_directory: frontend/ios/App
        script: xcode-project use-profiles
      - name: Build App Store IPA
        working_directory: frontend/ios/App
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
          IPA=$(python3 -c 'import glob; files=glob.glob("build/ios/ipa/*.ipa"); assert len(files)==1, "Expected exactly one IPA"; print(files[0])')
          VERIFY_DIR=$(mktemp -d)
          unzip -q "$IPA" -d "$VERIFY_DIR"
          PLIST=$(python3 -c 'import glob,sys; files=glob.glob(sys.argv[1]+"/Payload/*.app/Info.plist"); assert len(files)==1; print(files[0])' "$VERIFY_DIR")
          node ../../../scripts/native-release-version.mjs verify-ipa .native-release-version.json "$PLIST"
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
