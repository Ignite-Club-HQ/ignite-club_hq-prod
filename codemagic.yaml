workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 21
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Add Android platform
        script: npx cap add android || true
      - name: Copy Firebase config
        script: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Copy app icons
        script: |
          # Remove ALL Capacitor default icons first
          rm -rf android/app/src/main/res/mipmap-*
          rm -rf android/app/src/main/res/drawable/ic_launcher*
          # Copy our mipmap directories (includes mipmap-anydpi-v26 for adaptive icons)
          cp -r android-assets/mipmap-* android/app/src/main/res/
          # Copy drawable assets (foreground icon and notification icon)
          mkdir -p android/app/src/main/res/drawable
          cp android-assets/drawable/ic_launcher_foreground.png android/app/src/main/res/drawable/
          cp android-assets/drawable/ic_notification.png android/app/src/main/res/drawable/
          # Remove ALL Capacitor default colors.xml files to avoid duplicate resource errors
          rm -f android/app/src/main/res/values/colors.xml
          rm -f android/app/src/main/res/values-night/colors.xml
          # Copy our colors.xml with uniquely named resources
          mkdir -p android/app/src/main/res/values
          cp android-assets/res-values/colors.xml android/app/src/main/res/values/colors.xml
          # Verify icons were copied
          echo "=== Copied mipmap contents ===" && ls -la android/app/src/main/res/mipmap-hdpi/
      - name: Configure notification icon
        script: |
          # Add meta-data for default notification icon and color to AndroidManifest.xml
          # macOS sed requires '' after -i for in-place editing without backup
          sed -i '' 's|</application>|<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_notification"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ignite_green"/></application>|' android/app/src/main/AndroidManifest.xml
      - name: Build Android
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      node: 22
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build iOS (Simulator)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build
    artifacts:
      - ios/App/build/**/*.app
