      - name: Generate push notification entitlements
        script: |
          ENTITLEMENTS="ios/App/App/App.entitlements"
          echo "=== Generating push notification entitlements ==="
          cat > "$ENTITLEMENTS" << 'ENTXML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          ENTXML

          # Link entitlements to Xcode project
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' }

          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end

          app_group = project.main_group.find_subpath('App', false)
          existing_ref = app_group.files.find { |f| f.path == 'App.entitlements' }
          if existing_ref.nil?
            app_group.new_file('App.entitlements')
          end

          project.save
          puts "=== Linked App.entitlements to Xcode project ==="
          RUBY_SCRIPT
      - name: Inject UIBackgroundModes into Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          echo "=== Injecting UIBackgroundModes for push notifications ==="
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string fetch" "$PLIST"
            echo "=== UIBackgroundModes added ==="
          else
            echo "=== UIBackgroundModes already present ==="
          fi
          if ! /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST" 2>/dev/null; then
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'Save photos to your library'" "$PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
      - name: Copy app icons
        script: |
          # Copy Ignite icon to iOS app icon (use the highest resolution Android icon)
          # iOS requires 1024x1024 icon named appropriately
          cp android-assets/mipmap-xxxhdpi/ic_launcher.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          echo "=== Copied Ignite icon to iOS ==="
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset/
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set marketing version and auto-increment build number
        script: |
          set -euo pipefail
          ROOT_DIR="$(pwd)"
          APP_VERSION=$(node -p "require('./package.json').version")
          BUNDLE_ID="app.lovable.igniteteamhub"
          PROJECT_FILE="$ROOT_DIR/ios/App/App.xcodeproj/project.pbxproj"
          PLIST_FILE="$ROOT_DIR/ios/App/App/Info.plist"

          APP_ID="${APP_STORE_APPLE_ID:-}"
          if ! echo "$APP_ID" | grep -Eq '^[0-9]+$'; then
            echo "=== APP_STORE_APPLE_ID is not set to a numeric value; resolving by bundle id $BUNDLE_ID ==="
            APPS_JSON=$(app-store-connect apps list \
              --bundle-id-identifier "$BUNDLE_ID" \
              --strict-match-identifier \
              --json)
            APP_ID=$(echo "$APPS_JSON" | node -e "const fs=require('fs'); const input=fs.readFileSync(0,'utf8'); const json=JSON.parse(input); const apps=Array.isArray(json) ? json : (json.data || json.apps || []); const app=apps[0] || {}; const id=app.id || app.appStoreId || (app.attributes && (app.attributes.appleId || app.attributes.appleID)) || ''; process.stdout.write(String(id));")
          fi

          if ! echo "$APP_ID" | grep -Eq '^[0-9]+$'; then
            echo "ERROR: Could not resolve numeric Apple ID for $BUNDLE_ID. Set APP_STORE_APPLE_ID in Codemagic to the App Store Connect Apple ID."
            exit 1
          fi

          latest_build_for_version() {
            local label="$1"
            shift
            local output
            local status
            set +e
            output=$("$@" 2>&1)
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              if echo "$output" | grep -Eiq 'not[[:space:]-]?found|no[[:space:]]+(build|version|resource|data)|does not exist|404'; then
                echo "0"
                return 0
              fi
              echo "ERROR: Could not read latest $label build number from App Store Connect." >&2
              echo "$output" >&2
              return "$status"
            fi

            local parsed
            parsed=$(echo "$output" | tr -d '\r' | grep -Eo '[0-9]+' | tail -1 || true)
            echo "${parsed:-0}"
          }

          LATEST_APP_STORE_GLOBAL=$(latest_build_for_version "App Store" \
            app-store-connect get-latest-app-store-build-number \
              --platform IOS \
              "$APP_ID")
          LATEST_TESTFLIGHT_GLOBAL=$(latest_build_for_version "TestFlight" \
            app-store-connect get-latest-testflight-build-number \
              --platform IOS \
              "$APP_ID")
          LATEST_APP_STORE_VERSION=$(latest_build_for_version "App Store $APP_VERSION" \
            app-store-connect get-latest-app-store-build-number \
              --version-string "$APP_VERSION" \
              --platform IOS \
              "$APP_ID")
          LATEST_TESTFLIGHT_VERSION=$(latest_build_for_version "TestFlight $APP_VERSION" \
            app-store-connect get-latest-testflight-build-number \
              --pre-release-version "$APP_VERSION" \
              --platform IOS \
              "$APP_ID")

          LOCAL_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST_FILE" 2>/dev/null || echo "0")

          LATEST=$LATEST_APP_STORE_GLOBAL
          for candidate in "$LATEST_TESTFLIGHT_GLOBAL" "$LATEST_APP_STORE_VERSION" "$LATEST_TESTFLIGHT_VERSION"; do
            if [ "$candidate" -gt "$LATEST" ]; then
              LATEST="$candidate"
            fi
          done
          NEXT_BUILD_NUMBER=$((LATEST + 1))

          if echo "$LOCAL_BUILD_NUMBER" | grep -Eq '^[0-9]+$' && [ "$LOCAL_BUILD_NUMBER" -gt "$NEXT_BUILD_NUMBER" ]; then
            NEXT_BUILD_NUMBER="$LOCAL_BUILD_NUMBER"
          fi

          echo "=== iOS marketing version: $APP_VERSION ==="
          echo "=== Local committed build number: $LOCAL_BUILD_NUMBER ==="
          echo "=== Latest App Store build overall: $LATEST_APP_STORE_GLOBAL ==="
          echo "=== Latest TestFlight build overall: $LATEST_TESTFLIGHT_GLOBAL ==="
          echo "=== Latest App Store build for $APP_VERSION: $LATEST_APP_STORE_VERSION ==="
          echo "=== Latest TestFlight build for $APP_VERSION: $LATEST_TESTFLIGHT_VERSION ==="
          echo "=== Using next ASC-safe build number: $NEXT_BUILD_NUMBER ==="

          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = $APP_VERSION;/g" "$PROJECT_FILE"
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $NEXT_BUILD_NUMBER;/g" "$PROJECT_FILE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$PLIST_FILE"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD_NUMBER" "$PLIST_FILE"

          cat > "$ROOT_DIR/.codemagic-ios-version.env" <<EOF
          APP_VERSION=$APP_VERSION
          NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER
          EOF
      - name: Add Crashlytics run script to Xcode project
        script: |
          cd ios/App
          ruby << 'RUBY_SCRIPT'
          require 'xcodeproj'
          
          project_path = 'App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' }
          
          # Check if we already added it
          existing = target.shell_script_build_phases.find { |p| p.name == 'Firebase Crashlytics' }
          if existing.nil?
            phase = target.new_shell_script_build_phase('Firebase Crashlytics')
            # Use the official Crashlytics/run script from SPM checkouts
            phase.shell_script = <<~SCRIPT
              if [ "${DWARF_DSYM_FOLDER_PATH}" ]; then
                # Official Firebase Crashlytics run script for SPM
                SCRIPT_PATH="${BUILD_DIR%Build/*}SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
                if [ -f "$SCRIPT_PATH" ]; then
                  echo "Running Firebase Crashlytics script at: $SCRIPT_PATH"
                  "$SCRIPT_PATH"
                else
                  echo "warning: Firebase Crashlytics run script not found at $SCRIPT_PATH"
                  # Fallback: search for upload-symbols
                  UPLOAD_SYMBOLS=$(find "${BUILD_DIR%Build/*}SourcePackages" -name "upload-symbols" -type f 2>/dev/null | head -1)
                  if [ -n "$UPLOAD_SYMBOLS" ]; then
                    echo "Found upload-symbols at: $UPLOAD_SYMBOLS"
                    "$UPLOAD_SYMBOLS" -gsp "${SRCROOT}/App/GoogleService-Info.plist" -p ios "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}"
                  else
                    echo "warning: Could not find upload-symbols binary either"
                  fi
                fi
              fi
            SCRIPT
            phase.input_paths = [
              '${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}',
              '$(SRCROOT)/App/GoogleService-Info.plist',
              '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist'
            ]
            project.save
            puts "=== Added Firebase Crashlytics run script build phase ==="
          else
            puts "=== Firebase Crashlytics run script already exists ==="
          end
          RUBY_SCRIPT
      - name: Build iOS Release
        script: |
          set -euo pipefail
          cd ios/App
          source ../../.codemagic-ios-version.env
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            archive

          ARCHIVE_PLIST="build/App.xcarchive/Products/Applications/App.app/Info.plist"
          echo "=== Archived app version check ==="
          ARCHIVED_MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST")
          ARCHIVED_BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_PLIST")
          echo "$ARCHIVED_MARKETING_VERSION"
          echo "$ARCHIVED_BUILD_NUMBER"

          if [ "$ARCHIVED_MARKETING_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Archived CFBundleShortVersionString ($ARCHIVED_MARKETING_VERSION) does not match package.json version ($APP_VERSION)"
            exit 1
          fi

          if [ "$ARCHIVED_BUILD_NUMBER" != "$NEXT_BUILD_NUMBER" ]; then
            echo "ERROR: Archived CFBundleVersion ($ARCHIVED_BUILD_NUMBER) does not match expected build number ($NEXT_BUILD_NUMBER)"
            exit 1
          fi
      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ~/export_options.plist
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Note: Internal testers are added directly in App Store Connect, not via beta_groups
