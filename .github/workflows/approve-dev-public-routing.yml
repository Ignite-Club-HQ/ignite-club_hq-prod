name: "[TEST] Approve DEV public routing (governor-verified)"
# This is a RELEASE, unlike the read-only DEV routing check.
# On success it writes one revision-bound approval, commits the matching
# generated DEV frontend snapshot and dispatches the DEV website publisher.
on:
  workflow_dispatch:
    inputs:
      expected_configuration_revision:
        description: "Exact DEV configuration revision from the reviewed read-only report (e.g. 0)"
        required: true
        type: string
      confirmation:
        description: "Type APPROVE DEV PUBLIC ROUTING"
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: ignite-mainnet-governor-deployment
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    environment: group-2-admin-controls
    timeout-minutes: 45
    env:
      IGNITE_ICP_ENV: dev
      SNAPSHOT_CHECK_ONLY: "1"
      RECORD_ROUTING_APPROVAL: "0"
      EXPECTED_DEV_ROUTING_CONFIGURATION_REVISION: ${{ inputs.expected_configuration_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Require exact operator confirmation and DEV main branch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Ignite-Club-HQ/ignite-club_hq-prod'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$IGNITE_ICP_ENV" = 'dev'
          test "$CONFIRMATION" = 'APPROVE DEV PUBLIC ROUTING'
          printf '%s' "$EXPECTED_DEV_ROUTING_CONFIGURATION_REVISION" | grep -Eq '^(0|[1-9][0-9]*)$'
          grep -q '"shard_router": "jcdfe-vqaaa-aaaal-qxloq-cai"' deploy/mainnet/.icp/data/mappings/ic.ids.json
          test "$SNAPSHOT_CHECK_ONLY" = '1'
          test "$RECORD_ROUTING_APPROVAL" = '0'
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Test DEV routing release policy
        run: node --test scripts/dev-routing-approval-policy.test.mjs
      - name: Install existing frontend dependencies
        run: node scripts/ensure-frontend-deps.mjs
      - name: Resolve already-authorized notification worker
        env:
          ICP_PUSH_WORKER_SEED: ${{ secrets.ICP_PUSH_WORKER_SEED }}
          PUSH_WORKER_PRINCIPAL: ${{ vars.PUSH_WORKER_PRINCIPAL }}
        run: bash scripts/resolve-group-push-worker.sh
      - name: Restore pinned DEV governor for verified reads only
        env:
          DEPLOYER_PEM: ${{ secrets.GOVERNOR_PEM || secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${DEPLOYER_PEM:-}"
          python3 - "$RUNNER_TEMP/dev-routing-operator.pem" <<'PY'
          import base64, os, re, sys
          raw = os.environ["DEPLOYER_PEM"].replace("\r", "").replace("\\n", "\n")
          raw = re.sub(r"[\u2010-\u2015\u2212]", "-", raw).replace("\u00a0", " ").strip().strip("'\"")
          if "BEGIN" not in raw.upper():
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("ascii")
                  if "BEGIN" in decoded.upper(): raw = decoded
              except Exception:
                  pass
          pattern = r"-{2,}\s*BEGIN\s+((?:EC\s+)?PRIVATE\s+KEY)\s*-{2,}(.*?)-{2,}\s*END\s+\1\s*-{2,}"
          found = re.search(pattern, raw, re.S | re.I)
          if not found:
              raise SystemExit("Pinned DEV governor secret is missing or malformed; no canister changed")
          label = re.sub(r"\s+", " ", found.group(1).upper())
          body = re.sub(r"\s+", "", found.group(2))
          if not re.fullmatch(r"[A-Za-z0-9+/=]+", body):
              raise SystemExit("Governor key content malformed; no canister changed")
          lines = "\n".join(body[i:i+64] for i in range(0, len(body), 64))
          with open(sys.argv[1], "w") as handle:
              handle.write(f"-----BEGIN {label}-----\n{lines}\n-----END {label}-----\n")
          PY
      - name: Re-verify fresh DEV group and removal evidence without writes
        working-directory: frontend
        run: |
          set -euo pipefail
          npx --yes tsx@4 scripts/produce-routing-gates.ts \
            "$RUNNER_TEMP/dev-routing-operator.pem" \
            "$RUNNER_TEMP/dev-public-routing-preflight.json"
      - name: Bind intended approval to verified configuration revision and digest
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { validateDevRoutingEvidence } from './scripts/dev-routing-approval-policy.mjs';
          const evidence=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/dev-public-routing-preflight.json','utf8'));
          const verified=validateDevRoutingEvidence(evidence,process.env.EXPECTED_DEV_ROUTING_CONFIGURATION_REVISION);
          appendFileSync(process.env.GITHUB_ENV,'EXPECTED_DEV_ROUTING_CONFIGURATION_SHA256='+verified.approvedConfigurationSha256+'\n');
          console.log('DEV release bound to group '+verified.groupIds.join(',')+' at configuration revision '+verified.configurationRevision);
          console.log('Expected DEV configuration sha256: '+verified.approvedConfigurationSha256);
          JS
      - name: Record exactly the re-verified DEV routing approval and regenerate snapshot
        working-directory: frontend
        env:
          SNAPSHOT_CHECK_ONLY: "0"
          RECORD_ROUTING_APPROVAL: "1"
        run: |
          set -euo pipefail
          test "$IGNITE_ICP_ENV" = dev
          test "$RECORD_ROUTING_APPROVAL" = 1
          test "$SNAPSHOT_CHECK_ONLY" = 0
          test -n "$EXPECTED_DEV_ROUTING_CONFIGURATION_SHA256"
          npx --yes tsx@4 scripts/produce-routing-gates.ts \
            "$RUNNER_TEMP/dev-routing-operator.pem" \
            "$RUNNER_TEMP/dev-public-routing-release.json"
      - name: Verify the released snapshot matches the signed preflight
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { validateDevRoutingEvidence } from './scripts/dev-routing-approval-policy.mjs';
          const preflight=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/dev-public-routing-preflight.json','utf8'));
          const released=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/dev-public-routing-release.json','utf8'));
          const a=validateDevRoutingEvidence(preflight,process.env.EXPECTED_DEV_ROUTING_CONFIGURATION_REVISION);
          const b=validateDevRoutingEvidence(released,process.env.EXPECTED_DEV_ROUTING_CONFIGURATION_REVISION);
          if(a.approvedConfigurationSha256!==b.approvedConfigurationSha256 ||
            b.approvedConfigurationSha256!==process.env.EXPECTED_DEV_ROUTING_CONFIGURATION_SHA256)throw Error('Released routing configuration differed from verified DEV preflight');
          console.log('DEV routing approval readback and matching snapshot verified by signed publisher.');
          JS
      - name: Commit the exact generated DEV snapshot, and no other file
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          git config user.name 'ignite-governor-bot'
          git config user.email 'noreply@igniteclubhq.app'
          git add frontend/src/live/generated/routingGates.ts
          git diff --cached --name-only | grep -Fx 'frontend/src/live/generated/routingGates.ts'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'chore: publish reviewed DEV routing approval snapshot [skip ci]'
          git push origin HEAD:main
      - name: Dispatch the existing DEV frontend publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          gh workflow run deploy-frontend-canister.yml --ref main
          echo 'DEV frontend publish dispatched; inspect its separate workflow result.'
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dev-routing-operator.pem"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-public-routing-release-evidence
          path: |
            ${{ runner.temp }}/dev-public-routing-preflight.json
            ${{ runner.temp }}/dev-public-routing-release.json
          if-no-files-found: warn
