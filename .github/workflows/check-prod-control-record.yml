name: "[PROD] Inspect live control record (read-only)"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ignite-prod-governor-deployment
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require exact production context
        run: |
          test "$GITHUB_REPOSITORY" = 'Ignite-Club-HQ/ignite-club_hq-prod'
          test "$GITHUB_REF" = 'refs/heads/prod'
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install isolated inspection library
        run: npm install --prefix "$RUNNER_TEMP/control-deps" @icp-sdk/core@6.1.1 --no-fund --no-audit
      - name: Read control record and receiver settings only
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          PROD_GOVERNOR_PRINCIPAL: ${{ vars.PROD_GOVERNOR_PRINCIPAL }}
          IGNITE_ICP_ENV: prod
        run: |
          set -euo pipefail
          umask 077
          KEYDIR="$RUNNER_TEMP/control-key"
          mkdir -p "$KEYDIR" "$RUNNER_TEMP/control-report"
          trap 'rm -rf "$KEYDIR"' EXIT
          test -n "$PROD_GOVERNOR_PEM_ENC"
          test -n "$PROD_GOVERNOR_PASSPHRASE"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$KEYDIR/key.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$KEYDIR/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$KEYDIR/key.enc" -out "$KEYDIR/key.pem" -pass file:"$KEYDIR/pass"
          export CHECK_KEY_PEM="$KEYDIR/key.pem"
          export CHECK_DEPS_DIR="$RUNNER_TEMP/control-deps"
          export CHECK_REPORT_DIR="$RUNNER_TEMP/control-report"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {readRoutingGate} from './scripts/prod-routing-gate.mjs';
          const e=process.env;
          const {ids,agent,Actor,IDL,Principal,page}=await readRoutingGate(e,{log:false});
          const account=Actor.createActor(()=>IDL.Service({read_production_account_authorization:IDL.Func([],[IDL.Variant({Ok:IDL.Record({generation:IDL.Nat64,approval:IDL.Opt(IDL.Record({}))}),Err:IDL.Text})],[])}),{agent,canisterId:ids.identity_access});
          const out={checkedAt:new Date().toISOString(),approvalPresent:null,generation:null,rows:[],changesMade:false,openingAuthorized:false};
          try{const r=await account.read_production_account_authorization();if('Ok' in r){out.approvalPresent=r.Ok.approval.length===1;out.generation=r.Ok.generation.toString();}else out.authorizationRead='REFUSED';}catch{out.authorizationRead='UNREADABLE';}
          console.log('CONTROL RECORD: '+JSON.stringify({approvalPresent:out.approvalPresent,generation:out.generation,authorizationRead:out.authorizationRead}));
          const targets=new Map(Object.entries(ids).map(([name,id])=>[id,{name,id,group:'base/shared'}]));
          if(page.groups.length!==2)throw Error('Two registered groups required');
          for(const g of page.groups){if(g.domains.length>13)throw Error('Inventory bound');for(const d of g.domains)if(!targets.has(d.canister))targets.set(d.canister,{name:d.domain,id:d.canister,group:g.id});for(const id of g.photo_store)if(!targets.has(id))targets.set(id,{name:'media_blob_store',id,group:g.id});}
          if(targets.size>32)throw Error('Inventory bound');
          for(const t of targets.values()){
           const row={...t,controlUse:'UNVERIFIED'};
           if(t.name==='identity_access')row.controlUse=out.approvalPresent===false?'NO_SIGNED_CONTROL_RECORD':out.approvalPresent===true?'STORED_APPROVAL_PRESENT_NOT_LIVE_ACCEPTANCE':'UNVERIFIED';
           else if(['placement_registry','migration_coordinator'].includes(t.name))row.controlUse='NOT_A_CONTROL_RECEIVER';
           else try{
            const mgmt=Actor.createActor(()=>IDL.Service({canister_status:IDL.Func([IDL.Record({canister_id:IDL.Principal})],[IDL.Record({settings:IDL.Record({environment_variables:IDL.Vec(IDL.Record({name:IDL.Text,value:IDL.Text}))})})],[])}),{agent,canisterId:'aaaaa-aa',effectiveCanisterId:Principal.fromText(t.id)});
            const s=await mgmt.canister_status({canister_id:Principal.fromText(t.id)});
            const get=k=>s.settings.environment_variables.find(v=>v.name===k)?.value;
            row.admissionEnabled=get('IGNITE_ACCOUNT_ADMISSION_RELEASE')==='1';row.removalEnabled=get('IGNITE_ACCOUNT_REMOVAL_RELEASE')==='1';row.rehearsal=get('IGNITE_ACCOUNT_GROUP_LOCAL_REHEARSAL')==='1';row.authorityMatches=get('IGNITE_ACCOUNT_SERVICE_IDENTITY')===ids.identity_access;
            row.controlUse=row.rehearsal?'REHEARSAL_NOT_PRODUCTION':!row.admissionEnabled||!row.removalEnabled?'PROTECTION_NOT_ENABLED':!row.authorityMatches?'AUTHORITY_NOT_BOUND':out.approvalPresent!==true?'NO_CONFIRMED_SIGNED_CONTROL_RECORD':'CONFIGURED_EFFECTIVE_READBACK_STILL_REQUIRED';
           }catch{row.settingsRead='UNREADABLE';}
           out.rows.push(row);console.log('SERVICE: '+JSON.stringify(row));
          }
          out.groups=page.groups.map(g=>({id:g.id,accepting:g.accepting}));console.log('GROUPS: '+JSON.stringify(out.groups));
          console.log('No settings, grants, data, counters or admission changes attempted.');
          writeFileSync(e.CHECK_REPORT_DIR+'/control-record.json',JSON.stringify(out,null,2));
          JS
      - name: Save read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-control-record
          path: ${{ runner.temp }}/control-report/*.json
          if-no-files-found: ignore