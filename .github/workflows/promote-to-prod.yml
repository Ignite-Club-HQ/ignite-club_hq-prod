name: Promote to Prod

# When a merge lands on the `prod` branch, run any pending Supabase migrations
# and deploy edge functions to Supabase PROD *before* Netlify / Codemagic
# rebuild the frontend against the same commit. If migrations or function
# deploys fail, the frontend never ships → no schema/UI mismatch possible.
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN      — personal access token from
#                                https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROD_PROJECT_REF  — yabcfiuntwqjwvschnji
#   SUPABASE_DB_PASSWORD       — the prod DB password (Project Settings →
#                                Database → Connection string). Required by
#                                `supabase db push` and `pg_dump` for a
#                                non-interactive run.
#
# Pre-promotion backup:
#   Before applying any migrations we run `pg_dump` against prod and upload the
#   dump as a workflow artifact (retained 30 days). To roll back, download the
#   artifact and follow scripts/restore-prod-backup.sh.


on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch: {}

concurrency:
  group: promote-to-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Migrate + deploy backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out prod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets are present
        run: |
          missing=0
          for var in SUPABASE_ACCESS_TOKEN PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Link to Supabase PROD project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Preflight — direct PROD DB connectivity + auth check
        # Fail FAST (before backup, guard, repair, migrate) if the runner
        # can't reach the prod DB direct endpoint or the password is wrong.
        # Supabase recommends direct connections for migrations/pg_dump. This
        # requires the IPv4 add-on from GitHub-hosted runners.
        run: |
          set -euo pipefail
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null 2>&1
          DB_HOST="db.${PROJECT_REF}.supabase.co"
          echo "Pinging $DB_HOST:5432 as postgres …"
          if ! PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
               "postgresql://postgres@${DB_HOST}:5432/postgres?sslmode=require&connect_timeout=10" \
               -v ON_ERROR_STOP=1 -c "select 1 as ping, current_user, inet_server_addr();" ; then
            echo ""
            echo "::error::Preflight failed — cannot reach prod DB direct endpoint."
            echo "Check: SUPABASE_PROD_PROJECT_REF is the PROD ref, SUPABASE_DB_PASSWORD is the PROD DB password, and the Supabase IPv4 add-on has finished provisioning."
            exit 1
          fi
          echo "✅ Preflight passed — direct PROD DB reachable and password valid."

      - name: List pending migrations
        run: supabase migration list --linked

      - name: Preview pending migration SQL
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi
          echo "=== Migration files changed since $BEFORE ==="
          git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ || true

          echo ""
          echo "=== SQL content ==="
          git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ | while read -r file; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              cat "$file"
              echo ""
            fi
          done

      - name: Guard against destructive migrations
        # Fails the job (before backup/apply) if any pending migration file
        # contains DML/DDL that could nuke prod media rows or their URL columns.
        # This is a safety net for accidental "fix dev images" queries that
        # slip into supabase/migrations/ and would otherwise run against prod.
        # Whitelist a specific migration by adding a line containing the exact
        # marker:  -- promote-guard: allow  (only do this after human review).
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi

          FILES=$(git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ || true)
          if [ -z "$FILES" ]; then
            echo "No pending migration files — guard passes."
            exit 0
          fi

          # Case-insensitive, whitespace-tolerant patterns.
          # Blocks writes/drops targeting media-bearing tables or their URL cols.
          PATTERNS='(UPDATE|DELETE[[:space:]]+FROM|TRUNCATE)[[:space:]]+(ONLY[[:space:]]+)?(public\.)?(photos|vault_files|group_messages|club_messages|team_messages|direct_messages|gallery_chat_cards)\b|DROP[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?(public\.)?(photos|vault_files|group_messages|club_messages|team_messages|direct_messages|gallery_chat_cards)\b|DROP[[:space:]]+COLUMN[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?(image_url|file_url|hero_image_url)\b'

          failed=0
          for file in $FILES; do
            [ -f "$file" ] || continue
            if grep -qiE -- '--[[:space:]]*promote-guard:[[:space:]]*allow' "$file"; then
              echo "⚠️  $file has promote-guard allow marker — skipping."
              continue
            fi
            if grep -niE -- "$PATTERNS" "$file"; then
              echo "::error file=$file::Migration contains a statement that could destroy prod media data. Review and either remove the statement or add the marker '-- promote-guard: allow' after human review."
              failed=1
            fi
          done

          if [ "$failed" = "1" ]; then
            echo ""
            echo "❌ Promotion halted BEFORE backup/apply. No changes made to prod."
            exit 1
          fi
          echo "✅ Guard passed — no destructive statements against media tables."


      - name: Backup PROD schema + roles (pre-migration)
        if: github.event_name == 'push'
        id: backup
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILE="prod-schema-backup-${STAMP}-${GITHUB_SHA::7}.tar.gz"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          # Schema + roles only — fast (~15s). Row data is captured by the
          # nightly-backup workflow (.github/workflows/nightly-backup.yml).
          supabase db dump --linked -f prod-schema.sql
          supabase db dump --linked --role-only -f prod-roles.sql
          tar czf "$FILE" prod-schema.sql prod-roles.sql
          ls -lh "$FILE"

      - name: Upload backup artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.file }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 30
          if-no-files-found: error


      - name: Repair migration history drift
        # Prod's supabase_migrations.schema_migrations table contains legacy
        # Lovable-applied migration versions from before the dev/prod split.
        # Those SQL statements were physically run against prod (tables,
        # functions, RLS all exist), but the corresponding files never made
        # it into this repo. `supabase db push` refuses to run while local
        # and remote histories diverge.
        #
        # We mark every prod-only version as `applied` (NOT `reverted`).
        # `applied` = "prod already ran this, skip on push" — correct because
        # the objects really are there. `reverted` = "run it next push",
        # which would try to CREATE TABLE on tables that already exist and
        # fail with 42P07. `repair` never runs the migration SQL itself; it
        # only writes to supabase_migrations.schema_migrations.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          echo "=== Fetching remote migration list ==="
          supabase migration list --linked 2>&1 | tee /tmp/mig-list.txt

          echo ""
          echo "=== Probing for drift via db push (dry) ==="
          supabase db push --linked --dry-run 2>&1 | tee /tmp/mig-push.txt || true

          # Union both outputs, then subtract local files. Anything left is
          # a remote-only version that must be marked applied.
          ALL_VERSIONS=$(cat /tmp/mig-list.txt /tmp/mig-push.txt \
            | grep -oE '\b[0-9]{14}\b' | sort -u)
          LOCAL_VERSIONS=$(ls supabase/migrations 2>/dev/null \
            | grep -oE '^[0-9]{14}' | sort -u || true)
          ORPHANS=$(comm -23 <(echo "$ALL_VERSIONS") <(echo "$LOCAL_VERSIONS") \
            | grep -E '^[0-9]{14}$' || true)

          if [ -z "$ORPHANS" ]; then
            echo "✅ No migration history drift — nothing to repair."
            exit 0
          fi

          echo ""
          echo "=== Prod-only migration versions (will be marked applied in history) ==="
          echo "$ORPHANS"
          COUNT=$(echo "$ORPHANS" | wc -l)
          echo "Total: $COUNT"
          echo ""

          # `supabase migration repair` accepts multiple versions per call.
          # Batch in groups of 20 to stay well under arg-length limits.
          echo "$ORPHANS" | xargs -n 20 supabase migration repair --linked --status applied

          echo ""
          echo "=== Post-repair migration list ==="
          supabase migration list --linked

      - name: Skip dev-only / Supabase-incompatible local migrations in PROD
        # These local migration files were useful in dev but must never execute
        # against prod:
        # - 20260709095105 refreshes database collation metadata. Supabase does
        #   not allow app migrations to alter the managed `postgres` database.
        # - 20260712224730 seeds a synthetic no-club auth user for reviewer QA.
        #   Prod auth users are real customer accounts and must not be seeded by
        #   the promotion pipeline.
        #
        # Marking them `applied` is metadata-only: it tells db push to skip the
        # files and does not run their SQL.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          SKIP_VERSIONS=(
            20260709095105
            20260712224730
          )

          echo "Marking known dev-only / incompatible migrations as applied in PROD history:"
          printf '  - %s\n' "${SKIP_VERSIONS[@]}"
          printf '%s\n' "${SKIP_VERSIONS[@]}" \
            | xargs -n 20 supabase migration repair --linked --status applied || true

          echo "=== Migration state after PROD skip marks ==="
          supabase migration list --linked

      - name: Pre-mark already-in-prod local migrations as applied
        # Some local migration files describe objects (tables, indexes,
        # triggers, policies) that already physically exist in prod from
        # a previous partially-run promotion attempt. `db push` would try
        # to re-run their CREATE statements and fail with 42P07 / 42710.
        #
        # For each version listed below, we check prod for a signature
        # object; if it exists, we mark the local version `applied` so
        # push skips it. Safe idempotent operation — only touches the
        # bookkeeping table, never runs the migration SQL.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # Uses Supabase Management API — no direct DB connection needed,
          # avoids IPv6-only db.<ref>.supabase.co issues from GH runners.
          API="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"

          run_check() {
            local sql="$1"
            curl -sS -X POST "$API" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -cn --arg q "$sql" '{query:$q}')"
          }

          # version : SQL existence check
          declare -A CHECKS=(
            ["20260701193827"]="SELECT 1 AS hit FROM pg_tables WHERE schemaname='public' AND tablename='chat_group_unread'"
            ["20260701195506"]="SELECT 1 AS hit FROM pg_publication_tables WHERE pubname='supabase_realtime' AND schemaname='public' AND tablename='chat_group_unread'"
            ["20260703024653"]="SELECT 1 AS hit FROM pg_policies WHERE schemaname='public' AND tablename='child_team_assignments' AND policyname='Guardians can view assignments for linked children'"
            ["20260703081313"]="SELECT 1 AS hit FROM pg_tables WHERE schemaname='public' AND tablename='inbox_open_perf'"
            ["20260708013949"]="SELECT 1 AS hit FROM pg_trigger WHERE tgname='team_messages_update_parent_preview'"
            ["20260708222650"]="SELECT 1 AS hit FROM pg_policies WHERE schemaname='public' AND tablename='active_games_write_log' AND policyname='App admins can view write audit log'"
            ["20260713003316"]="SELECT 1 AS hit FROM pg_trigger WHERE tgname='trg_cascade_club_soft_delete'"
          )

          TO_MARK=()
          for VERSION in "${!CHECKS[@]}"; do
            RESP=$(run_check "${CHECKS[$VERSION]}")
            if ! echo "$RESP" | jq empty >/dev/null 2>&1; then
              echo "::error::Supabase Management API returned non-JSON while checking migration $VERSION: $RESP"
              exit 1
            fi

            # Supabase's Management API has returned both shapes over time:
            #   [{"hit":1}]
            #   {"result":[{"hit":1}]}
            # Be deliberately tolerant so a response-shape change does not
            # silently skip the pre-mark step and let db push hit 42P07/42710.
            HIT=$(echo "$RESP" | jq -r '
              if type == "array" then
                (.[0].hit // empty)
              elif type == "object" then
                (.result[0].hit? // .data[0].hit? // .rows[0].hit? // empty)
              else
                empty
              end
            ')
            if [ "$HIT" = "1" ]; then
              echo "🔧 $VERSION — signature object exists in prod, will mark applied"
              TO_MARK+=("$VERSION")
            else
              echo "✅ $VERSION — signature object NOT in prod, will run normally (response: $RESP)"
            fi
          done

          if [ ${#TO_MARK[@]} -gt 0 ]; then
            printf '%s\n' "${TO_MARK[@]}" | xargs -n 20 supabase migration repair --linked --status applied
          fi

      - name: Apply pending migrations
        if: github.event_name == 'push'
        env:
          # Force non-TTY / plain output so the CLI does not swallow the
          # Postgres error behind a spinner or ANSI redraw. Without this,
          # `supabase db push` can exit 1 with a completely empty log.
          NO_COLOR: "1"
          TERM: "dumb"
          CI: "true"
        run: |
          set -euo pipefail
          echo "=== Supabase CLI version ==="
          supabase --version
          echo ""

          echo "=== CONNECTION CHECK (auth / link / network) ==="
          echo "-- Linked project:"
          supabase projects list 2>&1 | tee /tmp/supabase-projects.log || true
          echo ""
          echo "-- Direct DB reachability (select 1):"
          # Ensure psql is present; ignore if apt is slow.
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null 2>&1 || true
          if command -v psql >/dev/null; then
            PGPASSWORD="${SUPABASE_DB_PASSWORD:-${PROD_DB_PASSWORD:-}}" \
              psql "postgresql://postgres@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require&connect_timeout=10" \
              -v ON_ERROR_STOP=1 -c "select 1 as ping;" 2>&1 | tee /tmp/supabase-ping.log || echo "(ping failed — likely auth/network, not SQL)"
          fi
          echo ""

          echo "=== Migration state immediately before db push ==="
          supabase migration list --linked 2>&1 || true
          echo ""

          # GitHub-hosted runners are IPv4-only. Now that PROD has the IPv4
          # add-on, use Supabase's direct DB endpoint for migrations (the
          # recommended path for pg_dump / db push) instead of the shared
          # pooler, which can fail with "tenant/user ... not found" if the
          # pooler username/ref is not recognised.
          ENC_PW=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''))")
          DB_HOST="db.${PROJECT_REF}.supabase.co"
          DB_URL="postgresql://postgres:${ENC_PW}@${DB_HOST}:5432/postgres?sslmode=require&connect_timeout=10"
          # Do NOT echo DB_URL — contains password.
          echo "Using direct PROD DB host: $DB_HOST (port 5432)"

          echo "=== Dry-run immediately before db push ==="
          supabase db push --db-url "$DB_URL" --dry-run --yes --debug 2>&1 | tee /tmp/supabase-db-push-dry-run.log || true
          echo ""

          echo "=== Applying pending migrations ==="
          set +e
          # 2>&1 merges stderr into the pipe — Supabase CLI writes the actual
          # Postgres ERROR: line to stderr, which the previous version missed.
          supabase db push --db-url "$DB_URL" --yes --debug 2>&1 | tee /tmp/supabase-db-push.log
          PUSH_STATUS=${PIPESTATUS[0]}
          set -e


          if [ "$PUSH_STATUS" -ne 0 ]; then
            # Print bulky context first (inside collapsible groups) so the
            # short error summary is the LAST thing in the step log — no
            # scrolling through thousands of lines to find the failure.
            echo "::group::Dry-run log (last 200 lines)"
            tail -n 200 /tmp/supabase-db-push-dry-run.log || true
            echo "::endgroup::"

            echo "::group::Apply log (last 500 lines)"
            tail -n 500 /tmp/supabase-db-push.log || true
            echo "::endgroup::"

            echo "::group::Migration state after failed db push"
            supabase migration list --linked || true
            echo "::endgroup::"

            # Extract likely Postgres/CLI error lines, but do NOT rely on grep
            # alone: Supabase CLI sometimes exits 1 without a line containing
            # "ERROR". The raw tail below is therefore printed ungrouped at the
            # very bottom so the useful context is visible on mobile GitHub.
            ERR_LINES=$(grep -nEi 'error|failed|fatal|panic|duplicate|already exists|does not exist|violates|permission denied|syntax error|exit status|exit code|returned non-zero|migration .* failed|failed to apply' /tmp/supabase-db-push.log | grep -viE 'no such|^\s*$' | tail -n 40 || true)
            DRY_ERR_LINES=$(grep -nEi 'error|failed|fatal|panic|duplicate|already exists|does not exist|violates|permission denied|syntax error|exit status|exit code|returned non-zero|migration .* failed|failed to apply' /tmp/supabase-db-push-dry-run.log | grep -viE 'no such|^\s*$' | tail -n 20 || true)

            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "  ❌ SUPABASE DB PUSH FAILED — exit code $PUSH_STATUS"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            echo "── Error lines from APPLY log (most recent 40) ──"
            if [ -n "$ERR_LINES" ]; then
              echo "$ERR_LINES"
            else
              echo "(no matching error lines found — see Apply log group above)"
            fi
            echo ""
            echo "── Error lines from DRY-RUN log (most recent 20) ──"
            if [ -n "$DRY_ERR_LINES" ]; then
              echo "$DRY_ERR_LINES"
            else
              echo "(none)"
            fi
            echo ""
            echo "Full logs are uploaded as artifact:"
            echo "  supabase-promotion-logs-${GITHUB_RUN_ID}"
            echo ""
            echo "── RAW APPLY LOG TAIL (last 120 lines, ungrouped) ──"
            tail -n 120 /tmp/supabase-db-push.log || true
            echo ""
            echo "── RAW DRY-RUN LOG TAIL (last 60 lines, ungrouped) ──"
            tail -n 60 /tmp/supabase-db-push-dry-run.log || true
            echo ""

            echo "── FIRST LOCAL MIGRATION STILL NOT APPLIED ──"
            if command -v psql >/dev/null; then
              REMOTE_APPLIED=/tmp/prod-applied-versions.txt
              LOCAL_VERSIONS=/tmp/local-migration-versions.txt
              psql "$DB_URL" -Atc "select version from supabase_migrations.schema_migrations order by version" \
                > "$REMOTE_APPLIED" 2>/tmp/prod-applied-versions.err || true
              ls supabase/migrations 2>/dev/null | grep -oE '^[0-9]{14}' | sort -u > "$LOCAL_VERSIONS" || true
              NEXT_VERSION=$(comm -23 "$LOCAL_VERSIONS" "$REMOTE_APPLIED" | head -n 1 || true)
              if [ -n "$NEXT_VERSION" ]; then
                NEXT_FILE=$(ls supabase/migrations/${NEXT_VERSION}_*.sql 2>/dev/null | head -n 1 || true)
                echo "Next not-applied local version: $NEXT_VERSION"
                echo "File: ${NEXT_FILE:-unknown}"
                if [ -n "$NEXT_FILE" ]; then
                  if grep -qiE '^\s*ALTER\s+DATABASE' "$NEXT_FILE"; then
                    echo "Classification: contains ALTER DATABASE — not suitable for Supabase managed prod migrations."
                  elif grep -qiE '\bINSERT\s+INTO\s+auth\.|\bUPDATE\s+auth\.|\bDELETE\s+FROM\s+auth\.' "$NEXT_FILE"; then
                    echo "Classification: touches Supabase auth schema — likely dev-only data migration and unsafe for prod."
                  elif grep -qiE '\bCREATE\s+(TABLE|TYPE|TRIGGER|POLICY|INDEX)\b' "$NEXT_FILE"; then
                    echo "Classification: creates database objects — check for an already-exists collision in prod."
                  else
                    echo "Classification: general SQL migration — inspect artifact logs for the exact statement."
                  fi
                fi
              else
                echo "Could not identify a remaining local pending migration from supabase_migrations."
              fi
            else
              echo "psql unavailable, cannot query prod migration history."
            fi
            echo ""
            echo "════════════════════════════════════════════════════════════"

            # First real error line becomes the GitHub Actions annotation
            # shown at the top of the run summary page.
            FIRST_ERR=$(echo "$ERR_LINES" | head -n 1)
            if [ -n "$FIRST_ERR" ]; then
              echo "::error::db push failed — $FIRST_ERR"
            else
              echo "::error::supabase db push failed with exit code $PUSH_STATUS (no error line matched — check Apply log group)"
            fi

            exit "$PUSH_STATUS"
          fi

      - name: Upload Supabase migration logs on failure
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-promotion-logs-${{ github.run_id }}
          path: |
            /tmp/supabase-db-push.log
            /tmp/supabase-db-push-dry-run.log
          retention-days: 7
          if-no-files-found: warn

      - name: Deploy edge functions
        if: github.event_name == 'push'
        # Deploys every function under supabase/functions/. Individual function
        # config (verify_jwt, import_map, etc.) still comes from
        # supabase/config.toml.
        run: supabase functions deploy --project-ref "$PROJECT_REF"


      - name: Success
        run: |
          echo "✅ Backend promoted. Netlify + Codemagic will now build the"
          echo "   frontend against commit $GITHUB_SHA."
