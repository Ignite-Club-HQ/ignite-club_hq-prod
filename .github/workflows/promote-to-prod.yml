name: Promote to Prod

# When a merge lands on `prod`, apply any pending Supabase migrations and
# deploy edge functions BEFORE Netlify / Codemagic rebuild the frontend
# against the same commit. If migrations or function deploys fail, the
# frontend never ships → no schema/UI mismatch possible.
#
# History context (2026-07-14): prod was one-time baselined by running
# scripts/generate-baseline.sql in the prod SQL editor. Every local
# migration file with version <= 20260712224730 was inserted into
# supabase_migrations.schema_migrations (metadata only, no SQL executed).
# From that point forward, only NEW dev-authored migrations run in prod
# and `supabase db push` works with zero special handling.
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN      — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROD_PROJECT_REF  — yabcfiuntwqjwvschnji
#   SUPABASE_DB_PASSWORD       — prod DB password (Project Settings → Database)
#   SUPABASE_SERVICE_ROLE_KEY  — prod service-role key, seeded into the prod
#                                Vault so the push-delivery preflight migration
#                                passes. Override with SUPABASE_PROD_SERVICE_ROLE_KEY
#                                if the generic secret points at another project.



on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch: {}

concurrency:
  group: promote-to-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Migrate + deploy backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out prod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets are present
        run: |
          missing=0
          for var in SUPABASE_ACCESS_TOKEN PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Link to Supabase PROD project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Preflight — direct PROD DB connectivity + auth
        # Fail fast if the runner can't reach prod's direct DB endpoint
        # (requires Supabase IPv4 add-on) or the password is wrong.
        run: |
          set -euo pipefail
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null 2>&1
          DB_HOST="db.${PROJECT_REF}.supabase.co"
          echo "Pinging $DB_HOST:5432 as postgres …"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql \
            "postgresql://postgres@${DB_HOST}:5432/postgres?sslmode=require&connect_timeout=10" \
            -v ON_ERROR_STOP=1 -c "select 1 as ping, current_user;"
          echo "✅ Preflight passed."

      - name: List pending migrations
        run: supabase migration list --linked

      - name: Preview pending migration SQL
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi
          echo "=== Migration files changed since $BEFORE ==="
          git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ || true
          echo ""
          echo "=== SQL content ==="
          git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ | while read -r file; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              cat "$file"
              echo ""
            fi
          done

      - name: Guard against destructive migrations
        # Fails the job (before backup/apply) if any NEW migration file in
        # this promotion contains DML/DDL that could nuke prod rows on a
        # high-value table AT MIGRATION TIME. SQL inside CREATE FUNCTION /
        # CREATE PROCEDURE / DO $$...$$ bodies is stripped before scanning
        # because that SQL only runs later, per RPC call, gated by the
        # function's own security checks — it is not executed by db push.
        #
        # Whitelist a specific file by adding a line (only after human review):
        #   -- promote-guard: allow
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi

          FILES=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- supabase/migrations/ | sed '/^$/d' || true)
          if [ -z "$FILES" ]; then
            echo "No new/modified migration files — guard passes."
            exit 0
          fi
          echo "Scanning $(echo "$FILES" | wc -l) new/modified migration file(s)."

          TABLES='photos|vault_files|vault_folders|vault_drive_links|group_messages|club_messages|team_messages|direct_messages|match_messages|gallery_chat_cards|chat_groups|profiles|clubs|teams|user_roles|events|rsvps|children|club_subscriptions|team_subscriptions|member_subscription_payments|iap_transactions|notifications|fcm_tokens|push_subscriptions'
          PATTERNS="(UPDATE|DELETE[[:space:]]+FROM|TRUNCATE)[[:space:]]+(ONLY[[:space:]]+)?(public\\.)?(${TABLES})\\b|DROP[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?(public\\.)?(${TABLES})\\b|DROP[[:space:]]+COLUMN[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?(image_url|file_url|hero_image_url|avatar_url|logo_url)\\b"

          failed=0
          for file in $FILES; do
            [ -f "$file" ] || continue
            if grep -qiE -- '--[[:space:]]*promote-guard:[[:space:]]*allow' "$file"; then
              echo "⚠️  $file has promote-guard allow marker — skipping."
              continue
            fi

            # Strip dollar-quoted bodies (CREATE FUNCTION/PROCEDURE/DO blocks).
            # Supports named tags too: $body$ ... $body$, $func$ ... $func$, etc.
            # Anything between matching $TAG$ delimiters is removed before
            # scanning so RPC bodies don't false-positive.
            SCAN=$(python3 - "$file" <<'PY'
          import re, sys
          src = open(sys.argv[1], 'r', encoding='utf-8', errors='replace').read()
          # Non-greedy match on identical opening/closing dollar tags.
          stripped = re.sub(
              r"\$(?P<tag>[A-Za-z0-9_]*)\$.*?\$(?P=tag)\$",
              "\n-- [stripped dollar-quoted body]\n",
              src,
              flags=re.DOTALL,
          )
          sys.stdout.write(stripped)
          PY
          )
            if echo "$SCAN" | grep -niE -- "$PATTERNS"; then
              echo "::error file=$file::Migration contains a statement that could destroy prod data on a protected table AT MIGRATION TIME. Remove it or add '-- promote-guard: allow' after human review."
              failed=1
            fi
          done

          if [ "$failed" = "1" ]; then
            echo "❌ Promotion halted BEFORE backup/apply. No changes made to prod."
            exit 1
          fi
          echo "✅ Guard passed."

      - name: Detect changed edge functions
        if: github.event_name == 'push'
        id: edge_functions
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi

          CHANGED=$(git diff --name-only "$BEFORE" HEAD -- 'supabase/functions/**' \
            | awk -F/ 'NF>=3 && $1=="supabase" && $2=="functions" {print $3}' \
            | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy_all=false" >> "$GITHUB_OUTPUT"
            echo "functions=" >> "$GITHUB_OUTPUT"
            echo "✅ No edge function changes detected for this push."
            exit 0
          fi

          if echo "$CHANGED" | grep -qx '_shared'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "deploy_all=true" >> "$GITHUB_OUTPUT"
            echo "functions=" >> "$GITHUB_OUTPUT"
            echo "⚠️  supabase/functions/_shared changed — deploy step will redeploy all functions after migrations pass."
            exit 0
          fi

          FUNCS=""
          for name in $CHANGED; do
            if [ -f "supabase/functions/$name/index.ts" ]; then
              FUNCS="$FUNCS $name"
            else
              echo "ℹ️  '$name' changed but has no index.ts on disk — likely deleted; deploy step will skip it."
            fi
          done
          FUNCS=$(echo $FUNCS | xargs || true)

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "deploy_all=false" >> "$GITHUB_OUTPUT"
          echo "functions=$FUNCS" >> "$GITHUB_OUTPUT"
          if [ -z "$FUNCS" ]; then
            echo "✅ Edge function paths changed, but no deployable function directories remain."
          else
            echo "Edge functions queued for deploy after migrations pass: $FUNCS"
          fi


      - name: Skip dev-only migrations in PROD
        # Files whose first 5 lines contain:  -- prod-skip: dev-only
        # are marked applied in prod history without running their SQL.
        # Use for dev-only fixtures (synthetic accounts, collation refresh, etc.).
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          SKIP_VERSIONS=()
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            if head -5 "$f" | grep -qiE -- '--[[:space:]]*prod-skip:[[:space:]]*dev-only'; then
              v=$(basename "$f" | grep -oE '^[0-9]{14}' || true)
              [ -n "$v" ] || continue
              SKIP_VERSIONS+=("$v")
              echo "  - $v  ($(basename "$f"))"
            fi
          done
          if [ ${#SKIP_VERSIONS[@]} -eq 0 ]; then
            echo "✅ No files carry '-- prod-skip: dev-only'."
          else
            echo "Marking ${#SKIP_VERSIONS[@]} dev-only migration(s) as applied in PROD."
            printf '%s\n' "${SKIP_VERSIONS[@]}" \
              | xargs -n 20 supabase migration repair --linked --status applied || true
          fi

      - name: Backup PROD schema + roles (pre-migration)
        if: github.event_name == 'push'
        id: backup
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILE="prod-schema-backup-${STAMP}-${GITHUB_SHA::7}.tar.gz"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          # Schema + roles only. Row data is captured by nightly-backup.yml.
          supabase db dump --linked -f prod-schema.sql
          supabase db dump --linked --role-only -f prod-roles.sql
          tar czf "$FILE" prod-schema.sql prod-roles.sql
          ls -lh "$FILE"

      - name: Upload backup artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.file }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      - name: Ensure PROD push-delivery prerequisites (extensions + Vault)
        # The push-delivery migration opens with a preflight DO block that
        # aborts `db push` if pg_cron / pg_net / supabase_vault are missing or
        # if the Vault secrets functions_base_url / service_role_key are absent.
        # Seed them here (idempotent) so promotion is not a manual dashboard chore.
        # Key source: SUPABASE_PROD_SERVICE_ROLE_KEY if present, otherwise the
        # existing SUPABASE_SERVICE_ROLE_KEY secret. A legacy JWT key is checked
        # against the prod project ref so a dev key can never be seeded here.
        if: github.event_name == 'push'
        env:
          PROD_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_ROLE_KEY }}
          FALLBACK_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          KEY="${PROD_SERVICE_ROLE_KEY:-${FALLBACK_SERVICE_ROLE_KEY:-}}"
          if [ -n "$KEY" ] && [ "${KEY:0:2}" = "ey" ]; then
            PAYLOAD=$(echo "$KEY" | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
            KEY_REF=$(echo "$PAYLOAD" | base64 -d 2>/dev/null | grep -oE '"ref"[[:space:]]*:[[:space:]]*"[^"]+"' | cut -d'"' -f4 || true)
            if [ -n "$KEY_REF" ] && [ "$KEY_REF" != "$PROJECT_REF" ]; then
              echo "::error::Service-role key belongs to project '$KEY_REF', not PROD ('$PROJECT_REF'). Set SUPABASE_PROD_SERVICE_ROLE_KEY to the prod key."
              exit 1
            fi
          fi
          DB_URL="postgresql://postgres@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require&connect_timeout=10"
          run_sql() { PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -qtAX "$@"; }


          run_sql -c "create extension if not exists pg_cron;" >/dev/null || true
          run_sql -c "create extension if not exists pg_net;" >/dev/null || true
          run_sql -c "create extension if not exists supabase_vault with schema vault;" >/dev/null || true

          BASE_URL="https://${PROJECT_REF}.supabase.co"
          # psql does not expand :'var' placeholders reliably inside a -c argument;
          # feed SQL on stdin so the variables are substituted before Postgres parses it.
          run_sql -v base="$BASE_URL" <<'SQL' >/dev/null
            select vault.create_secret(:'base', 'functions_base_url', 'Edge functions base URL')
            where not exists (select 1 from vault.secrets where name = 'functions_base_url');

            select vault.update_secret(id, :'base', 'functions_base_url', 'Edge functions base URL')
            from vault.secrets
            where name = 'functions_base_url';
          SQL

          if [ -n "$KEY" ]; then
            run_sql -v key="$KEY" <<'SQL' >/dev/null
              select vault.create_secret(:'key', 'service_role_key', 'Service role key for pg_net dispatch')
              where not exists (select 1 from vault.secrets where name = 'service_role_key');

              select vault.update_secret(id, :'key', 'service_role_key', 'Service role key for pg_net dispatch')
              from vault.secrets
              where name = 'service_role_key';
          SQL
            echo "✅ Vault service_role_key seeded from GitHub secret."
          else
            echo "ℹ️  No service-role key secret set — relying on an existing Vault entry."
          fi

          echo "=== Push delivery prerequisite report (no secret values) ==="
          run_sql -c "
            select 'pg_cron=' || exists(select 1 from pg_extension where extname='pg_cron')
              || ' pg_net=' || exists(select 1 from pg_extension where extname='pg_net')
              || ' supabase_vault=' || exists(select 1 from pg_extension where extname='supabase_vault')
              || ' functions_base_url_ok=' || coalesce((select decrypted_secret ~ '^https://[a-z0-9.-]+\.supabase\.(co|in)\$'
                   from vault.decrypted_secrets where name='functions_base_url' limit 1), false)
              || ' service_role_key_ok=' || coalesce((select length(decrypted_secret) >= 20 and decrypted_secret !~ '\s'
                   from vault.decrypted_secrets where name='service_role_key' limit 1), false);"

          # Fail closed on BOTH Vault secrets. Edge functions now authenticate
          # every caller, and DB triggers/cron read these two secrets to build an
          # authenticated request. If either is missing the triggers skip the call
          # silently (warn only) — notifications would go quiet with no error.
          KEY_OK=$(run_sql -c "select coalesce((select 1 from vault.decrypted_secrets where name='service_role_key' and length(decrypted_secret) >= 20 and decrypted_secret !~ '\s' limit 1), 0);")
          if [ "$KEY_OK" != "1" ]; then
            echo "::error::PROD Vault secret 'service_role_key' is missing or invalid. Add repository secret SUPABASE_PROD_SERVICE_ROLE_KEY, or create the Vault secret in the Supabase dashboard, then re-run."
            exit 1
          fi

          URL_OK=$(run_sql -c "select coalesce((select 1 from vault.decrypted_secrets where name='functions_base_url' and decrypted_secret ~ '^https://[a-z0-9.-]+\.supabase\.(co|in)\$' limit 1), 0);")
          if [ "$URL_OK" != "1" ]; then
            echo "::error::PROD Vault secret 'functions_base_url' is missing or malformed. Triggers cannot dispatch authenticated edge-function calls without it."
            exit 1
          fi
          echo "✅ Both Vault secrets present and well-formed."


      - name: Apply migrations to PROD
        if: github.event_name == 'push'
        run: supabase db push --linked


      - name: Deploy changed edge functions to PROD
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          CHANGED="${{ steps.edge_functions.outputs.changed }}"
          DEPLOY_ALL="${{ steps.edge_functions.outputs.deploy_all }}"
          FUNCS="${{ steps.edge_functions.outputs.functions }}"

          if [ "$CHANGED" != "true" ]; then
            echo "✅ No edge function changes in this push — skipping deploy."
            exit 0
          fi

          if [ "$DEPLOY_ALL" = "true" ]; then
            echo "⚠️  supabase/functions/_shared changed — redeploying ALL functions."
            supabase functions deploy --project-ref "$PROJECT_REF"
            exit 0
          fi

          if [ -z "$FUNCS" ]; then
            echo "✅ No deployable function directories remain — nothing to do."
            exit 0
          fi

          echo "Deploying only changed functions to PROD: $FUNCS"
          for name in $FUNCS; do
            echo "→ $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF"
          done

      - name: Verify PROD callers authenticate to edge functions
        # Every edge function now authenticates its caller, so any cron job or
        # trigger still sending an anon key (or no Authorization header) would
        # start 401-ing silently. Catch that in CI rather than in production.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres@db.${PROJECT_REF}.supabase.co:5432/postgres?sslmode=require&connect_timeout=10"
          run_sql() { PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -qtAX "$@"; }

          echo "=== Cron jobs calling edge functions ==="
          run_sql -c "
            select jobname || ' | schedule=' || schedule || ' | active=' || active
            from cron.job
            where command ilike '%functions/v1/%'
            order by jobname;"

          # A cron job that embeds a raw anon JWT (role\":\"anon\") in its command
          # can no longer authenticate against the hardened functions.
          BAD_CRON=$(run_sql -c "
            select count(*) from cron.job
            where command ilike '%functions/v1/%'
              and (command ilike '%anon%' or command not ilike '%internal_service_role_key%');")
          if [ "$BAD_CRON" != "0" ]; then
            echo "::error::$BAD_CRON PROD cron job(s) calling edge functions do not use public.internal_service_role_key(). They will receive 401 from the hardened functions. Reschedule them before promoting."
            run_sql -c "
              select jobname from cron.job
              where command ilike '%functions/v1/%'
                and (command ilike '%anon%' or command not ilike '%internal_service_role_key%');"
            exit 1
          fi
          echo "✅ All PROD cron callers use the Vault service-role key."

          # Trigger functions that dispatch to edge functions must do the same.
          BAD_FN=$(run_sql -c "
            select count(*) from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.prosrc ilike '%functions/v1/%'
              and p.prosrc not ilike '%internal_service_role_key%';")
          if [ "$BAD_FN" != "0" ]; then
            echo "::error::$BAD_FN PROD trigger function(s) dispatch to edge functions without public.internal_service_role_key(). Those calls will 401."
            run_sql -c "
              select p.proname from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
                and p.prosrc ilike '%functions/v1/%'
                and p.prosrc not ilike '%internal_service_role_key%';"
            exit 1
          fi
          echo "✅ All PROD trigger dispatchers use the Vault service-role key."


      - name: Post-migration state
        if: github.event_name == 'push'
        run: supabase migration list --linked
