name: "[DB] Promote to Prod"

# Structural/code-only promotion. Never copies DEV data or repairs history,
# credentials, storage buckets or scheduled jobs. Unreviewed SQL fails closed.
on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch:
    inputs:
      before:
        description: "Exact prior prod commit for edge-function change comparison"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-prod-release
  cancel-in-progress: false

jobs:
  source-tests:
    name: Structural release tests (no database access)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pglast==7.22
      - name: Check structural release safety
        run: node --test scripts/supabase-structural-release.test.mjs

  promote:
    name: Production database deployment
    needs: source-tests
    if: github.ref == 'refs/heads/prod' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      RELEASE_BEFORE: ${{ github.event.before || inputs.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3
      - name: Install SQL parser and database client
        run: |
          python3 -m pip install pglast==7.22
          command -v psql >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends postgresql-client; }
      - name: Verify full live plan then promote structures and function code only
        run: node scripts/supabase-structural-release.mjs
      - name: Save bounded release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-structural-release-${{ github.sha }}
          path: ${{ runner.temp }}/supabase-structural-release/release-report.json
          if-no-files-found: ignore