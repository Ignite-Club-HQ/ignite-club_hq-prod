name: Promote to Prod

# When a merge lands on the `prod` branch, run any pending Supabase migrations
# and deploy edge functions to Supabase PROD *before* Netlify / Codemagic
# rebuild the frontend against the same commit. If migrations or function
# deploys fail, the frontend never ships → no schema/UI mismatch possible.
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN      — personal access token from
#                                https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROD_PROJECT_REF  — yabcfiuntwqjwvschnji
#   SUPABASE_DB_PASSWORD       — the prod DB password (Project Settings →
#                                Database → Connection string). Required by
#                                `supabase db push` and `pg_dump` for a
#                                non-interactive run.
#
# Pre-promotion backup:
#   Before applying any migrations we run `pg_dump` against prod and upload the
#   dump as a workflow artifact (retained 30 days). To roll back, download the
#   artifact and follow scripts/restore-prod-backup.sh.


on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch: {}

concurrency:
  group: promote-to-prod
  cancel-in-progress: false

jobs:
  promote:
    name: Migrate + deploy backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out prod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify required secrets are present
        run: |
          missing=0
          for var in SUPABASE_ACCESS_TOKEN PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Link to Supabase PROD project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: List pending migrations
        run: supabase migration list --linked

      - name: Preview pending migration SQL
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi
          echo "=== Migration files changed since $BEFORE ==="
          git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ || true

          echo ""
          echo "=== SQL content ==="
          git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ | while read -r file; do
            if [ -f "$file" ]; then
              echo "--- $file ---"
              cat "$file"
              echo ""
            fi
          done

      - name: Guard against destructive migrations
        # Fails the job (before backup/apply) if any pending migration file
        # contains DML/DDL that could nuke prod media rows or their URL columns.
        # This is a safety net for accidental "fix dev images" queries that
        # slip into supabase/migrations/ and would otherwise run against prod.
        # Whitelist a specific migration by adding a line containing the exact
        # marker:  -- promote-guard: allow  (only do this after human review).
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD^"
          fi

          FILES=$(git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ || true)
          if [ -z "$FILES" ]; then
            echo "No pending migration files — guard passes."
            exit 0
          fi

          # Case-insensitive, whitespace-tolerant patterns.
          # Blocks writes/drops targeting media-bearing tables or their URL cols.
          PATTERNS='(UPDATE|DELETE[[:space:]]+FROM|TRUNCATE)[[:space:]]+(ONLY[[:space:]]+)?(public\.)?(photos|vault_files|group_messages|club_messages|team_messages|direct_messages|gallery_chat_cards)\b|DROP[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?(public\.)?(photos|vault_files|group_messages|club_messages|team_messages|direct_messages|gallery_chat_cards)\b|DROP[[:space:]]+COLUMN[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?(image_url|file_url|hero_image_url)\b'

          failed=0
          for file in $FILES; do
            [ -f "$file" ] || continue
            if grep -qiE -- '--[[:space:]]*promote-guard:[[:space:]]*allow' "$file"; then
              echo "⚠️  $file has promote-guard allow marker — skipping."
              continue
            fi
            if grep -niE -- "$PATTERNS" "$file"; then
              echo "::error file=$file::Migration contains a statement that could destroy prod media data. Review and either remove the statement or add the marker '-- promote-guard: allow' after human review."
              failed=1
            fi
          done

          if [ "$failed" = "1" ]; then
            echo ""
            echo "❌ Promotion halted BEFORE backup/apply. No changes made to prod."
            exit 1
          fi
          echo "✅ Guard passed — no destructive statements against media tables."


      - name: Backup PROD database (pre-migration)
        id: backup
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILE="prod-backup-${STAMP}-${GITHUB_SHA::7}.sql.gz"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          # `supabase db dump` uses the linked project + SUPABASE_DB_PASSWORD.
          # --data-only=false (default) captures schema + data. Roles/auth
          # schema come from separate flags.
          supabase db dump --linked -f prod-schema.sql
          supabase db dump --linked --data-only -f prod-data.sql
          supabase db dump --linked --role-only -f prod-roles.sql
          tar czf "$FILE" prod-schema.sql prod-data.sql prod-roles.sql
          ls -lh "$FILE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.file }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      - name: Apply pending migrations
        run: supabase db push --linked

      - name: Deploy edge functions
        # Deploys every function under supabase/functions/. Individual function
        # config (verify_jwt, import_map, etc.) still comes from
        # supabase/config.toml.
        run: supabase functions deploy --project-ref "$PROJECT_REF"


      - name: Success
        run: |
          echo "✅ Backend promoted. Netlify + Codemagic will now build the"
          echo "   frontend against commit $GITHUB_SHA."
