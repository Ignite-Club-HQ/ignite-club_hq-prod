name: "[TEST] OpenCloud DEV commissioning"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, commission]
        default: check
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: opencloud-dev-deployment
  cancel-in-progress: false
jobs:
  commission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: opencloud-dev-backend-source-build
          path: deploy/opencloud/work/dev-candidate
          run-id: 45700163542
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: opencloud-dev-backend-source-build
          path: deploy/opencloud/work/dev-timer
          run-id: 45710008446
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: opencloud-dev-backend-source-build
          path: deploy/opencloud/work/dev-club
          run-id: 45716305902
          github-token: ${{ github.token }}
      - name: Verify and commission DEV inventory
        env:
          PEM_IN: ${{ secrets.GOVERNOR_PEM }}
          MODE: ${{ inputs.mode }}
          GOVERNOR_PEM_FILE: ${{ runner.temp }}/opencloud-governor.pem
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$GOVERNOR_PEM_FILE"' EXIT
          test -n "$PEM_IN"
          node scripts/normalize-dev-engine-publisher-pem.mjs > "$GOVERNOR_PEM_FILE"
          unset PEM_IN
          node scripts/opencloud/dev-commission.mjs deploy/opencloud/work/dev-candidate deploy/opencloud/work/dev-timer deploy/opencloud/work/dev-club "$MODE"
