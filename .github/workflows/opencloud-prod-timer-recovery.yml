name: "[PROD] OpenCloud PROD timer recovery"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, upgrade]
        default: check
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: opencloud-prod-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/opencloud-prod-source-build.yml
  recover:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: opencloud-prod-backend-source-build
          path: deploy/opencloud/work/prod-candidate
      - uses: actions/download-artifact@v4
        with:
          name: opencloud-prod-backend-source-build
          run-id: 45784653124
          github-token: ${{ github.token }}
          path: deploy/opencloud/work/prod-original
      - name: Install ICP CLI
        run: npm install -g @icp-sdk/icp-cli@1.7.0 --no-fund --no-audit
      - name: Check or upgrade exact PROD timer inventory
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          APPROVE_TIMER_UPGRADE: ${{ inputs.mode == 'upgrade' && 'YES' || 'NO' }}
          MODE: ${{ inputs.mode }}
          ICP_HOME: ${{ runner.temp }}/opencloud-prod-timer-recovery
          GOVERNOR_PEM_FILE: ${{ runner.temp }}/opencloud-prod-timer-recovery/governor.pem
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ICP_HOME"
          trap 'rm -rf "$ICP_HOME"' EXIT
          test -n "$PROD_GOVERNOR_PEM_ENC" && test -n "$PROD_GOVERNOR_PASSPHRASE"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$GOVERNOR_PEM_FILE.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$GOVERNOR_PEM_FILE.pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$GOVERNOR_PEM_FILE.enc" -out "$GOVERNOR_PEM_FILE" -pass file:"$GOVERNOR_PEM_FILE.pass"
          rm -f "$GOVERNOR_PEM_FILE.enc" "$GOVERNOR_PEM_FILE.pass"
          unset PROD_GOVERNOR_PEM_ENC PROD_GOVERNOR_PASSPHRASE
          icp identity import --from-pem "$GOVERNOR_PEM_FILE" --storage plaintext opencloud-governor
          test "$(icp identity principal --identity opencloud-governor)" = "kydv5-mptl2-ip3ie-5zwd3-gc5en-4opnd-mytmr-gza6m-xh5t4-jz662-7ae"
          node --check scripts/opencloud/prod-timer-recovery.mjs
          node scripts/opencloud/prod-timer-recovery.mjs deploy/opencloud/work/prod-candidate "$MODE" deploy/opencloud/work/prod-original
