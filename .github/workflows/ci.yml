name: "[REPO] Source checks (CI)"

on:
  pull_request:
  push:
    branches: [main, "migration/**"]

permissions:
  contents: read

jobs:
  auth-release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: node --test scripts/auth-release-preflight.test.mjs scripts/prod-push-config.test.mjs scripts/workflow-env-names.test.mjs
      - name: Guard DEV Group 2 governor restore against malformed key imports
        run: node --test scripts/group2-upgrade-workflow.test.mjs
      - name: Verify pinned shared club-name release and settings-only safeguards
        run: node --test scripts/all-group-upgrade-policy.test.mjs scripts/dev-name-copy-reader-upgrade-contract.test.mjs scripts/secure-name-release-policy.test.mjs
      - name: Validate ICP MCP onboarding and DEV legal-release OQL contracts
        run: node --test scripts/icp-mcp-onboarding-doc.test.mjs scripts/legal-release-oql-contract.test.mjs scripts/dev-legal-release-policy.test.mjs
      # Offline source consistency only; live target checks remain in promotion.
      - name: Install pinned offline SQL parser for PROD PR
        if: github.base_ref == 'prod'
        run: python3 -m pip install pglast==7.22
      - name: Validate the six approved database sources for PROD PR
        if: github.base_ref == 'prod'
        run: |
          node --test scripts/supabase-safe-staging.test.mjs scripts/supabase-safe-apply.test.mjs scripts/supabase-safe-source-check.test.mjs
          node scripts/supabase-safe-source-check.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check:step1
      - run: node --test scripts/generated-contract-syntax.test.mjs
      - run: npm run lint
      - name: Verify idempotent ICP club-name copy repair and key-cycle limits
        run: npx vitest run --config vitest.legacy.config.mjs src/live/privateProfileNames.test.ts src/live/devOwnerClubNameReadiness.test.ts
      - name: Verify DEV membership receipt/name-copy lifecycle source boundaries
        run: node --test ../scripts/dev-owner-name-lifecycle-contract.test.mjs
      - name: Verify deleted-team membership and PII permission revocation guards
        run: node --test ../scripts/dev-deleted-team-membership-contract.test.mjs
      - name: Verify deleted-team chat and protected event-feed guards
        run: node --test ../scripts/dev-team-cross-service-security-contract.test.mjs
      - name: Verify home performance outliers and timeout instrumentation
        run: node --test ../scripts/home-performance-telemetry-contract.test.mjs
      - run: npm run typecheck:product
      - run: npx vitest run --config vitest.legacy.config.mjs src/live/localRuntimeMode.test.ts src/live/disabledLabRuntime.test.ts
      - name: Verify club roster privacy and parent-child inclusion source gates
        run: node --test scripts/test-club-roster-gate-source.test.mjs
      - name: Verify interactive player roster retry feedback
        run: npx vitest run --config vitest.legacy.config.mjs src/components/team/TeamMembersSection.test.tsx
      - name: Verify DEV Ted-U10 transfer read-only preflight contract
        run: node --test scripts/test-dev-ted-transfer-preflight.mjs
      - name: Test DEV Ted-U10 source/target preflight and transfer refusal
        run: npx vitest run --config vitest.legacy.config.mjs src/features/membership/devTedU10TransferPreflight.test.ts
      - name: Verify ICP children group provenance and duplicate protection
        run: npx vitest run --config vitest.legacy.config.mjs src/features/membership/icpChildrenGroupSafety.test.ts
      - name: Verify ICP child pages cannot send unscoped group writes
        run: node --test scripts/test-icp-children-group-routing.mjs
      - name: Verify bounded child-name unlock and retryable guardian display
        run: npx vitest run --config vitest.legacy.config.mjs src/live/groupDispatch.test.ts src/pages/IcpChildrenPage.loading.test.tsx src/live/sharedVetKeyReadParallel.test.ts
      - name: Verify DEV invite lookups, authority retry, and Internet Identity handoff
        run: npx vitest run --config vitest.legacy.config.mjs src/live/invitePreview.test.ts src/live/acceptShareableInviteWithRetry.test.ts src/features/membership/createIcpInviteChild.test.ts src/features/membership/verifyIcpChildNameAcrossGroups.test.ts src/pages/JoinTeamPage.icp.test.tsx
      - name: Verify signed-in principal isolation during session restore
        run: npx vitest run --config vitest.legacy.config.mjs src/hooks/useAuth.profileSave.test.tsx src/live/identityProfileCache.test.ts src/live/internetIdentitySessionHealth.test.ts
      - run: npm run build
        env:
          IGNITE_LIVE_SUPABASE_ALIAS: dev-ci
          IGNITE_LIVE_SUPABASE_URL: https://example.invalid
          IGNITE_LIVE_SUPABASE_ANON_KEY: synthetic-public-anon-key
          IGNITE_LIVE_ICP_HOST: https://icp-api.io
          IGNITE_LIVE_ICP_CANISTER_IDS_JSON: "{}"
      - run: npm run check:prod-secrets

  rust-canisters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
