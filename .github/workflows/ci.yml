name: "[REPO] Source checks (CI)"

on:
  pull_request:
  push:
    branches: [main, "migration/**"]

permissions:
  contents: read

jobs:
  auth-release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: node --test scripts/auth-release-preflight.test.mjs scripts/prod-push-config.test.mjs scripts/workflow-env-names.test.mjs
      - name: Validate published ICP MCP onboarding contract
        run: node --test scripts/icp-mcp-onboarding-doc.test.mjs
      # Offline source consistency only; live target checks remain in promotion.
      - name: Install pinned offline SQL parser for PROD PR
        if: github.base_ref == 'prod'
        run: python3 -m pip install pglast==7.22
      - name: Validate the six approved database sources for PROD PR
        if: github.base_ref == 'prod'
        run: |
          node --test scripts/supabase-safe-staging.test.mjs scripts/supabase-safe-apply.test.mjs scripts/supabase-safe-source-check.test.mjs
          node scripts/supabase-safe-source-check.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check:step1
      - run: node --test scripts/generated-contract-syntax.test.mjs
      - run: npm run lint
      - run: npm run typecheck:product
      - run: npx vitest run --config vitest.legacy.config.mjs src/live/localRuntimeMode.test.ts src/live/disabledLabRuntime.test.ts
      - run: npm run build
        env:
          IGNITE_LIVE_SUPABASE_ALIAS: dev-ci
          IGNITE_LIVE_SUPABASE_URL: https://example.invalid
          IGNITE_LIVE_SUPABASE_ANON_KEY: synthetic-public-anon-key
          IGNITE_LIVE_ICP_HOST: https://icp-api.io
          IGNITE_LIVE_ICP_CANISTER_IDS_JSON: "{}"
      - run: npm run check:prod-secrets

  # Disposable PocketIC only: installs local WASM, no credentials/deployment.
  g2-witness-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned disposable PocketIC runtime
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          node node_modules/@dfinity/pic/postinstall.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Build disposable management lifecycle probe
        run: |
          bun add -g ic-mops@3.5.1
          mops toolchain use moc 1.16.1
          cd backend/events_domain
          mops install
          mkdir -p .mops/.build
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          "$MOC" $(mops sources) -o .mops/.build/recoveryLifecycleProbe.wasm ../shared/test/recoveryLifecycleProbe.mo
          "$MOC" $(mops sources) -o .mops/.build/g2ChainProbe.wasm ../shared/test/g2ChainProbe.mo
      - name: Compile actual disposable Club Domain with checked migrations
        working-directory: backend/club_domain
        run: |
          mops install
          mkdir -p .mops/.build
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations -o .mops/.build/club_domain.wasm src/main.mo
      - name: Exercise real isolated G2 identity and independent witness WASM
        working-directory: frontend
        env:
          G2_WITNESS_ISOLATED_REPORT: ${{ runner.temp }}/g2-witness-isolated.json
          REMOVAL_LIFECYCLE_PROBE_WASM: ${{ github.workspace }}/backend/events_domain/.mops/.build/recoveryLifecycleProbe.wasm
          G2_CHAIN_PROBE_WASM: ${{ github.workspace }}/backend/events_domain/.mops/.build/g2ChainProbe.wasm
          G2_ACTUAL_CLUB_DOMAIN_WASM: ${{ github.workspace }}/backend/club_domain/.mops/.build/club_domain.wasm
        run: |
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          timeout --kill-after=5s 840s node scripts/test-active-g2-witness-replica.mjs
      - name: Save isolated witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-witness-isolated
          path: ${{ runner.temp }}/g2-witness-isolated.json
          if-no-files-found: warn

  rust-canisters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
      - name: Verify isolated DEV G2 identity reader security tests
        run: |
          cargo test -p identity_access active_g2_club_reader --locked
          cargo test -p identity_access active_g2_recovery_acceptance --locked
          cargo test -p recovery_witness active_g2_account_read_protocol --locked
