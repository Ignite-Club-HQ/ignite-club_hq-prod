name: "[REPO] Source checks (CI)"

on:
  pull_request:
  push:
    branches: [main, "migration/**"]

permissions:
  contents: read

jobs:
  plugin-native-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Test canonical DEV principal/discovery parity (no network)
        run: node --test scripts/ignite-plugin-discovery-parity.test.mjs

  auth-release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: node --test scripts/auth-release-preflight.test.mjs scripts/prod-push-config.test.mjs scripts/workflow-env-names.test.mjs
      - name: Validate published ICP MCP onboarding contract
        run: node --test scripts/icp-mcp-onboarding-doc.test.mjs
      # Offline source consistency only; live target checks remain in promotion.
      - name: Install pinned offline SQL parser for PROD PR
        if: github.base_ref == 'prod'
        run: python3 -m pip install pglast==7.22
      - name: Validate the six approved database sources for PROD PR
        if: github.base_ref == 'prod'
        run: |
          node --test scripts/supabase-safe-staging.test.mjs scripts/supabase-safe-apply.test.mjs scripts/supabase-safe-source-check.test.mjs
          node scripts/supabase-safe-source-check.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run check:step1
      - run: node --test scripts/generated-contract-syntax.test.mjs
      - run: npm run lint
      - run: npm run typecheck:product
      - run: npx vitest run --config vitest.legacy.config.mjs src/live/localRuntimeMode.test.ts src/live/disabledLabRuntime.test.ts
      - run: npm run build
        env:
          IGNITE_LIVE_SUPABASE_ALIAS: dev-ci
          IGNITE_LIVE_SUPABASE_URL: https://example.invalid
          IGNITE_LIVE_SUPABASE_ANON_KEY: synthetic-public-anon-key
          IGNITE_LIVE_ICP_HOST: https://icp-api.io
          IGNITE_LIVE_ICP_CANISTER_IDS_JSON: "{}"
      - run: npm run check:prod-secrets

  rust-canisters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
