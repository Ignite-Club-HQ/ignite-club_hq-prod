name: "[TEST] Check isolated removal test installation"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install existing test dependencies and pinned compiler
        run: |
          node scripts/ensure-frontend-deps.mjs
          bun add -g ic-mops@3.5.1
          mops toolchain use moc 1.16.1
          (cd frontend && node node_modules/@dfinity/pic/postinstall.mjs)
      - name: Check bounded local cleanup
        run: node --test frontend/scripts/removal-local-supervisor.test.mjs
      - name: Compile only the disposable installation probe
        working-directory: backend/events_domain
        run: |
          mops install
          "$HOME/.cache/mops/moc/1.16.1/moc" $(mops sources) -o "$RUNNER_TEMP/removal-install-probe.wasm" ../shared/test/removalInstallProbe.mo
      - name: Verify isolated local installation
        working-directory: frontend
        env:
          REMOVAL_INSTALL_PROBE_WASM: ${{ runner.temp }}/removal-install-probe.wasm
          REMOVAL_INSTALL_REPORT: ${{ runner.temp }}/removal-install-report.json
        run: |
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          timeout --kill-after=5s 75s node scripts/removal-install-preflight.mjs
      - name: Save installation evidence (not release acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: removal-installation-only
          path: ${{ runner.temp }}/removal-install-report.json
          if-no-files-found: warn