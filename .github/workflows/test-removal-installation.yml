name: "[TEST] Check isolated removal test installation"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install existing test dependencies and pinned compiler
        run: |
          node scripts/ensure-frontend-deps.mjs
          bun add -g ic-mops@3.5.1
          mops toolchain use moc 1.16.1
          (cd frontend && node node_modules/@dfinity/pic/postinstall.mjs)
      - name: Check bounded local cleanup
        run: node --test frontend/scripts/removal-local-supervisor.test.mjs frontend/scripts/removal-host-preflight.test.mjs
      - name: Compile only the disposable installation probe
        working-directory: backend/events_domain
        run: |
          mops install
          "$HOME/.cache/mops/moc/1.16.1/moc" $(mops sources) -o "$RUNNER_TEMP/removal-install-probe.wasm" ../shared/test/removalInstallProbe.mo
      - name: Verify isolated local installation
        working-directory: frontend
        env:
          REMOVAL_INSTALL_PROBE_WASM: ${{ runner.temp }}/removal-install-probe.wasm
          REMOVAL_INSTALL_REPORT: ${{ runner.temp }}/removal-install-report.json
        run: |
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          timeout --kill-after=5s 75s node scripts/removal-install-preflight.mjs
      - name: Build seven real receiver services after installation passes
        run: |
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          for d in events_domain competition_domain mini_league_domain club_points_domain media_metadata insights_domain notification_queue; do
            (cd backend/$d && mops install && mkdir -p .mops/.build && "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations -o .mops/.build/$d.wasm src/main.mo)
          done
          (cd backend/events_domain && "$MOC" $(mops sources) -o "$RUNNER_TEMP/removal-relay.wasm" ../shared/test/messagingRemovalRelay.mo)
      - name: Check held callbacks and retained fences in both modes (not full acceptance)
        working-directory: frontend
        run: |
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          export REMOVAL_INSTALL_PROBE_WASM="$RUNNER_TEMP/removal-install-probe.wasm"
          export REMOVAL_INSTALL_REPORT="$RUNNER_TEMP/removal-install-report.json"
          export REMOVAL_RELAY_WASM="$RUNNER_TEMP/removal-relay.wasm"
          for d in events_domain competition_domain mini_league_domain club_points_domain media_metadata insights_domain notification_queue; do
            name="$(echo "$d" | tr '[:lower:]' '[:upper:]')_WASM"
            export "$name=$GITHUB_WORKSPACE/backend/$d/.mops/.build/$d.wasm"
          done
          for mode in rehearsal production-candidate; do
            REMOVAL_TEST_MODE="$mode" REMOVAL_RECEIVER_REPORT="$RUNNER_TEMP/removal-receivers-$mode.json" timeout --kill-after=5s 940s node scripts/test-remaining-removal-receivers.mjs
          done
      - name: Save installation evidence (not release acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: removal-installation-only
          path: |
            ${{ runner.temp }}/removal-install-report.json
            ${{ runner.temp }}/removal-receivers-*.json
          if-no-files-found: warn