name: "[PROD] Native push sender (deploy / commission / wake)"

# Live fast sender for native ICP push. Runs only from the prod branch behind the
# production environment. The live notification service itself limits delivery
# to its approved recipient allowlist (Paul only). Supabase push is untouched.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy, commission or wake"
        required: true
        default: wake
        type: choice
        options: [wake, deploy, commission]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: prod-native-push-sender
  cancel-in-progress: false

env:
  PROD_REF: yabcfiuntwqjwvschnji
  SENDER_URL: https://yabcfiuntwqjwvschnji.supabase.co/functions/v1/icp-dev-push-sender
  QUEUE: w263o-3aaaa-aaaai-ayesq-cai

jobs:
  wake:
    # Content-free backup wake-up; harmless until the sender is commissioned.
    if: github.event_name == 'schedule' || inputs.action == 'wake'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS -m 90 -X POST "$SENDER_URL" -w '\nHTTP %{http_code}\n' || true

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy' && github.ref == 'refs/heads/prod'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy sender to the live Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_SECRET_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          PROD_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.PROD_FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test "$PROD_SECRET_REF" = "$PROD_REF" || { echo "::error::Live project mismatch. Nothing changed."; exit 1; }
          test -n "$PROD_FCM_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing live Firebase account"; exit 1; }
          printf '%s' "$PROD_FCM_SERVICE_ACCOUNT_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(j.project_id!=="ignite-club-hq"||!j.private_key||!j.client_email)process.exit(1)})' \
            || { echo "::error::Live Firebase account is not ignite-club-hq. Nothing changed."; exit 1; }
          existing="$(supabase secrets list --project-ref "$PROD_REF")"
          : > "$RUNNER_TEMP/s.env"
          if ! grep -q 'IGNITE_DEV_ICP_PUSH_SENDER_SEED' <<<"$existing"; then
            echo "IGNITE_DEV_ICP_PUSH_SENDER_SEED=$(openssl rand -hex 32)" >> "$RUNNER_TEMP/s.env"
            echo "Creating live sender seed (value never printed)"
          fi
          printf 'IGNITE_PROD_FCM_SERVICE_ACCOUNT_JSON=%s\n' "$(printf '%s' "$PROD_FCM_SERVICE_ACCOUNT_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.stringify(JSON.parse(s))))')" >> "$RUNNER_TEMP/s.env"
          supabase secrets set --project-ref "$PROD_REF" --env-file "$RUNNER_TEMP/s.env" --yes >/dev/null
          rm -f "$RUNNER_TEMP/s.env"
          supabase functions deploy icp-dev-push-sender --project-ref "$PROD_REF" --no-verify-jwt --use-api --yes
          sleep 10
          curl -sSf -m 60 "$SENDER_URL"; echo

  commission:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'commission' && github.ref == 'refs/heads/prod'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ignite-prod-governor-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @icp-sdk/icp-cli@1.7.0 --no-fund --no-audit
      - name: Unlock live governor
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          PROD_GOVERNOR_PRINCIPAL: ${{ vars.PROD_GOVERNOR_PRINCIPAL }}
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/gov"; mkdir -p "$d"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$d/key.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$d/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$d/key.enc" -out "$d/key.pem" -pass file:"$d/pass"
          icp identity import --from-pem "$d/key.pem" --storage plaintext ignite-prod-governor >/dev/null
          rm -rf "$d"
          [ "$(icp identity principal --identity ignite-prod-governor)" = "$PROD_GOVERNOR_PRINCIPAL" ] || { echo "::error::Not the live governor. Nothing changed."; exit 1; }
      - name: Record sender permission and read back
        run: |
          set -euo pipefail
          sender="$(curl -sSf -m 60 "$SENDER_URL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[a-z0-9-]{20,70}$/.test(j.sender))process.exit(1);console.log(j.sender)})')"
          echo "Live sender: $sender"
          icp canister call "$QUEUE" configure_native_push_worker "(principal \"$sender\")" -n ic --identity ignite-prod-governor
          icp canister call "$QUEUE" native_push_configuration '()' -n ic --query
          curl -sSf -m 60 "$SENDER_URL" | grep -q '"commissioned":true' || { echo "::error::Sender does not see its permission yet."; exit 1; }
          echo "Live sender commissioned."
