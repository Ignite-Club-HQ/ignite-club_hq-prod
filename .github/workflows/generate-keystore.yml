name: Generate Upload Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Password for the keystore and key'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore /tmp/ignite-upload.keystore \
            -alias ignite \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ inputs.keystore_password }}" \
            -keypass "${{ inputs.keystore_password }}" \
            -dname "CN=Ignite Team Hub, OU=Mobile, O=Ignite, L=London, ST=London, C=GB"

      - name: Output base64 keystore
        run: |
          echo "============================================"
          echo "COPY EVERYTHING BETWEEN THE MARKERS BELOW"
          echo "============================================"
          echo "---BEGIN KEYSTORE BASE64---"
          base64 -w 0 /tmp/ignite-upload.keystore
          echo ""
          echo "---END KEYSTORE BASE64---"
          echo "============================================"
          echo ""
          echo "Now add these to Codemagic Environment Variables:"
          echo "  CM_KEYSTORE = (the base64 string above)"
          echo "  CM_KEYSTORE_PASSWORD = ${{ inputs.keystore_password }}"
          echo "  CM_KEY_ALIAS = ignite"
          echo "  CM_KEY_PASSWORD = ${{ inputs.keystore_password }}"
