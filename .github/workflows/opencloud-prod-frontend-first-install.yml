name: "[PROD] OpenCloud frontend first install"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, install]
        default: check
        required: true
permissions:
  contents: read
concurrency:
  group: ignite-prod-governor-deployment
  cancel-in-progress: false
jobs:
  frontend:
    if: github.ref == 'refs/heads/main' && vars.OPENCLOUD_PROD_AUTO_DEPLOY != 'true' && vars.OPENCLOUD_PROD_FRONTEND_READY != 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      OPENCLOUD_PROD_AUTO_DEPLOY: ${{ vars.OPENCLOUD_PROD_AUTO_DEPLOY }}
      OPENCLOUD_PROD_FRONTEND_READY: ${{ vars.OPENCLOUD_PROD_FRONTEND_READY }}
      ICP_HOME: ${{ github.workspace }}/.icp-home-prod
      OPENCLOUD_PROD_OFFLINE_BUILD: 'true'
      SUPABASE_URL: https://yabcfiuntwqjwvschnji.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.IGNITE_LIVE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - run: npm install -g @icp-sdk/icp-cli@1.7.0 --no-fund --no-audit
      - name: Build isolated PROD frontend
        run: |
          set -euo pipefail
          W=deploy/opencloud/work/prod-web
          mkdir -p "$W"
          cp deploy/opencloud/prod.json "$W/config.json"
          node scripts/opencloud/frontend-artifacts.mjs "$W" deploy/opencloud/dev.json
          mkdir -p "$W/site/.icp/data/mappings"
          cp -r "$W/frontend-assets" "$W/site/dist"
          cp deploy/frontend-engine/icp.yaml "$W/site/icp.yaml"
          printf '{"frontend":"%s"}\n' "$(node -p 'require("./deploy/opencloud/prod.json").shared.frontend')" > "$W/site/.icp/data/mappings/ic.ids.json"
      - name: Publish assets using existing PROD identity
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          D="$(mktemp -d)"
          trap 'rm -rf "$D" "$ICP_HOME"' EXIT
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$D/key.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$D/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$D/key.enc" -out "$D/key.pem" -pass file:"$D/pass"
          unset PROD_GOVERNOR_PEM_ENC PROD_GOVERNOR_PASSPHRASE
          mkdir -p "$ICP_HOME"
          icp identity import --from-pem "$D/key.pem" --storage plaintext opencloud-prod-publisher
          icp identity default opencloud-prod-publisher
          expected="$(node -p 'require("./deploy/opencloud/prod.json").controllers.frontendPublisher')"
          test "$(icp identity principal)" = "$expected"
          W=deploy/opencloud/work/prod-web/site
          (cd "$W" && icp build)
          PUBLISHER_PEM_FILE="$D/key.pem" node scripts/opencloud/prod-frontend-first-install.mjs "$W/.icp/cache/artifacts/frontend" "${{ inputs.mode }}"
          if [ "${{ inputs.mode }}" = install ]; then
            (cd "$W" && icp sync frontend -e ic)
            curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 30 https://f7fgd-eiaaa-aaac5-aaeaa-cai.icp.net/ -o "$D/index.html"
            test -s "$D/index.html"
          fi
