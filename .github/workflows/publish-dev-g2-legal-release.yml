name: "[TEST] Publish approved DEV Group 2 legal version"
# Private owner-approved initial-signup Terms/Privacy release only.
# Distinct from global forced reacceptance. Never runs for PROD.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Read-only check first; publish requires explicit confirmation"
        type: choice
        required: true
        default: check
        options: [check, publish]
      confirmation:
        description: "For publish only: PUBLISH DEV G2 LEGAL 2026-11-13"
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ignite-mainnet-governor-deployment
  cancel-in-progress: false
jobs:
  legal-release:
    runs-on: ubuntu-latest
    environment: group-2-admin-controls
    timeout-minutes: 35
    env:
      IGNITE_ICP_ENV: dev
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Guard reviewed DEV main and explicit publication intent before restoring a key
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { checkDevLegalContext } from './scripts/dev-legal-release-policy.mjs';
          const action = checkDevLegalContext(process.env);
          console.log('Approved DEV legal-release action: ' + action);
          JS
          grep -q '"club_domain": "mzzzv-taaaa-aaaal-qxlrq-cai"' deploy/mainnet/.icp/data/mappings/ic.ids.json
          grep -q '"club_domain": "yfwyv-nyaaa-aaaal-qxpyq-cai"' deploy/groups/g2/provision.json
      - name: Test exact DEV release allowlist and one-target safety
        run: node --test scripts/dev-legal-release-policy.test.mjs
      - name: Install existing frontend dependencies
        run: node scripts/ensure-frontend-deps.mjs
      - name: Restore existing DEV governor only
        env:
          DEPLOYER_PEM: ${{ secrets.GOVERNOR_PEM || secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOYER_PEM"
          python3 - "$RUNNER_TEMP/dev-legal-release-governor.pem" <<'PY'
          import base64, os, re, sys
          raw = os.environ["DEPLOYER_PEM"].replace("\r", "").replace("\\n", "\n")
          raw = re.sub(r"[\u2010-\u2015\u2212]", "-", raw).replace("\u00a0", " ").strip().strip("'\"")
          if "BEGIN" not in raw.upper():
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("ascii")
                  if "BEGIN" in decoded.upper(): raw = decoded
              except Exception:
                  pass
          found = re.search(r"-{2,}\s*BEGIN\s+((?:EC\s+)?PRIVATE\s+KEY)\s*-{2,}(.*?)-{2,}\s*END\s+\1\s*-{2,}", raw, re.S | re.I)
          if not found:
              raise SystemExit("Pinned DEV governor secret missing or malformed; no write attempted")
          label = re.sub(r"\s+", " ", found.group(1).upper())
          body = re.sub(r"\s+", "", found.group(2))
          if not re.fullmatch(r"[A-Za-z0-9+/=]+", body):
              raise SystemExit("Governor key content malformed")
          lines = "\n".join(body[i:i+64] for i in range(0, len(body), 64))
          with open(sys.argv[1], "w") as handle:
              handle.write(f"-----BEGIN {label}-----\n{lines}\n-----END {label}-----\n")
          PY
      - name: Preflight both DEV groups and publish exactly one G2 setting if approved
        working-directory: frontend
        run: |
          set -euo pipefail
          npx --yes tsx@4 scripts/publish-dev-g2-legal-release.ts \
            "$RUNNER_TEMP/dev-legal-release-governor.pem" \
            "$RUNNER_TEMP/dev-legal-release-evidence.json"
      - name: Remove governor key
        if: always()
        run: rm -f "$RUNNER_TEMP/dev-legal-release-governor.pem"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-g2-legal-release-evidence
          path: ${{ runner.temp }}/dev-legal-release-evidence.json
          if-no-files-found: warn
