          PASSPHRASE: ${{ secrets.PROD_APPROVAL_PASSPHRASE }}
          EXISTING_ENC: ${{ secrets.PROD_APPROVAL_SEED_ENC }}
          EXISTING_PUBLIC_KEY: ${{ vars.PROD_APPROVAL_PUBLIC_KEY }}
          EXISTING_PRINCIPAL: ${{ vars.PROD_APPROVAL_PRINCIPAL }}
        run: |
          set -euo pipefail
          set +x
          export CHECK_DEPS_DIR="$RUNNER_TEMP/deps" CHECK_REPORT_DIR="$RUNNER_TEMP/report"
          node scripts/prod-protection-live.mjs
      - name: Retain public commissioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protection-recovery-inventory
          path: ${{ runner.temp }}/report/*.json
          if-no-files-found: ignore
  deliver-inventory:
    needs: recovery-inventory
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
