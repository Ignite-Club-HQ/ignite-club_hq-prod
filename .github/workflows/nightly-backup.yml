name: Nightly PROD Backup

# Full row-level backup of the PROD Supabase database. Runs on its own schedule
# so it never blocks the promote-to-prod pipeline. Uploaded as a GitHub artifact
# (retained 30 days). Can also be triggered manually before risky migrations.
#
# Required GitHub Actions secrets (same as promote-to-prod.yml):
#   SUPABASE_ACCESS_TOKEN
#   SUPABASE_PROD_PROJECT_REF
#   SUPABASE_DB_PASSWORD

on:
  schedule:
    # 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump prod database
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving "latest" calls the unauthenticated GitHub
          # releases API and fails with "rate limit exceeded" on busy runners.
          version: 2.34.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required secrets are present
        run: |
          missing=0
          for var in SUPABASE_ACCESS_TOKEN PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Link to Supabase PROD project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Dump schema + roles + data
        id: dump
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILE="prod-full-backup-${STAMP}.tar.gz"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          supabase db dump --linked -f prod-schema.sql
          supabase db dump --linked --role-only -f prod-roles.sql
          supabase db dump --linked --data-only -f prod-data.sql
          tar czf "$FILE" prod-schema.sql prod-roles.sql prod-data.sql
          ls -lh "$FILE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.file }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30
          if-no-files-found: error
