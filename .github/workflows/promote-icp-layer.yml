name: "[REPO] Promote ICP canister code to the live repository"

# Copy the canister layer (sources, build settings, live environment definition
# and release tooling) from the reviewed default branch into this repository's
# release branch, add-only. It writes source files to GitHub and nothing else:
# no canister is created, upgraded or even contacted, and no club data is read.
# Creating the live canister set is a separate, explicitly run job.
#
# Default mode is a plan, which writes nothing.
#
# The job authenticates with GitHub's own per-run credential: the source and the
# destination are branches of this one repository, so no separate transfer token
# is stored anywhere and the access dies with the run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Plan reports what would be copied; apply creates the commit"
        type: choice
        options:
          - plan
          - apply
        default: plan
      allow_drift:
        description: "Overwrite live files that differ (apply only; review the differing list first)"
        type: boolean
        default: false
      source_commit:
        description: "Optional exact historical commit: copy service source/build inputs only; preserve live settings and tooling"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: promote-icp-layer
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to run from anything but the reviewed default branch
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Run this from the ${REF#refs/heads/} branch only — the release branch must receive code that has been reviewed on the default branch."; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Plan the copy
        if: inputs.mode != 'apply'
        env:
          MIGRATION_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if [ -n "$SOURCE_COMMIT" ]; then
            node scripts/promote-icp-layer.mjs --source-ref "$SOURCE_COMMIT"
          else
            node scripts/promote-icp-layer.mjs
          fi
      - name: Apply the copy
        if: inputs.mode == 'apply'
        env:
          MIGRATION_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          FLAG=""
          if [ "${{ inputs.allow_drift }}" = "true" ]; then FLAG="--allow-drift"; fi
          if [ -n "$SOURCE_COMMIT" ]; then
            node scripts/promote-icp-layer.mjs --apply $FLAG --source-ref "$SOURCE_COMMIT"
          else
            node scripts/promote-icp-layer.mjs --apply $FLAG
          fi
