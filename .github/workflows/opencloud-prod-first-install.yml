name: "[PROD] OpenCloud PROD backend first install"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, install]
        default: check
        required: true
permissions:
  contents: read
concurrency:
  group: opencloud-prod-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/opencloud-prod-source-build.yml
  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: opencloud-prod-backend-source-build
          path: deploy/opencloud/work/prod-candidate
      - name: Check or install exact PROD backend inventory
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          MODE: ${{ inputs.mode }}
          GOVERNOR_PEM_FILE: ${{ runner.temp }}/opencloud-governor.pem
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$GOVERNOR_PEM_FILE"' EXIT
          test -n "$PROD_GOVERNOR_PEM_ENC" && test -n "$PROD_GOVERNOR_PASSPHRASE"
          trap 'rm -f "$GOVERNOR_PEM_FILE" "$GOVERNOR_PEM_FILE.enc" "$GOVERNOR_PEM_FILE.pass"' EXIT
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$GOVERNOR_PEM_FILE.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$GOVERNOR_PEM_FILE.pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$GOVERNOR_PEM_FILE.enc" -out "$GOVERNOR_PEM_FILE" -pass file:"$GOVERNOR_PEM_FILE.pass"
          rm -f "$GOVERNOR_PEM_FILE.enc" "$GOVERNOR_PEM_FILE.pass"
          node scripts/opencloud/prod-first-install.mjs deploy/opencloud/work/prod-candidate "$MODE"
