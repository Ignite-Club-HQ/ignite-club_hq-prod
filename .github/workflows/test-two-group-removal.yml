name: "[TEST] Check complete two-group removal (isolated)"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  removal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install existing dependencies and pinned compiler
        run: |
          node scripts/ensure-frontend-deps.mjs
          bun add -g ic-mops@3.5.1
          mops toolchain use moc 1.16.1
          (cd frontend && node node_modules/@dfinity/pic/postinstall.mjs)
      - name: Check host, evidence invariants and isolated cleanup
        run: node --test frontend/scripts/removal-host-preflight.test.mjs frontend/scripts/removal-local-supervisor.test.mjs frontend/scripts/two-group-removal-evidence.test.mjs frontend/scripts/account-recovery-candid.test.mjs frontend/scripts/removal-local-lifecycle.test.mjs
      - name: Check exact production authorization refusal and signed scope
        run: |
          cargo test --locked -p identity_access -p recovery_witness -- --test-threads=1
          node --test scripts/group-removal-recovery.test.mjs scripts/account-recovery-journal.test.mjs
      - name: Build disposable actors (no deployed mappings)
        run: |
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          for d in club_domain events_domain messaging_domain vault_domain competition_domain club_points_domain mini_league_domain media_metadata insights_domain notification_queue pii_access_control media_blob_store; do
            (cd backend/$d && mops install && mkdir -p .mops/.build && "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations -o .mops/.build/$d.wasm src/main.mo)
          done
          (cd backend/secret_workload_identity && mops install && mkdir -p .mops/.build && "$MOC" $(mops sources) -o .mops/.build/secret_workload_identity.wasm src/main.mo)
          (cd backend/events_domain && "$MOC" $(mops sources) -o "$RUNNER_TEMP/removal-install-probe.wasm" ../shared/test/removalInstallProbe.mo)
          (cd backend/events_domain && "$MOC" $(mops sources) -o "$RUNNER_TEMP/recovery-lifecycle-probe.wasm" ../shared/test/recoveryLifecycleProbe.mo)
          cargo build --locked --release --target wasm32-unknown-unknown -p identity_access -p shard_router -p timer_jobs -p recovery_witness
      - name: Check independent recovery journal with real snapshots and upgrades
        working-directory: frontend
        env:
          RECOVERY_WITNESS_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/release/recovery_witness.wasm
          RECOVERY_WITNESS_REPORT: ${{ runner.temp }}/account-recovery-witness.json
        run: |
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          timeout --kill-after=5s 300s node scripts/test-account-recovery-witness-replica.mjs
      - name: Check production identity and signed recovery transport (isolated pins)
        working-directory: frontend
        env:
          PRODUCTION_RECOVERY_REPORT: ${{ runner.temp }}/production-recovery-integration.json
          REMOVAL_LIFECYCLE_PROBE_WASM: ${{ runner.temp }}/recovery-lifecycle-probe.wasm
        run: |
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          timeout --kill-after=5s 1000s node scripts/test-production-recovery-integration.mjs
      - name: Run both receiver modes across all 28 frozen targets
        working-directory: frontend
        run: |
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          export REMOVAL_INSTALL_PROBE_WASM="$RUNNER_TEMP/removal-install-probe.wasm"
          export REMOVAL_INSTALL_REPORT="$RUNNER_TEMP/removal-install-report.json"
          export REMOVAL_LIFECYCLE_PROBE_WASM="$RUNNER_TEMP/recovery-lifecycle-probe.wasm"
          for d in club_domain events_domain messaging_domain vault_domain competition_domain club_points_domain mini_league_domain media_metadata insights_domain notification_queue pii_access_control media_blob_store secret_workload_identity; do
            name="$(echo "$d" | tr '[:lower:]' '[:upper:]')_WASM"
            export "$name=$GITHUB_WORKSPACE/backend/$d/.mops/.build/$d.wasm"
          done
          export IDENTITY_ACCESS_WASM="$GITHUB_WORKSPACE/target/wasm32-unknown-unknown/release/identity_access.wasm"
          export SHARD_ROUTER_WASM="$GITHUB_WORKSPACE/target/wasm32-unknown-unknown/release/shard_router.wasm"
          export TIMER_JOBS_WASM="$GITHUB_WORKSPACE/target/wasm32-unknown-unknown/release/timer_jobs.wasm"
          for mode in rehearsal production-candidate production; do
            TWO_GROUP_RECEIVER_MODE="$mode" TWO_GROUP_REMOVAL_REPORT="$RUNNER_TEMP/two-group-removal-$mode.json" timeout --kill-after=5s 1840s node scripts/test-two-group-removal-replica.mjs
          done
      - name: Explain test boundary
        if: always()
        run: |
          echo '## Isolated two-group removal checks' >> "$GITHUB_STEP_SUMMARY"
          echo '24 actual human-data receivers; exact installed inventory includes two timers, shared workload and router.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A green test verifies denial, drain and fresh complete seals for all 28 targets (24 receivers, two timers, shared workload, router). It never authorizes PROD release, erasure or opening.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production-candidate applies to receivers only. The signed-production scenario uses real non-rehearsal identity, signed inventory provisioning and an independent witness across both groups; isolated evidence never opens PROD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Recovery witness checks preserve full replayable journals through real snapshots/upgrades; independent production fencing and positive authorization remain separate.' >> "$GITHUB_STEP_SUMMARY"
          if test -f "$RUNNER_TEMP/production-recovery-integration.json"; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1]));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n### Production identity/recovery transport\n"+r.checks.map(c=>"- PASS: "+c.name).join("\n")+"\nTransport test: "+r.passed+"; full production authorization: "+r.productionAuthorization+"; external controller fencing: "+r.externalControllerFencing+"; release authorized: "+r.releaseAuthorized+"\n")' "$RUNNER_TEMP/production-recovery-integration.json"
          fi
          for mode in rehearsal production-candidate production; do
            if test -f "$RUNNER_TEMP/two-group-removal-$mode.json"; then
              node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.argv[1]));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\n### "+r.mode+"\n"+r.checks.map(c=>"- PASS: "+c.name).join("\n")+"\nOverall test: "+r.passed+"; complete seals: "+r.completeSeals+"/28; permanent completion: "+r.terminalFencingCompletion+"; production authorization: "+r.productionAuthorization+"; release authorized: "+r.releaseAuthorized+"\n")' "$RUNNER_TEMP/two-group-removal-$mode.json"
            fi
          done
      - name: Save evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-group-removal-isolated
          path: |
            ${{ runner.temp }}/removal-install-report.json
            ${{ runner.temp }}/two-group-removal-*.json
            ${{ runner.temp }}/account-recovery-witness.json
            ${{ runner.temp }}/production-recovery-integration.json
          if-no-files-found: warn