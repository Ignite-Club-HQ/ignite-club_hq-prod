name: "[TEST] OpenCloud DEV G1 PII reload"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, upgrade]
        default: upgrade
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: opencloud-dev-deployment
  cancel-in-progress: false
jobs:
  wiring:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: opencloud-dev-backend-source-build
          path: deploy/opencloud/work/dev-candidate
          run-id: 45700163542
          github-token: ${{ github.token }}
      - name: Reload G1 DEV PII settings
        env:
          PEM_IN: ${{ secrets.GOVERNOR_PEM }}
          ICP_HOME: ${{ runner.temp }}/opencloud-pii-settings
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ICP_HOME"
          trap 'rm -rf "$ICP_HOME"' EXIT
          node scripts/normalize-dev-engine-publisher-pem.mjs > "$ICP_HOME/governor.pem"
          unset PEM_IN
          GOVERNOR_PEM_FILE="$ICP_HOME/governor.pem" node scripts/opencloud/dev-pii-reload.mjs "$MODE" deploy/opencloud/work/dev-candidate
