name: "[PROD] Push delivery worker"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: icp-push-deliver-prod
  cancel-in-progress: false

jobs:
  deliver:
    # Off until separately approved; the scheduled workflow must run from prod.
    if: github.ref == 'refs/heads/prod' && vars.PROD_ICP_PUSH_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install worker SDK
        run: npm install --prefix "$RUNNER_TEMP/icp-push-deps" @icp-sdk/core --no-fund --no-audit
      - name: Validate PROD inventory and deliver
        env:
          IGNITE_ICP_ENV: prod
          PROD_ICP_PUSH_ENABLED: ${{ vars.PROD_ICP_PUSH_ENABLED }}
          PROD_ICP_PUSH_QUEUE_IDS_JSON: ${{ vars.PROD_ICP_PUSH_QUEUE_IDS_JSON }}
          PROD_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
          PROD_ICP_PUSH_WORKER_SEED: ${{ secrets.PROD_ICP_PUSH_WORKER_SEED }}
          PROD_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.PROD_FCM_SERVICE_ACCOUNT_JSON }}
          PUSH_WORKER_NODE_PATH: ${{ runner.temp }}/icp-push-deps/node_modules
        run: node scripts/icp-push-deliver-prod.mjs