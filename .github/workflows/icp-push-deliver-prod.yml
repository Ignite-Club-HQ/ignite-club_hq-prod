name: "[PROD] Push delivery worker"

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: icp-push-deliver-prod
  cancel-in-progress: false

jobs:
  deliver:
    # Scheduling starts on main; execution and all credentials stay PROD-bound.
    # Activation still requires separate approval of the repository variable.
    if: vars.PROD_ICP_PUSH_ENABLED == 'true' && ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/prod'))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/prod
          persist-credentials: false
      - name: Bind worker to the checked out production commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/prod)"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install worker SDK
        run: npm install --prefix "$RUNNER_TEMP/icp-push-deps" @icp-sdk/core --no-fund --no-audit
      - name: Validate PROD inventory and deliver
        env:
          IGNITE_ICP_ENV: prod
          PROD_ICP_PUSH_ENABLED: ${{ vars.PROD_ICP_PUSH_ENABLED }}
          PROD_ICP_PUSH_QUEUE_IDS_JSON: ${{ vars.PROD_ICP_PUSH_QUEUE_IDS_JSON }}
          PROD_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
          PROD_ICP_PUSH_WORKER_SEED: ${{ secrets.PROD_ICP_PUSH_WORKER_SEED }}
          PROD_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.PROD_FCM_SERVICE_ACCOUNT_JSON }}
          PUSH_WORKER_NODE_PATH: ${{ runner.temp }}/icp-push-deps/node_modules
        run: |
          GITHUB_REF=refs/heads/prod GITHUB_REF_NAME=prod GITHUB_SHA="$(git rev-parse HEAD)" node scripts/icp-push-deliver-prod.mjs