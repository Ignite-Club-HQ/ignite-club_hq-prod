name: "[PROD] OpenCloud automatic backend deployment"
on:
  push:
    branches: [prod]
    paths: ['backend/**', 'Cargo.toml', 'Cargo.lock', 'mops.toml', 'mops.lock', 'scripts/opencloud/deployment.mjs']
permissions:
  contents: read
concurrency:
  group: ignite-prod-governor-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/prod' && vars.OPENCLOUD_PROD_AUTO_DEPLOY == 'true'
    uses: ./.github/workflows/opencloud-prod-source-build.yml
  upgrade:
    needs: build
    if: github.ref == 'refs/heads/prod' && vars.OPENCLOUD_PROD_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      OPENCLOUD_PROD_AUTO_DEPLOY: ${{ vars.OPENCLOUD_PROD_AUTO_DEPLOY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with: { name: opencloud-prod-backend-source-build, path: deploy/opencloud/work/prod-candidate }
      - name: Upgrade changed PROD backend services
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          BEFORE_REF: ${{ github.event.before }}
        run: |
          set -euo pipefail
          umask 077
          D="$(mktemp -d)"
          trap 'rm -rf "$D"' EXIT
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$D/key.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$D/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$D/key.enc" -out "$D/key.pem" -pass file:"$D/pass"
          unset PROD_GOVERNOR_PEM_ENC PROD_GOVERNOR_PASSPHRASE
          GOVERNOR_PEM_FILE="$D/key.pem" node scripts/opencloud/prod-auto-upgrade.mjs "$BEFORE_REF" "$GITHUB_SHA" deploy/opencloud/work/prod-candidate
