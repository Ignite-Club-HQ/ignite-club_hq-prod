name: "[PROD] Reload member services with current code (closed)"
# Restarts the 24 member services on their exact current code (memory kept) so
# they read settings applied by member access. check is read-only. Never changes
# code, settings, controllers, data or groups; refuses if any live code differs.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check reads only; reload restarts all 24 services on identical code"
        type: choice
        default: check
        options: [check, reload]
      upgrade_group:
        description: "Also move this later group to the code the first group already runs"
        type: choice
        default: none
        options: [none, g2]
      confirmation:
        description: "reload: RELOAD PROD MEMBER SERVICES"
        required: false
permissions:
  contents: write
concurrency:
  group: ignite-prod-governor-deployment
  cancel-in-progress: false
jobs:
  reload:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      IGNITE_ICP_ENV: prod
      PROD_GOVERNOR_PRINCIPAL: ${{ vars.PROD_GOVERNOR_PRINCIPAL }}
      DEV_DEPLOYER_PRINCIPAL: ${{ vars.DEV_DEPLOYER_PRINCIPAL }}
      RELOAD_ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RELOAD_UPGRADE_GROUP: ${{ inputs.upgrade_group }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the live repository prod branch
        run: |
          test "$GITHUB_REPOSITORY" = 'Ignite-Club-HQ/ignite-club_hq-prod'
          test "$GITHUB_REF" = 'refs/heads/prod'
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned CLI
        run: npm install -g @icp-sdk/icp-cli@1.7.0 @icp-sdk/ic-wasm ic-mops --no-fund --no-audit
      - name: Test reload rules
        run: node --test scripts/prod-reload-member-services.test.mjs
      - name: Install isolated pinned SDK
        run: npm install --prefix "$RUNNER_TEMP/prod-reload-deps" @icp-sdk/core@6.1.1 --no-fund --no-audit
      - name: Bake the PROD governor into canister configs (this checkout only)
        run: |
          set -euo pipefail
          SENTINEL='gwyap-pqop5-msidu-vlkov-zuejr-7gqjr-dwvkx-2yhgy-mdaxt-2giwn-cae'
          grep -rl "$SENTINEL" backend deploy/prod scripts | xargs -r sed -i "s|$SENTINEL|$PROD_GOVERNOR_PRINCIPAL|g"
      - name: Build the group services with the pinned CLI
        working-directory: deploy/prod
        run: |
          set -euo pipefail
          icp build club_domain events_domain messaging_domain vault_domain competition_domain club_points_domain \
            mini_league_domain media_metadata insights_domain notification_queue pii_access_control timer_jobs media_blob_store
          node ../../scripts/stage-group-wasm.mjs . "$RUNNER_TEMP/reload-wasm"
      - name: Restore existing signing key and run selected action
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export ICP_HOME="$RUNNER_TEMP/prod-reload-key"
          export CHECK_DEPS_DIR="$RUNNER_TEMP/prod-reload-deps"
          export CHECK_REPORT_DIR="$RUNNER_TEMP/prod-reload-report"
          export RELOAD_WASM_DIR="$RUNNER_TEMP/reload-wasm"
          trap 'rm -rf "$ICP_HOME"' EXIT
          test -n "${PROD_GOVERNOR_PEM_ENC:-}"
          test -n "${PROD_GOVERNOR_PASSPHRASE:-}"
          mkdir -p "$ICP_HOME"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$ICP_HOME/key.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$ICP_HOME/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$ICP_HOME/key.enc" -out "$ICP_HOME/key.pem" -pass file:"$ICP_HOME/pass"
          rm -f "$ICP_HOME/key.enc" "$ICP_HOME/pass"
          export CHECK_KEY_PEM="$ICP_HOME/key.pem"
          node scripts/prod-reload-member-services.mjs
      - name: Save reload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-member-reload
          path: ${{ runner.temp }}/prod-reload-report/*.json
          if-no-files-found: ignore
