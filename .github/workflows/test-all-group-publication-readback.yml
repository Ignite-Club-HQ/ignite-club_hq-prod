name: "[TEST] Verify all-group publication readback"
on:
  pull_request:
    paths:
      - "scripts/all-group-publication.mjs"
      - "scripts/all-group-publication.test.mjs"
      - ".github/workflows/test-all-group-publication-readback.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Test publication acknowledgement, evidence branch CAS and bounded readback
        run: node --test scripts/all-group-publication.test.mjs scripts/all-group-upgrade-policy.test.mjs
