name: "[PROD] OpenCloud private-name preflight"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [check, apply]
        default: check
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: opencloud-prod-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/opencloud-prod-source-build.yml
  inspect:
    needs: build
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: opencloud-prod-backend-source-build
          path: deploy/opencloud/work/prod-candidate
      - name: Discover retained PROD build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=deploy/opencloud/work/prod-original
          mkdir -p "$root"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name == "opencloud-prod-backend-source-build" or .name == "opencloud-prod-timer-validation")) | .id' > "$RUNNER_TEMP/prod-artifacts.txt"
          while read -r id; do
            test -n "$id" || continue
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/prod-artifact.zip"
            python3 - "$RUNNER_TEMP/prod-artifact.zip" "$root/$id" <<'PY'
          import sys, zipfile, pathlib, json, hashlib, gzip
          z=zipfile.ZipFile(sys.argv[1])
          dest=pathlib.Path(sys.argv[2])
          pins={"385f83a3d7e1fbad5426c1121bc07008cb86b925ed695cb40052d9b5e7648b80","e55b66bf5d52dfd1fe3ab3dd3dfd883e8467cf3309a637116b38d9bdb51de198","3742ea1edc52245445b945d58a63b612182aa9b6954df1f7bbe41da0d6745587"}
          if "manifest.json" not in z.namelist(): sys.exit(0)
          m=json.loads(z.read("manifest.json"))
          if m.get("environment")!="opencloud-prod" or m.get("applicationKey")!="ignite_prod_v2": sys.exit(0)
          selected=[]
          for a in m.get("canisters",[]):
              if a.get("moduleSha256") not in pins: continue
              p=a.get("wasm","")
              if not p or pathlib.PurePosixPath(p).is_absolute() or ".." in pathlib.PurePosixPath(p).parts or p not in z.namelist(): continue
              b=z.read(p)
              if hashlib.sha256(b).hexdigest()!=a.get("wasmSha256") or hashlib.sha256(gzip.decompress(b)).hexdigest()!=a["moduleSha256"]: continue
              selected.append((p,b))
          if selected:
              dest.mkdir(parents=True,exist_ok=True)
              (dest/"manifest.json").write_text(json.dumps(m))
              for p,b in selected:
                  f=dest/p
                  f.parent.mkdir(parents=True,exist_ok=True)
                  f.write_bytes(b)
              print("Verified matching artifact",dest.name)
          PY
            rm -f "$RUNNER_TEMP/prod-artifact.zip"
          done < "$RUNNER_TEMP/prod-artifacts.txt"
      - name: Install ICP CLI
        run: npm install -g @icp-sdk/icp-cli@1.7.0 --no-fund --no-audit
      - name: Inspect exact PROD private-name inventory
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          MODE: ${{ inputs.mode }}
          APPROVE_PRIVATE_NAME_REPAIR: ${{ inputs.mode == 'apply' && 'YES' || 'NO' }}
          ICP_HOME: ${{ runner.temp }}/opencloud-prod-private-name-preflight
          GOVERNOR_PEM_FILE: ${{ runner.temp }}/opencloud-prod-private-name-preflight/governor.pem
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ICP_HOME"
          trap 'rm -rf "$ICP_HOME"' EXIT
          test -n "$PROD_GOVERNOR_PEM_ENC" && test -n "$PROD_GOVERNOR_PASSPHRASE"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$GOVERNOR_PEM_FILE.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$GOVERNOR_PEM_FILE.pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$GOVERNOR_PEM_FILE.enc" -out "$GOVERNOR_PEM_FILE" -pass file:"$GOVERNOR_PEM_FILE.pass"
          rm -f "$GOVERNOR_PEM_FILE.enc" "$GOVERNOR_PEM_FILE.pass"
          unset PROD_GOVERNOR_PEM_ENC PROD_GOVERNOR_PASSPHRASE
          icp identity import --from-pem "$GOVERNOR_PEM_FILE" --storage plaintext opencloud-governor
          test "$(icp identity principal --identity opencloud-governor)" = "kydv5-mptl2-ip3ie-5zwd3-gc5en-4opnd-mytmr-gza6m-xh5t4-jz662-7ae"
          node --check scripts/opencloud/prod-private-name-preflight.mjs
          node scripts/opencloud/prod-private-name-preflight.mjs deploy/opencloud/work/prod-candidate "$MODE" deploy/opencloud/work/prod-original
