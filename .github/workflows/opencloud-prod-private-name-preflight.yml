name: "[PROD] OpenCloud private-name preflight"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: opencloud-prod-deployment
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Install ICP CLI
        run: npm install -g @icp-sdk/icp-cli@1.7.0 --no-fund --no-audit
      - name: Inspect exact PROD private-name inventory
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          ICP_HOME: ${{ runner.temp }}/opencloud-prod-private-name-preflight
          GOVERNOR_PEM_FILE: ${{ runner.temp }}/opencloud-prod-private-name-preflight/governor.pem
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ICP_HOME"
          trap 'rm -rf "$ICP_HOME"' EXIT
          test -n "$PROD_GOVERNOR_PEM_ENC" && test -n "$PROD_GOVERNOR_PASSPHRASE"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$GOVERNOR_PEM_FILE.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$GOVERNOR_PEM_FILE.pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$GOVERNOR_PEM_FILE.enc" -out "$GOVERNOR_PEM_FILE" -pass file:"$GOVERNOR_PEM_FILE.pass"
          rm -f "$GOVERNOR_PEM_FILE.enc" "$GOVERNOR_PEM_FILE.pass"
          unset PROD_GOVERNOR_PEM_ENC PROD_GOVERNOR_PASSPHRASE
          icp identity import --from-pem "$GOVERNOR_PEM_FILE" --storage plaintext opencloud-governor
          test "$(icp identity principal --identity opencloud-governor)" = "kydv5-mptl2-ip3ie-5zwd3-gc5en-4opnd-mytmr-gza6m-xh5t4-jz662-7ae"
          node --check scripts/opencloud/prod-private-name-preflight.mjs
          node scripts/opencloud/prod-private-name-preflight.mjs
