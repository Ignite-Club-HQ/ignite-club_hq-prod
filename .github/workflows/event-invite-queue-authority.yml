name: "[REPO] ICP event-invitation queue authority regression"

on:
  pull_request:
    paths:
      - "backend/notification_queue/src/main.mo"
      - "backend/events_domain/src/main.mo"
      - "backend/club_domain/src/main.mo"
      - "frontend/scripts/test-event-invite-queue-authority-replica.mjs"
      - "scripts/event-invite-queue-authority.test.mjs"
      - ".github/workflows/event-invite-queue-authority.yml"

permissions:
  contents: read

jobs:
  source-contracts:
    name: Check exact invitation source boundary (no deployment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: node --test scripts/event-invite-queue-authority.test.mjs

  local-canisters:
    name: Three-canister event invite authorization on disposable PocketIC
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Prepare pinned tools and local-only replica
        run: |
          node scripts/ensure-frontend-deps.mjs
          bun add -g ic-mops@3.5.1
          mops toolchain use moc 1.16.1
          (cd frontend && node node_modules/@dfinity/pic/postinstall.mjs)
      - name: Compile three disposable Motoko canisters (no network deployment)
        run: |
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          for domain in events_domain club_domain notification_queue; do
            (cd "backend/$domain" && mops install && mkdir -p .mops/.build &&
             "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations -o ".mops/.build/$domain.wasm" src/main.mo)
          done
      - name: Test both entry points plus real local event route and existing reminders
        working-directory: frontend
        env:
          CI: "true"
        run: |
          R="$GITHUB_WORKSPACE"
          export EVENTS_DOMAIN_WASM="$R/backend/events_domain/.mops/.build/events_domain.wasm"
          export CLUB_DOMAIN_WASM="$R/backend/club_domain/.mops/.build/club_domain.wasm"
          export NOTIFICATION_QUEUE_WASM="$R/backend/notification_queue/.mops/.build/notification_queue.wasm"
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          node scripts/test-event-invite-queue-authority-replica.mjs
          node scripts/test-event-setup-replica.mjs
