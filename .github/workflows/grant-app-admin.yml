# Ignite Club HQ — grant app admin to an Internet Identity user.
#
# Run from the GitHub Actions tab: "[TEST] Grant app admin" → Run workflow.
# Uses the same DEPLOYER_PEM governor key as the deploy workflow — no new
# secrets needed. Default lookup name is "Paul Cranwell"; change the input
# to grant a different Internet Identity user later.

name: "[TEST] Grant app admin"

on:
  workflow_dispatch:
    inputs:
      display_name:
        description: "Display name of the Internet Identity user (exact profile name)"
        required: true
        default: "Paul Cranwell"
      principal:
        description: "Exact sign-in ID (Settings → Your sign-in ID); profile name is not used to select accounts"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: group-2-admin-controls
    env:
      ICP_HOME: ${{ github.workspace }}/.icp-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install pinned ICP SDK
        run: |
          mkdir -p /tmp/icp-admin
          printf '{"type":"module"}\n' > /tmp/icp-admin/package.json
          npm install --prefix /tmp/icp-admin @icp-sdk/core@5.4.0 --no-fund --no-audit

      - name: Grant app admin
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          ONLY_PRINCIPAL: ${{ inputs.principal }}
          DEPLOYER_PEM: ${{ secrets.GOVERNOR_PEM || secrets.DEPLOYER_PEM }}
          IDS_FILE: ${{ github.workspace }}/deploy/mainnet/.icp/data/mappings/ic.ids.json
        run: |
          set -euo pipefail
          cp scripts/dev-app-admin*.mjs /tmp/icp-admin/
          for service in identity_access club_domain insights_domain messaging_domain; do
            cp "frontend/src/lab/generated-contracts/$service/declarations/$service.did.js" /tmp/icp-admin/
          done
          node --test /tmp/icp-admin/dev-app-admin-policy.test.mjs
          node /tmp/icp-admin/dev-app-admin.mjs
