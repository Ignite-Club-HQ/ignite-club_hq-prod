# Ignite Club HQ — grant app admin to an Internet Identity user.
#
# Run from the GitHub Actions tab: "[TEST] Grant app admin" → Run workflow.
# Uses the same DEPLOYER_PEM governor key as the deploy workflow — no new
# secrets needed. Default lookup name is "Paul Cranwell"; change the input
# to grant a different Internet Identity user later.

name: "[TEST] Grant app admin"

on:
  workflow_dispatch:
    inputs:
      display_name:
        description: "Display name of the Internet Identity user (exact profile name)"
        required: true
        default: "Paul Cranwell"
      principal:
        description: "Optional sign-in ID (Settings → Your sign-in ID) when several profiles share the name"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: group-2-admin-controls
    env:
      ICP_HOME: ${{ github.workspace }}/.icp-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install icp CLI
        run: npm install -g @icp-sdk/icp-cli --no-fund --no-audit

      - name: Restore existing governor
        env:
          # Same key source as the working [TEST] Upgrade backend workflow.
          DEPLOYER_PEM: ${{ secrets.GOVERNOR_PEM || secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYER_PEM" || { echo "::error::No governor key secret is available."; exit 1; }
          umask 077
          # Rebuild a clean PEM even when the secret was pasted on one line.
          PEM_IN="$DEPLOYER_PEM" node -e '
            const s=process.env.PEM_IN.replace(/\r/g,"").replace(/\\n/g,"\n");
            const m=s.match(/-----BEGIN ([A-Z0-9 ]*PRIVATE KEY)-----([\s\S]*?)-----END \1-----/);
            if(!m){console.error("Governor key secret has no BEGIN/END block");process.exit(1);}
            const body=m[2].replace(/\s+/g,"").match(/.{1,64}/g).join("\n");
            process.stdout.write(`-----BEGIN ${m[1]}-----\n${body}\n-----END ${m[1]}-----\n`);
          ' > "$RUNNER_TEMP/governor.pem"
          icp identity import --from-pem "$RUNNER_TEMP/governor.pem" --storage plaintext ignite-governor
          rm -f "$RUNNER_TEMP/governor.pem"
          icp identity default ignite-governor
          if [ "$(icp identity principal --identity ignite-governor 2>/dev/null)" != vk34m-qhp7i-xyaaw-itwxz-uohx7-ucw52-mx2vs-alcau-3h4ga-rayrt-pae ]; then
            echo "::error::The key is not the TEST governor. Nothing changed."
            exit 1
          fi

      - name: Grant app admin
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          ONLY_PRINCIPAL: ${{ inputs.principal }}
        run: bash scripts/grant-app-admin.sh "$DISPLAY_NAME"
