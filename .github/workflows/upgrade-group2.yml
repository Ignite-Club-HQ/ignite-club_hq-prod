name: "[TEST] Upgrade Group 2 (closed)"
on:
  workflow_dispatch:
    inputs:
      action:
        description: Check readiness, upgrade all thirteen Group 2 services, or reload them with identical code so saved settings take effect
        required: true
        type: choice
        default: check
        options: [check, upgrade, reload]
      confirmation:
        description: Type UPGRADE GROUP 2 for upgrade, RELOAD GROUP 2 SETTINGS for reload (leave empty for check)
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: ignite-mainnet-governor-deployment
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    environment: group-2-owner-opening
    timeout-minutes: 120
    steps:
      - name: Set isolated tool home
        run: echo "ICP_HOME=$RUNNER_TEMP/g2-icp-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Validate request
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          node -e 'const a = process.env.ACTION, c = process.env.CONFIRMATION.trim(); if (!["check","upgrade","reload"].includes(a) || (a === "upgrade" && c !== "UPGRADE GROUP 2") || (a === "reload" && c !== "RELOAD GROUP 2 SETTINGS")) throw Error("Type UPGRADE GROUP 2 for upgrade or RELOAD GROUP 2 SETTINGS for reload")'
      - name: Install pinned tools and project dependencies
        run: |
          set -euo pipefail
          npm install -g @icp-sdk/icp-cli@1.7.0 @icp-sdk/ic-wasm ic-mops --no-fund --no-audit
          node scripts/ensure-frontend-deps.mjs
          icp canister install --help | grep -q -- --wasm-memory-persistence
      - name: Test upgrade safeguards
        run: node --test scripts/group2-journal.test.mjs scripts/group2-upgrade-rules.test.mjs scripts/group2-upgrade-workflow.test.mjs scripts/stage-group-wasm.test.mjs frontend/scripts/media-key-deploy-rules.test.mjs frontend/scripts/media-key-mainnet.test.mjs
      - name: Restore existing Group 2 governor only (never create a replacement)
        env:
          # DEV governor may differ from the frontend deployment key.
          DEPLOYER_PEM: ${{ secrets.GOVERNOR_PEM || secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          test -n "${DEPLOYER_PEM:-}" || { echo "::error::Existing DEV Group 2 governor secret required; no canisters touched."; exit 1; }
          umask 077
          PEM_FILE="$RUNNER_TEMP/g2-operator.pem"
          # Same supported secret normalizer as the current DEV member-access
          # workflows; do not print or regenerate the existing private key.
          if ! PEM_IN="$DEPLOYER_PEM" node scripts/normalize-pem.mjs > "$PEM_FILE"; then
            echo "::error::Group 2 governor secret cannot be normalized. Check GOVERNOR_PEM and protected environment overrides. Do not paste keys into logs."
            exit 1
          fi
          test -s "$PEM_FILE" || { echo "::error::Normalized Group 2 governor PEM is empty."; exit 1; }
          mkdir -p "$ICP_HOME/identity/keys"
          if ! icp identity import --from-pem "$PEM_FILE" --storage plaintext ignite-governor >/dev/null 2>&1; then
            echo "::error::ICP CLI rejected the existing Group 2 governor PEM format. Check the protected secret; no canisters touched."
            exit 1
          fi
          icp identity default ignite-governor >/dev/null
          if ! governor_principal="$(icp identity principal --identity ignite-governor 2>/dev/null)"; then
            echo "::error::Failed to derive existing Group 2 governor principal; no canisters touched."
            exit 1
          fi
          if [ "$governor_principal" != "vk34m-qhp7i-xyaaw-itwxz-uohx7-ucw52-mx2vs-alcau-3h4ga-rayrt-pae" ]; then
            echo "::error::Wrong key: expected the existing DEV Group 2 governor. Check GOVERNOR_PEM precedence; no canisters touched."
            exit 1
          fi
          unset governor_principal
      - name: Build and stage the thirteen recipe artifacts
        working-directory: deploy/mainnet
        run: |
          set -euo pipefail
          icp build club_domain events_domain messaging_domain vault_domain competition_domain club_points_domain mini_league_domain media_metadata insights_domain notification_queue pii_access_control timer_jobs media_blob_store
          node ../../scripts/stage-group-wasm.mjs . "$RUNNER_TEMP/g2-wasm"
      - name: Check or upgrade existing Group 2 only
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: node frontend/scripts/upgrade-group2.mjs "$ACTION" "$RUNNER_TEMP/g2-wasm" "$RUNNER_TEMP/g2-operator.pem" "$RUNNER_TEMP/g2-upgrade-report"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/g2-operator.pem"; rm -rf "$ICP_HOME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-2-upgrade-report
          path: ${{ runner.temp }}/g2-upgrade-report
          if-no-files-found: ignore