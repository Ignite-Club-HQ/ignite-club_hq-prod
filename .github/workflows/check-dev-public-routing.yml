name: "[TEST] Verify DEV public routing (read-only)"
# Uses the existing protected DEV governor to inspect live routing evidence.
# This workflow MUST NOT approve routing, publish snapshots, or upgrade canisters.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/check-dev-public-routing.yml"
      - "scripts/dev-public-routing-check.test.mjs"
      - "frontend/scripts/produce-routing-gates.ts"
permissions:
  contents: read
concurrency:
  group: ignite-mainnet-governor-deployment
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Verify the read-only DEV workflow boundary
        run: node --test scripts/dev-public-routing-check.test.mjs

  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: group-2-admin-controls
    timeout-minutes: 45
    env:
      IGNITE_ICP_ENV: dev
      SNAPSHOT_CHECK_ONLY: "1"
      RECORD_ROUTING_APPROVAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restrict signing to DEV on the reviewed main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Ignite-Club-HQ/ignite-club_hq-prod'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$IGNITE_ICP_ENV" = 'dev'
          test "$SNAPSHOT_CHECK_ONLY" = '1'
          test "$RECORD_ROUTING_APPROVAL" = '0'
          grep -q 'jcdfe-vqaaa-aaaal-qxloq-cai' deploy/mainnet/.icp/data/mappings/ic.ids.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install existing frontend dependencies
        run: node scripts/ensure-frontend-deps.mjs
      - name: Resolve already-authorized notification worker
        env:
          ICP_PUSH_WORKER_SEED: ${{ secrets.ICP_PUSH_WORKER_SEED }}
          PUSH_WORKER_PRINCIPAL: ${{ vars.PUSH_WORKER_PRINCIPAL }}
        run: bash scripts/resolve-group-push-worker.sh
      - name: Restore pinned DEV governor for verified reads only
        env:
          DEPLOYER_PEM: ${{ secrets.GOVERNOR_PEM || secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${DEPLOYER_PEM:-}"
          python3 - "$RUNNER_TEMP/dev-routing-operator.pem" <<'PY'
          import base64, os, re, sys
          raw = os.environ["DEPLOYER_PEM"].replace("\r", "").replace("\\n", "\n")
          raw = re.sub(r"[\u2010-\u2015\u2212]", "-", raw).replace("\u00a0", " ").strip().strip("'\"")
          if "BEGIN" not in raw.upper():
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("ascii")
                  if "BEGIN" in decoded.upper(): raw = decoded
              except Exception:
                  pass
          pattern = r"-{2,}\s*BEGIN\s+((?:EC\s+)?PRIVATE\s+KEY)\s*-{2,}(.*?)-{2,}\s*END\s+\1\s*-{2,}"
          found = re.search(pattern, raw, re.S | re.I)
          if not found:
              raise SystemExit("Pinned DEV governor secret is missing or malformed; no canister changed")
          label = re.sub(r"\s+", " ", found.group(1).upper())
          body = re.sub(r"\s+", "", found.group(2))
          if not re.fullmatch(r"[A-Za-z0-9+/=]+", body):
              raise SystemExit("Governor key content malformed; no canister changed")
          lines = "\n".join(body[i:i+64] for i in range(0, len(body), 64))
          with open(sys.argv[1], "w") as handle:
              handle.write(f"-----BEGIN {label}-----\n{lines}\n-----END {label}-----\n")
          PY
      - name: Check all DEV group, placement, fuel and removal evidence
        working-directory: frontend
        run: |
          set -euo pipefail
          npx --yes tsx@4 scripts/produce-routing-gates.ts \
            "$RUNNER_TEMP/dev-routing-operator.pem" \
            "$RUNNER_TEMP/dev-public-routing-report.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/dev-public-routing-report.json','utf8'));
          if(!result.approved || result.routerCanisterId!=='jcdfe-vqaaa-aaaal-qxloq-cai' || result.targetAlias!=='mainnet' || !result.removalWiring)throw Error('DEV routing evidence did not pass or is for a different router');
          console.log('Verified DEV-only routing evidence; no router approval was recorded.');
          JS
      - name: Remove operator key
        if: always()
        run: rm -f "$RUNNER_TEMP/dev-routing-operator.pem"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-public-routing-evidence
          path: ${{ runner.temp }}/dev-public-routing-report.json
          if-no-files-found: warn
