name: "[TEST] OpenCloud DEV publish legal release"
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [publish]
        default: publish
        required: true
permissions:
  contents: read
concurrency:
  group: opencloud-dev-deployment
  cancel-in-progress: false
jobs:
  wiring:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Publish approved DEV legal release
        env:
          PEM_IN: ${{ secrets.GOVERNOR_PEM }}
          ICP_HOME: ${{ runner.temp }}/opencloud-pii-settings
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ICP_HOME"
          trap 'rm -rf "$ICP_HOME"' EXIT
          node scripts/normalize-dev-engine-publisher-pem.mjs > "$ICP_HOME/governor.pem"
          unset PEM_IN
          GOVERNOR_PEM_FILE="$ICP_HOME/governor.pem" node scripts/opencloud/dev-legal-release.mjs "$MODE"
