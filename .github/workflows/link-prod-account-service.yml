name: "[PROD] Link account service lifecycle (closed)"
on:
  workflow_dispatch:
    inputs:
      action:
        description: "inspect reads only; plan saves a proposal; link applies the reviewed lifecycle; reconcile-readback only confirms an interrupted link; restore-release re-applies only the reviewed release variable after an upgrade dropped it"
        type: choice
        default: plan
        options: [plan, inspect, link, reconcile-readback, restore-release]
      reviewed_plan_hash:
        description: "Hash from successful plan summary (link, reconcile-readback or restore-release)"
        required: false
      confirmation:
        description: "link: LINK PROD ACCOUNT SERVICE; reconcile-readback: CONFIRM PROD ACCOUNT SERVICE READBACK; restore-release: RESTORE PROD BOUND DELETION RELEASE"
        required: false
permissions:
  contents: write
concurrency:
  group: ignite-prod-governor-deployment
  cancel-in-progress: false
jobs:
  account-service-link:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      IGNITE_ICP_ENV: prod
      PROD_GOVERNOR_PRINCIPAL: ${{ vars.PROD_GOVERNOR_PRINCIPAL }}
      DEV_DEPLOYER_PRINCIPAL: ${{ vars.DEV_DEPLOYER_PRINCIPAL }}
      LINK_ACTION: ${{ inputs.action }}
      LINK_PLAN_HASH: ${{ inputs.reviewed_plan_hash }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the live repository prod branch
        run: |
          test "$GITHUB_REPOSITORY" = 'Ignite-Club-HQ/ignite-club_hq-prod'
          test "$GITHUB_REF" = 'refs/heads/prod'
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Test closed-only account-service lifecycle and durable intent safeguards
        run: node --test scripts/prod-identity-link.test.mjs scripts/prod-g2-register.test.mjs scripts/prod-group-readiness.test.mjs
      - name: Install isolated pinned SDK
        run: npm install --prefix "$RUNNER_TEMP/prod-identity-link-deps" @icp-sdk/core@6.1.1 --no-fund --no-audit
      - name: Restore existing signing key and run selected closed-only action
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export ICP_HOME="$RUNNER_TEMP/prod-identity-link-key"
          export CHECK_DEPS_DIR="$RUNNER_TEMP/prod-identity-link-deps"
          export CHECK_REPORT_DIR="$RUNNER_TEMP/prod-identity-link-report"
          trap 'rm -rf "$ICP_HOME"' EXIT
          test -n "${PROD_GOVERNOR_PEM_ENC:-}"
          test -n "${PROD_GOVERNOR_PASSPHRASE:-}"
          mkdir -p "$ICP_HOME"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$ICP_HOME/key.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$ICP_HOME/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$ICP_HOME/key.enc" -out "$ICP_HOME/key.pem" -pass file:"$ICP_HOME/pass"
          rm -f "$ICP_HOME/key.enc" "$ICP_HOME/pass"
          export CHECK_KEY_PEM="$ICP_HOME/key.pem"
          node scripts/prod-identity-link.mjs
      - name: Save closed-only link evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-identity-link
          path: ${{ runner.temp }}/prod-identity-link-report/*.json
          if-no-files-found: ignore
