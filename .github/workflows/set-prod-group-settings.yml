name: "[PROD] Set group service settings (closed)"
# Sets each PROD group's club placement and account-service link with readback.
# Never installs, funds or opens a group.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly: SET SERVICE SETTINGS"
        required: true
permissions:
  contents: read
concurrency:
  group: ignite-prod-governor-deployment
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      IGNITE_ICP_ENV: prod
      CONFIRMATION: ${{ inputs.confirmation }}
      PROD_GOVERNOR_PRINCIPAL: ${{ vars.PROD_GOVERNOR_PRINCIPAL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the live repository prod branch
        run: |
          test "$GITHUB_REPOSITORY" = 'Ignite-Club-HQ/ignite-club_hq-prod'
          test "$GITHUB_REF" = 'refs/heads/prod'
          test -n "$PROD_GOVERNOR_PRINCIPAL"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install project dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          npm install --no-save --ignore-scripts --no-fund --no-audit @icp-sdk/core@6.1.1
      - name: Restore existing signing key and set the settings
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$RUNNER_TEMP/prod-open-key"
          trap 'rm -rf "$KEY_DIR"' EXIT
          test -n "${PROD_GOVERNOR_PEM_ENC:-}"
          test -n "${PROD_GOVERNOR_PASSPHRASE:-}"
          mkdir -p "$KEY_DIR"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$KEY_DIR/key.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$KEY_DIR/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$KEY_DIR/key.enc" -out "$KEY_DIR/key.pem" -pass file:"$KEY_DIR/pass"
          rm -f "$KEY_DIR/key.enc" "$KEY_DIR/pass"
          cd frontend
          # The shared tool is DEV-pinned; bind PROD's governor and mappings, then prove it.
          sed -i "s#^const GOVERNOR = 'vk34m-[a-z0-9-]*';#const GOVERNOR = process.env.PROD_GOVERNOR_PRINCIPAL ?? '';#; s#deploy/mainnet/.icp/data/mappings#deploy/prod/.icp/data/mappings#" scripts/set-group-service-settings.ts
          grep -q "^const GOVERNOR = process.env.PROD_GOVERNOR_PRINCIPAL" scripts/set-group-service-settings.ts
          grep -q "deploy/prod/.icp/data/mappings" scripts/set-group-service-settings.ts
          if grep -q "deploy/mainnet/" scripts/set-group-service-settings.ts; then exit 1; fi
          npx --yes tsx@4 scripts/set-group-service-settings.ts g1,g2 "$KEY_DIR/key.pem" "$RUNNER_TEMP/prod-settings-report.json" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
