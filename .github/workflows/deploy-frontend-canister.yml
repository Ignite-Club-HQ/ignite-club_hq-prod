# Ignite web app → ICP frontend canister (replaces Netlify file hosting).
# Release candidate (2026-11-18): original DEV mainnet frontend asset-only sync
# after prior deploy and retry failed. No module install, restart, top-up or
# controller mutation; Cloud Engine stays manual-only and PROD is not targeted.
#
# Runs on every push to main that touches the frontend, or manually.
# Uses the same DEPLOYER_PEM secret as "[TEST] Deploy canisters (legacy base/Group 1)".
# The first run creates the canister (~0.5T cycles from the deployer's cycles
# balance) and commits deploy/frontend/.icp/data/mappings/ic.ids.json so later
# runs reuse it. The site is then live at https://<canister-id>.icp.net.
#
# Optional repository variables (Settings → Variables): IGNITE_LIVE_SUPABASE_URL,
# IGNITE_LIVE_SUPABASE_ANON_KEY (both public values; defaults below).

name: "[TEST] Deploy web app (frontend canister)"

on:
  workflow_dispatch:
    inputs:
      enable_dev_g2_child_pii:
        description: "DEV only: preserve approved Group 2 child-name discovery (false temporarily disables this manual build)"
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["frontend/**", "deploy/frontend/**", ".github/workflows/deploy-frontend-canister.yml", "!frontend/scripts/**", "!frontend/**/*.test.*", "!frontend/**/*.md"]

concurrency:
  group: deploy-frontend-canister
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ICP_HOME: ${{ github.workspace }}/.icp-home
      # Large bundles need more than the default 60s plugin compute limit.
      ICP_CLI_PLUGIN_COMPUTE_LIMIT_SECS: "1800"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install deploy tools
        run: npm install -g @icp-sdk/icp-cli@1.7.0 @icp-sdk/ic-wasm --no-fund --no-audit

      - name: Build web app
        working-directory: frontend
        env:
          IGNITE_LIVE_BUILD: "1"
          IGNITE_LIVE_SUPABASE_URL: ${{ vars.IGNITE_LIVE_SUPABASE_URL || 'https://ecsdwrarzfexssxtrymj.supabase.co' }}
          IGNITE_LIVE_SUPABASE_ANON_KEY: ${{ vars.IGNITE_LIVE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjc2R3cmFyemZleHNzeHRyeW1qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NjA0MzEsImV4cCI6MjA5OTEzNjQzMX0.-BE-YufJeZCJvQt9QktMe1b6obskRkaWQDLchYjpEA0' }}
          # Canister-hosted app is ICP-first. Used only when neither the Supabase
          # app_settings row nor club_domain's on-chain copy exists — without it
          # the app silently defaults to Supabase and II users load nothing.
          IGNITE_LIVE_BACKEND_ROUTING_JSON: ${{ vars.IGNITE_LIVE_BACKEND_ROUTING_JSON || '{"defaultBackend":"icp","countryRules":{},"targets":[{"id":"icp/main/v1","backend":"icp","kind":"icp-mainnet","alias":"main","version":"v1","enabled":true}],"countryTargets":{},"clubBackendOverrides":{}}' }}
          IGNITE_LIVE_PRIVATE_CLUB_NAME_DISPLAYS: "1"
          # Global club-name key cutover is intentionally OFF until the
          # protected DEV all-club PII/Identity release has completed AND
          # encrypted club-name replicas are verified for every active club.
          # A repository variable is an explicit operator sign-off, never a
          # guessed default. Push and manual builds share this one setting.
          # PROD frontend workflow uses a separate recipe and is untouched.
          IGNITE_LIVE_SHARED_CLUB_NAMES: ${{ github.ref == 'refs/heads/main' && vars.IGNITE_DEV_SHARED_CLUB_NAMES_RELEASE_READY == 'true' && '1' || '0' }}
          IGNITE_LIVE_DEV_FIREBASE_WEB_API_KEY: ${{ vars.IGNITE_LIVE_DEV_FIREBASE_WEB_API_KEY }}
          IGNITE_LIVE_DEV_FIREBASE_PROJECT_ID: ${{ vars.IGNITE_LIVE_DEV_FIREBASE_PROJECT_ID }}
          IGNITE_LIVE_DEV_FIREBASE_APP_ID: ${{ vars.IGNITE_LIVE_DEV_FIREBASE_APP_ID }}
          IGNITE_LIVE_DEV_FIREBASE_VAPID_KEY: ${{ vars.IGNITE_LIVE_DEV_FIREBASE_VAPID_KEY }}
          # Previously approved, pinned DEV Group 2 encrypted child-name
          # discovery. Do not depend on an optional repository variable:
          # the absent variable evaluated to 0 in the observed push release,
          # silently omitting the PII canister despite a green deployment.
          # Enable on canonical main push, or a manual main run only when its
          # explicit checkbox is true (manual false remains an opt-out).
          # The manifest validator independently rejects wrong frontend IDs,
          # unapproved PII IDs and worker/PROD canister disclosure.
          IGNITE_MCP_DEV_GROUP2_CHILD_PII_DISCOVERY: ${{ (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_dev_g2_child_pii))) && '1' || '0' }}
        run: |
          set -euo pipefail
          # The previous deployment went green while silently publishing no
          # PII service. A main-branch push must fail, not silently revert the
          # reviewed DEV discovery manifest, if the expression ever regresses.
          if [[ "${GITHUB_EVENT_NAME:-}" == "push" && "${IGNITE_MCP_DEV_GROUP2_CHILD_PII_DISCOVERY:-}" != "1" ]]; then
            echo "::error::Approved DEV Group 2 PII discovery unexpectedly disabled on main push"
            exit 1
          fi
          # No automatic or guessed rollout: this must be the exact DEV
          # frontend target on main, backed by an explicit repository readiness
          # variable set after the canister/copy checks. If not approved,
          # always compile with global club-name mode disabled.
          if [[ "${IGNITE_LIVE_SHARED_CLUB_NAMES:-}" != "0" && "${IGNITE_LIVE_SHARED_CLUB_NAMES:-}" != "1" ]]; then
            echo "::error::Invalid DEV shared-club-name activation state"
            exit 1
          fi
          if [[ "${IGNITE_LIVE_SHARED_CLUB_NAMES:-}" == "1" && "${GITHUB_REF:-}" != "refs/heads/main" ]]; then
            echo "::error::Shared-club-name release attempted outside main"
            exit 1
          fi
          echo "DEV club-name shared-key mode: $([[ "${IGNITE_LIVE_SHARED_CLUB_NAMES:-}" == "1" ]] && echo APPROVED || echo DISABLED)"
          # DEV/test canisters only; refuses any PROD canister in the table.
          export IGNITE_ICP_ENV=dev
          export IGNITE_LIVE_ICP_CANISTER_IDS_JSON="$(node ../scripts/icp-environments.mjs ids dev)"
          npm ci --ignore-scripts --no-fund --no-audit
          node ../scripts/sync-canister-ids.mjs || true
          npm run build:live
          node scripts/prepare-canister-dist.mjs
          # Assert the build's actual published bytes: the DEV PII service
          # appears exactly once only with opt-in, and workers remain hidden.
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const m = JSON.parse(readFileSync('dist-canister/.well-known/ic-architecture', 'utf8'));
          const ids = m.canisters.map(c => c.id);
          const g2Pii = 'zt5a6-yiaaa-aaaal-qxp5q-cai';
          const forbidden = ['zu4gk-vqaaa-aaaal-qxp5a-cai', 'zg2rt-zaaaa-aaaal-qxp6a-cai', 'tbeh7-5qaaa-aaaai-ayenq-cai'];
          const enabled = process.env.IGNITE_MCP_DEV_GROUP2_CHILD_PII_DISCOVERY === '1';
          if (ids.filter(id => id === g2Pii).length !== (enabled ? 1 : 0)) {
            throw new Error('DEV Group 2 child-name PII manifest disagrees with explicit opt-in');
          }
          if (forbidden.some(id => ids.includes(id))) {
            throw new Error('DEV manifest unexpectedly contains a worker or PROD service');
          }
          console.log(enabled ? 'DEV Group 2 child-name PII published (caller ACL still enforced)'
                              : 'DEV Group 2 child-name PII remains unpublished');
          NODE
          # The static-site plugin may only read files inside deploy/frontend.
          rm -rf ../deploy/frontend/dist
          cp -r dist-canister ../deploy/frontend/dist

      # No asset-history carry-over: it re-stamped old files on every deploy so
      # they never aged out and the upload grew to ~34k files (one build is ~600).
      # Tabs left open on an old version recover via lazyWithRetry's reload.
      - name: Report upload size
        run: |
          echo "Files in this deploy: $(find deploy/frontend/dist -type f | wc -l)"

      - name: Restore deployer identity
        env:
          DEPLOYER_PEM: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYER_PEM" ]; then
            echo "::error::DEPLOYER_PEM secret missing — run the mainnet canister workflow first."
            exit 1
          fi
          mkdir -p "$ICP_HOME/identity/keys"
          PEM_FILE="$ICP_HOME/identity/keys/ignite-governor.pem"
          # Keep only the PRIVATE KEY block (dfx secp256k1 exports also carry an
          # "EC PARAMETERS" block, and pasted text may include a principal line
          # or be flattened onto one line). Rewraps the base64 body at 64 chars.
          # Prints block labels only — never key material.
          python3 - "$PEM_FILE" <<'PY'
          import base64, os, re, sys
          raw = os.environ["DEPLOYER_PEM"].replace("\r", "").replace("\\n", "\n")
          # Phones/notes apps turn "-----" into en/em dashes and add odd spaces.
          raw = re.sub(r"[\u2010-\u2015\u2212]", "-", raw).replace("\u00a0", " ").strip().strip('"\'')
          # Accept a whole PEM that was base64-encoded before saving.
          if "BEGIN" not in raw.upper():
              try:
                  dec = base64.b64decode(re.sub(r"\s+", "", raw), validate=True).decode("ascii")
                  if "BEGIN" in dec.upper():
                      raw = dec
              except Exception:
                  pass
          hdr = r"-{2,}\s*BEGIN\s+((?:EC\s+|ENCRYPTED\s+)?PRIVATE\s+KEY)\s*-{2,}"
          labels = re.findall(r"-{2,}\s*BEGIN\s+([A-Za-z0-9 ]+?)\s*-{2,}", raw, re.I)
          print("PEM blocks found:", labels or "none")
          if not labels:
              print("Secret contains word BEGIN:", "BEGIN" in raw.upper(), "| contains PRIVATE:", "PRIVATE" in raw.upper())
          m = re.search(hdr + r"(.*?)-{2,}\s*END\s+\1\s*-{2,}", raw, re.S | re.I)
          if not m:
              print("::error::DEPLOYER_PEM has no complete PRIVATE KEY block (BEGIN…END lines with matching names).")
              sys.exit(1)
          m_label = re.sub(r"\s+", " ", m.group(1).upper())
          if m_label == "ENCRYPTED PRIVATE KEY":
              print("::error::DEPLOYER_PEM is password-protected. Re-export it without encryption (dfx identity export).")
              sys.exit(1)
          body = re.sub(r"\s+", "", m.group(2))
          if not re.fullmatch(r"[A-Za-z0-9+/=]+", body):
              print("::error::DEPLOYER_PEM key body contains characters that are not base64 — it was altered when pasting.")
              sys.exit(1)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          with open(sys.argv[1], "w") as f:
              f.write(f"-----BEGIN {m_label}-----\n" + "\n".join(lines) + f"\n-----END {m_label}-----\n")
          print(f"Using {m_label} block.")
          PY
          icp identity import --from-pem "$PEM_FILE" --storage plaintext ignite-governor
          icp identity default ignite-governor
          echo "Deployer: $(icp identity principal)"

      # Existing DEV mainnet site: the frontend module is already installed.
      # Never run `icp deploy` for a static asset-only release; that command
      # stops/reinstalls a running canister before the sync plugin can upload.
      - name: Sync existing DEV mainnet website assets only
        working-directory: deploy/frontend
        run: |
          set -euo pipefail
          EXPECTED_FRONTEND="proe7-kqaaa-aaaas-qg6gq-cai"
          EXPECTED_MODULE_HASH="0xb143d5526d180140593e8d61f1eca2d917d5761cf0b59fdc5bada947abb1d304"
          ID="$(jq -r '.frontend // empty' .icp/data/mappings/ic.ids.json)"
          if [ "$ID" != "$EXPECTED_FRONTEND" ]; then
            echo "::error::Not the pinned existing DEV mainnet frontend; no sync attempted."
            exit 1
          fi
          # Status readback is an early refusal gate, not a guarantee that no
          # other controller can change the state during the subsequent call.
          STATUS_JSON="$(icp canister status frontend -e ic --json)"
          STATUS_JSON="$STATUS_JSON" EXPECTED_FRONTEND="$EXPECTED_FRONTEND" EXPECTED_MODULE_HASH="$EXPECTED_MODULE_HASH" node --input-type=module <<'JS'
          const status = JSON.parse(process.env.STATUS_JSON);
          const fail = message => { console.error('::error::'+message); process.exit(1); };
          if (status.id !== process.env.EXPECTED_FRONTEND || status.status !== 'Running') {
            fail('Existing DEV website is not running at the pinned ID; inspect before any retry');
          }
          if (status.module_hash?.toLowerCase() !== process.env.EXPECTED_MODULE_HASH) {
            fail('DEV website module hash changed; a separately reviewed upgrade is needed');
          }
          const controllers = status.settings?.controllers ?? [];
          if (controllers.length !== 3 ||
              !controllers.includes('jfagr-a4uwo-nlikz-ysri5-ipbrt-k4qa2-vkofo-it7lz-eha3w-4wix6-oqe') ||
              !controllers.includes('vk34m-qhp7i-xyaaw-itwxz-uohx7-ucw52-mx2vs-alcau-3h4ga-rayrt-pae') ||
              !controllers.includes('mzzzv-taaaa-aaaal-qxlrq-cai')) {
            fail('Existing DEV frontend controllers differ; no sync attempted');
          }
          const fuel = BigInt(String(status.cycles ?? 0).replace(/_/g, ''));
          if (fuel < 200_000_000_000n) fail('DEV frontend cycles below 200B safeguard; no automatic top-up or sync');
          console.log('Existing DEV mainnet website readback passed; running, pinned module and controllers, sufficient cycles');
          JS
          # No canister stop/install/upgrade, settings update, controller grant,
          # frontend creation, cycle minting or top-up. One sync attempt only.
          icp sync frontend -e ic
          # Check the target remains running after the sync. No automatic retry.
          FINAL_STATUS="$(icp canister status frontend -e ic --json)"
          FINAL_STATUS="$FINAL_STATUS" EXPECTED_FRONTEND="$EXPECTED_FRONTEND" EXPECTED_MODULE_HASH="$EXPECTED_MODULE_HASH" node --input-type=module <<'JS'
          const status = JSON.parse(process.env.FINAL_STATUS);
          if (status.id !== process.env.EXPECTED_FRONTEND ||
              status.status !== 'Running' ||
              status.module_hash?.toLowerCase() !== process.env.EXPECTED_MODULE_HASH) {
            console.error('::error::Website post-sync state differs; inspect before another deployment');
            process.exit(1);
          }
          console.log('Existing DEV mainnet frontend remains running on original module');
          JS
          echo "::notice::Existing DEV mainnet web assets synced: https://$ID.icp.net"
          echo "### DEV mainnet frontend assets synced: https://$ID.icp.net" >> "$GITHUB_STEP_SUMMARY"
