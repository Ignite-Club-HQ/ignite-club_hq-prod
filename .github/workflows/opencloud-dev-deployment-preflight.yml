name: '[TEST] OpenCloud DEV deployment preflight'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Verify public chain-key proxy
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          node scripts/opencloud/verify-proxy.mjs deploy/opencloud/dev.json "$RUNNER_TEMP/proxy-review.json"
          cat "$RUNNER_TEMP/proxy-review.json"
      - name: Check authenticated management access to exact DEV targets
        env:
          PEM_IN: ${{ secrets.DEPLOYER_PEM }}
          GOVERNOR_IN: ${{ secrets.GOVERNOR_PEM }}
          ICP_HOME: ${{ runner.temp }}/opencloud-publisher-status
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$ICP_HOME"
          trap 'rm -rf "$ICP_HOME"' EXIT
          npm install -g @icp-sdk/icp-cli@1.7.0 --no-fund --no-audit
          node scripts/normalize-dev-engine-publisher-pem.mjs > "$ICP_HOME/publisher.pem"
          unset PEM_IN
          PEM_IN="$GOVERNOR_IN" node scripts/normalize-dev-engine-publisher-pem.mjs > "$ICP_HOME/governor.pem"
          unset GOVERNOR_IN
          icp identity import --from-pem "$ICP_HOME/governor.pem" --storage plaintext opencloud-governor
          test "$(icp identity principal --identity opencloud-governor)" = "vk34m-qhp7i-xyaaw-itwxz-uohx7-ucw52-mx2vs-alcau-3h4ga-rayrt-pae"
          icp identity import --from-pem "$ICP_HOME/publisher.pem" --storage plaintext opencloud-publisher
          test "$(icp identity principal --identity opencloud-publisher)" = "jfagr-a4uwo-nlikz-ysri5-ipbrt-k4qa2-vkofo-it7lz-eha3w-4wix6-oqe"
          # Raw principal checks must not load the repository's local ICP project.
          mkdir -p "$RUNNER_TEMP/opencloud-status-project"
          cd "$RUNNER_TEMP/opencloud-status-project"
          failed=0
          for id in h2knm-vaaaa-aaac5-aadqa-cai h5lly-yyaaa-aaac5-aadqq-cai huiae-oqaaa-aaac5-aadra-cai htjgq-diaaa-aaac5-aadrq-cai hgox5-caaaa-aaac5-aadsa-cai hbprj-pyaaa-aaac5-aadsq-cai him2v-zqaaa-aaac5-aadta-cai hpn4b-uiaaa-aaac5-aadtq-cai gcdyp-3aaaa-aaac5-aadua-cai gfc63-wyaaa-aaac5-aaduq-cai gmbvh-aqaaa-aaac5-aadva-cai glatt-niaaa-aaac5-aadvq-cai g6hc6-maaaa-aaac5-aadwa-cai gzgek-byaaa-aaac5-aadwq-cai gqfpw-xqaaa-aaac5-aadxa-cai gxejc-2iaaa-aaac5-aadxq-cai ekzhk-jaaaa-aaac5-aadya-cai enyb6-eyaaa-aaac5-aadyq-cai ee3kc-sqaaa-aaac5-aadza-cai ed2mw-7iaaa-aaac5-aadzq-cai ew553-6aaaa-aaac5-aad2a-cai er43p-tyaaa-aaac5-aad2q-cai ey7qt-fqaaa-aaac5-aad3a-cai e76wh-iiaaa-aaac5-aad3q-cai fsqsj-haaaa-aaac5-aad4a-cai fvru5-kyaaa-aaac5-aad4q-cai f4s7b-4qaaa-aaac5-aad5a-cai f3tzv-riaaa-aaac5-aad5q-cai fouiy-qaaaa-aaac5-aad6a-cai fjvom-5yaaa-aaac5-aad6q-cai fawfq-lqaaa-aaac5-aad7a-cai fhxde-giaaa-aaac5-aad7q-cai; do
            # Frontend: publisher only. Backends: governor only (publisher must never control them).
            if [ "$id" = h2knm-vaaaa-aaac5-aadqa-cai ]; then who=opencloud-publisher; else who=opencloud-governor; fi
            echo "DEV target: $id as $who"
            if icp canister settings show "$id" --network ic --proxy s53an-5aaaa-aaac5-aaaaa-cai --identity "$who" --json > "$RUNNER_TEMP/settings.json"; then
              cat "$RUNNER_TEMP/settings.json"
              EXPECTED_SIGNER="$(icp identity principal --identity "$who")" node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const expected=["s53an-5aaaa-aaac5-aaaaa-cai","tuhjl-zg657-opcmu-4fct6-uxbzv-4j725-r6k7s-yxj4h-4el4q-og5ow-jqe","4sf7q-x5j7l-a3cwp-dt7rd-evzpu-gextt-cmqum-fmzsg-avqpp-wk7ga-sae",process.env.EXPECTED_SIGNER].sort();if(JSON.stringify(s.controllers.sort())!==JSON.stringify(expected))throw Error("Unexpected controllers")' "$RUNNER_TEMP/settings.json"
              echo "Authenticated settings access passed: $id"
            else
              failed=$((failed+1))
            fi
          done
          echo "Failed targets: $failed / 32"
          test "$failed" = 0
