name: "[TEST] Verify engine preparation on disposable canisters"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-engine-preparation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Prepare pinned local tools without deployment credentials
        run: |
          export ICP_HOME="$RUNNER_TEMP/engine-preparation-tools"
          node scripts/ensure-frontend-deps.mjs
          bun add -g ic-mops@3.5.1
          node scripts/prefetch-test-icp-tools.mjs
          (cd frontend && node node_modules/@dfinity/pic/postinstall.mjs)
          node --test frontend/scripts/removal-host-preflight.test.mjs frontend/scripts/removal-local-supervisor.test.mjs
      - name: Compile exact local service modules and permission checks
        run: |
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          for service in club_domain events_domain notification_queue vault_domain; do
            (cd "backend/$service" && mops install && "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations -o "$RUNNER_TEMP/$service.wasm" src/main.mo)
          done
          (cd backend/notification_queue && "$MOC" $(mops sources) -r test/updateReminderAccess.test.mo && "$MOC" $(mops sources) -r test/scheduleAccess.test.mo && "$MOC" $(mops sources) -r test/appAdminAccess.test.mo)
      - name: Restore real disposable service snapshots without release authority
        working-directory: frontend
        env:
          CLUB_DOMAIN_WASM: ${{ runner.temp }}/club_domain.wasm
          EVENTS_DOMAIN_WASM: ${{ runner.temp }}/events_domain.wasm
          NOTIFICATION_QUEUE_WASM: ${{ runner.temp }}/notification_queue.wasm
          ENGINE_RESTORE_REPORT: ${{ runner.temp }}/engine-real-restore.json
        run: |
          export POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic"
          timeout --kill-after=5s 330s node scripts/test-engine-canister-restore-replica.mjs
      - name: Save partial-inventory evidence, never activation approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-preparation-disposable-restore
          path: ${{ runner.temp }}/engine-real-restore.json
          if-no-files-found: warn