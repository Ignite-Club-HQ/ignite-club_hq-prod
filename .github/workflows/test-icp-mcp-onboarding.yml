name: "[TEST] ICP MCP onboarding Motoko compile"

on:
  pull_request:
    paths:
      - ".github/workflows/test-icp-mcp-onboarding.yml"
      - "backend/club_domain/src/main.mo"
      - "backend/pii_access_control/src/main.mo"
      - "frontend/scripts/test-linked-membership-replica.mjs"
      - "docs/integrations/icp-mcp-ignite-onboarding.md"
      - "scripts/icp-mcp-onboarding-doc.test.mjs"
      - "frontend/scripts/test-icp-mcp-onboarding-replica.mjs"
      - "frontend/scripts/test-chatgpt-vetkeys-secure-form-replica.mjs"
      - "frontend/prototypes/chatgpt-vetkeys-name-poc/**"
      - "frontend/scripts/prepare-icp-chatgpt-private-name.mjs"
      - "frontend/scripts/prepare-icp-chatgpt-profile-name-connector.mjs"
      - "frontend/scripts/prepare-icp-chatgpt-profile-name-connector.test.mjs"
      - "frontend/scripts/plan-icp-chatgpt-existing-profile-name.mjs"
      - "frontend/scripts/plan-icp-chatgpt-existing-profile-name.test.mjs"
      - "frontend/scripts/prepare-icp-chatgpt-private-name.test.mjs"
      - "frontend/scripts/iiOriginPolicy.mjs"
      - "frontend/scripts/iiOriginPolicy.test.mjs"
      - "frontend/scripts/iiOriginDist.test.mjs"
      - "frontend/scripts/prepare-canister-dist.mjs"

permissions:
  contents: read

jobs:
  compile-club-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Check ICP onboarding documentation against source contracts
        run: node --test scripts/icp-mcp-onboarding-doc.test.mjs
      - name: Confirm DEV/PROD Internet Identity origin isolation
        run: node --test frontend/scripts/iiOriginPolicy.test.mjs
      - name: Verify generated discovery files from isolated DEV and PROD builds
        run: node --test frontend/scripts/iiOriginDist.test.mjs
      - name: Install pinned Mops and Motoko compiler
        run: |
          bun add -g ic-mops@3.5.1
          mops toolchain use moc 1.16.1
      - name: Verify club_domain with enhanced migration checks (no deploy)
        working-directory: backend/club_domain
        run: |
          mops install
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations --check src/main.mo

  compile-pii-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - name: Install pinned Mops and compiler (no deployment)
        run: |
          bun add -g ic-mops@3.5.1
          mops toolchain use moc 1.16.1
      - name: Check PII canister including enhanced migrations (no deployment)
        working-directory: backend/pii_access_control
        run: |
          mops install
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations --check src/main.mo

  rehearse-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Prepare pinned offline test toolchain
        run: |
          node scripts/ensure-frontend-deps.mjs
          bun add -g ic-mops@3.5.1
          mops toolchain use moc 1.16.1
          (cd frontend && node node_modules/@dfinity/pic/postinstall.mjs)
      - name: Verify offline secure-profile encryption and strict DEV connector provenance
        working-directory: frontend
        run: |
          node --test scripts/prepare-icp-chatgpt-private-name.test.mjs scripts/prepare-icp-chatgpt-profile-name-connector.test.mjs scripts/plan-icp-chatgpt-existing-profile-name.test.mjs
      - name: Compile disposable identity, club and PII canisters (never deploy)
        run: |
          MOC="$HOME/.cache/mops/moc/1.16.1/moc"
          (cd backend/club_domain && mops install && mkdir -p .mops/.build && "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations -o .mops/.build/club_domain.wasm src/main.mo)
          (cd backend/pii_access_control && mops install && mkdir -p .mops/.build && "$MOC" $(mops sources) --default-persistent-actors --enhanced-migration src/backend/migrations -o .mops/.build/pii_access_control.wasm src/main.mo)
          cargo build --locked --release --target wasm32-unknown-unknown -p identity_access
      - name: Rehearse first-time signup and invitation with synthetic identities
        working-directory: frontend
        run: |
          R="$GITHUB_WORKSPACE"
          POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic" \
          IDENTITY_ACCESS_WASM="$R/target/wasm32-unknown-unknown/release/identity_access.wasm" \
          CLUB_DOMAIN_WASM="$R/backend/club_domain/.mops/.build/club_domain.wasm" \
          node scripts/test-icp-mcp-onboarding-replica.mjs

      - name: Rehearse real VetKeys own-name crypto, signed synthetic registration and profile in PocketIC
        working-directory: frontend
        run: |
          R="$GITHUB_WORKSPACE"
          POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic" \
          CHATGPT_NAME_IDENTITY_WASM="$R/target/wasm32-unknown-unknown/release/identity_access.wasm" \
          CHATGPT_NAME_PII_WASM="$R/backend/pii_access_control/.mops/.build/pii_access_control.wasm" \
          node scripts/test-chatgpt-vetkeys-secure-form-replica.mjs

      - name: Rehearse parent-owned child roster and admin-only access on disposable PocketIC
        working-directory: frontend
        run: |
          R="$GITHUB_WORKSPACE"
          POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic" \
          IDENTITY_ACCESS_WASM="$R/target/wasm32-unknown-unknown/release/identity_access.wasm" \
          CLUB_DOMAIN_WASM="$R/backend/club_domain/.mops/.build/club_domain.wasm" \
          node scripts/test-linked-membership-replica.mjs
      - name: Rehearse protected first-content membership and linked-principal revocation
        working-directory: frontend
        run: |
          R="$GITHUB_WORKSPACE"
          POCKET_IC_BIN="$PWD/node_modules/@dfinity/pic/pocket-ic" \
          IDENTITY_ACCESS_WASM="$R/target/wasm32-unknown-unknown/release/identity_access.wasm" \
          CLUB_DOMAIN_WASM="$R/backend/club_domain/.mops/.build/club_domain.wasm" \
          node scripts/test-account-groups-replica.mjs
