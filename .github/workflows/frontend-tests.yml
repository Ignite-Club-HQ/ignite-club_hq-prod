name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same branch when a new commit lands — keeps
# the queue moving and avoids burning Actions minutes on stale pushes.
concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest (jsdom)
    runs-on: ubuntu-latest
    # iOS-like gesture tests are deterministic but compound effects + jsdom
    # cold start can take a moment in fresh containers.
    timeout-minutes: 10

    # Pin TZ so Date-based math (double-tap timestamps, snap-back duration
    # interpolation) matches what local devs see.
    env:
      TZ: UTC
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fast-fail: exercise just the iOS gesture suites first so a regression
      # in the FullscreenImageViewer touch arbitration is visible within
      # seconds, before the full suite finishes.
      # Vitest treats positional CLI args as substring filters against
      # resolved test file paths (NOT shell globs). Passing a glob like
      # "FullscreenImageViewer.*.test.tsx" matches zero files and exits 1
      # with "No test files found". Use a plain substring instead.
      - name: Smoke-test iOS gesture suites
        run: bunx vitest run src/components/chat/FullscreenImageViewer.*.test.tsx

      - name: Run full test suite
        run: bunx vitest run

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml
          if-no-files-found: ignore
