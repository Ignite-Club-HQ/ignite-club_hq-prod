# Automatic OpenCloud DEV deployment from main. Inert until deploy/opencloud/dev.json
# activation.autoDeploy is true (set only after ChatGPT's initial installation and acceptance).
# Upgrade-only on the exact 32 DEV targets; never installs, reinstalls, creates canisters,
# changes controllers, or touches PROD/mainnet. Reuses the source-build workflow.
name: '[TEST] OpenCloud DEV automatic deployment'
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'Cargo.toml', 'Cargo.lock', 'mops.toml', 'mops.lock', 'scripts/opencloud/**', 'deploy/opencloud/dev.json']
permissions:
  contents: read
concurrency:
  group: opencloud-dev-deployment
  cancel-in-progress: false
jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      auto_deploy: ${{ steps.gate.outputs.auto_deploy }}
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - id: gate
        run: node scripts/opencloud/dev-auto.mjs gate
      - id: plan
        if: steps.gate.outputs.auto_deploy == 'true'
        run: node scripts/opencloud/dev-auto.mjs plan "${{ github.event.before }}" "${{ github.sha }}" opencloud-plan.json
      - if: steps.gate.outputs.auto_deploy == 'true'
        uses: actions/upload-artifact@v4
        with: { name: opencloud-dev-plan, path: opencloud-plan.json, retention-days: 30 }
      - if: steps.gate.outputs.auto_deploy != 'true'
        run: echo "### OpenCloud DEV automatic deployment is switched off; nothing deployed for ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: gate
    if: needs.gate.outputs.auto_deploy == 'true' && needs.gate.outputs.backend == 'true'
    uses: ./.github/workflows/opencloud-dev-source-build.yml
  backend:
    needs: [gate, build]
    if: needs.gate.outputs.auto_deploy == 'true' && needs.gate.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: opencloud-dev-deploy
    env:
      ICP_HOME: ${{ github.workspace }}/.icp-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm install -g @icp-sdk/icp-cli@1.7.0 --no-fund --no-audit
      - uses: actions/download-artifact@v4
        with: { name: opencloud-dev-plan }
      - uses: actions/download-artifact@v4
        with: { name: opencloud-dev-backend-source-build, path: deploy/opencloud/work/dev-candidate }
      - name: Use the existing DEV governor
        env:
          GOVERNOR_IN: ${{ secrets.GOVERNOR_PEM }}
        run: |
          set -euo pipefail
          test -n "$GOVERNOR_IN" || { echo "::error::GOVERNOR_PEM missing"; exit 1; }
          mkdir -p "$ICP_HOME"
          PEM_IN="$GOVERNOR_IN" node scripts/normalize-dev-engine-publisher-pem.mjs > "$ICP_HOME/governor.pem"
          icp identity import --from-pem "$ICP_HOME/governor.pem" --storage plaintext opencloud-governor
          rm -f "$ICP_HOME/governor.pem"
          icp identity default opencloud-governor
          expected="$(node -p 'require("./deploy/opencloud/dev.json").controllers.governor')"
          test "$(icp identity principal)" = "$expected" || { echo "::error::Governor key does not match the OpenCloud DEV governor"; exit 1; }
      - name: Upgrade changed services (upgrade only, hash-checked)
        run: node scripts/opencloud/dev-auto.mjs upgrade opencloud-plan.json deploy/opencloud/work/dev-candidate
  frontend:
    needs: [gate, backend]
    if: always() && needs.gate.outputs.auto_deploy == 'true' && needs.gate.outputs.frontend == 'true' && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: opencloud-dev-deploy
    env:
      ICP_HOME: ${{ github.workspace }}/.icp-home
      SUPABASE_URL: https://ecsdwrarzfexssxtrymj.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.IGNITE_LIVE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: npm install -g @icp-sdk/icp-cli@1.7.0 --no-fund --no-audit
      - name: Use the existing DEV website publisher
        env:
          PUBLISHER_IN: ${{ secrets.DEPLOYER_PEM }}
        run: |
          set -euo pipefail
          test -n "$PUBLISHER_IN" || { echo "::error::DEPLOYER_PEM missing"; exit 1; }
          mkdir -p "$ICP_HOME"
          PEM_IN="$PUBLISHER_IN" node scripts/normalize-dev-engine-publisher-pem.mjs > "$ICP_HOME/publisher.pem"
          icp identity import --from-pem "$ICP_HOME/publisher.pem" --storage plaintext opencloud-publisher
          rm -f "$ICP_HOME/publisher.pem"
          icp identity default opencloud-publisher
          expected="$(node -p 'require("./deploy/opencloud/dev.json").controllers.frontendPublisher')"
          test "$(icp identity principal)" = "$expected" || { echo "::error::Publisher key does not match the OpenCloud DEV publisher"; exit 1; }
      - name: Build the isolated OpenCloud DEV website
        run: |
          set -euo pipefail
          W=deploy/opencloud/work/dev-web
          mkdir -p "$W" && cp deploy/opencloud/dev.json "$W/config.json"
          node scripts/opencloud/frontend-artifacts.mjs "$W" deploy/opencloud/prod.json
          mkdir -p "$W/site/.icp/data/mappings"
          cp -r "$W/frontend-assets" "$W/site/dist"
          cp deploy/frontend-engine/icp.yaml "$W/site/icp.yaml"
          printf '{"frontend":"%s"}\n' "$(node -p 'require("./deploy/opencloud/dev.json").shared.frontend')" > "$W/site/.icp/data/mappings/ic.ids.json"
      - name: Upload website files (sync only, no reinstall)
        working-directory: deploy/opencloud/work/dev-web/site
        run: |
          set -euo pipefail
          icp sync frontend -e ic
          id="$(node -p 'require("../../../dev.json").shared.frontend')"
          echo "### OpenCloud DEV website updated for commit \`${GITHUB_SHA}\`: https://$id.icp.net" >> "$GITHUB_STEP_SUMMARY"
