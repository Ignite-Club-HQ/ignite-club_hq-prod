name: "[PROD] Report group health to the router"
# Reads PROD group services anonymously and records heap/cycles readings on the
# PROD router. Never opens, registers or changes a group. Manual only: a
# recurring schedule needs separate owner approval.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly: REPORT PROD GROUP HEALTH"
        required: true
permissions:
  contents: read
concurrency:
  group: ignite-prod-group-health-report
  cancel-in-progress: false
jobs:
  report-health:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      IGNITE_ICP_ENV: prod
      PROD_GOVERNOR_PRINCIPAL: ${{ vars.PROD_GOVERNOR_PRINCIPAL }}
    steps:
      - name: Require confirmation and the live prod branch
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = 'REPORT PROD GROUP HEALTH'
          test "$GITHUB_REPOSITORY" = 'Ignite-Club-HQ/ignite-club_hq-prod'
          test "$GITHUB_REF" = 'refs/heads/prod'
          test -n "$PROD_GOVERNOR_PRINCIPAL"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install project dependencies
        run: node scripts/ensure-frontend-deps.mjs
      - name: Restore existing PROD signing key and report health
        env:
          PROD_GOVERNOR_PEM_ENC: ${{ secrets.PROD_GOVERNOR_PEM_ENC }}
          PROD_GOVERNOR_PASSPHRASE: ${{ secrets.PROD_GOVERNOR_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$RUNNER_TEMP/prod-health-key"
          trap 'rm -rf "$KEY_DIR"' EXIT
          test -n "${PROD_GOVERNOR_PEM_ENC:-}"
          test -n "${PROD_GOVERNOR_PASSPHRASE:-}"
          mkdir -p "$KEY_DIR"
          printf '%s' "$PROD_GOVERNOR_PEM_ENC" | tr -d '\r\n ' | base64 -d > "$KEY_DIR/key.enc"
          printf '%s' "$PROD_GOVERNOR_PASSPHRASE" > "$KEY_DIR/pass"
          openssl enc -d -aes-256-cbc -pbkdf2 -in "$KEY_DIR/key.enc" -out "$KEY_DIR/key.pem" -pass file:"$KEY_DIR/pass"
          rm -f "$KEY_DIR/key.enc" "$KEY_DIR/pass"
          cd frontend
          npx --yes tsx@4 scripts/report-group-health.ts "$KEY_DIR/key.pem" "$RUNNER_TEMP/prod-group-health-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-group-health-report
          path: ${{ runner.temp }}/prod-group-health-report.json
          if-no-files-found: ignore
