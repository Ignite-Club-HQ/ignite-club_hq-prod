# LOCAL TEST INFRASTRUCTURE ONLY.
# This workspace is intentionally separate from the repository-level Supabase
# directory, whose config identifies a hosted project. Never copy hosted
# credentials into this file.
project_id = "ignite-club-local-security-tests"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Kept configured so the separately approved Realtime phase can use the same
# baseline. The initial start command explicitly excludes this container.
enabled = true

[studio]
enabled = false

[inbucket]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.local-security-probe]
# The local probe performs explicit token validation so tests can distinguish
# missing, malformed, valid-but-forbidden, and authorized requests.
verify_jwt = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10

[analytics]
enabled = false
