<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ignite-logo.png" />
    
    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical font file to eliminate network chain -->
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_nVMrMxCp50SjIw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Non-render-blocking font loading with font-display swap -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ignite Club HQ</title>
    <meta name="description" content="Sports club management app" />
    <meta name="author" content="Ignite Club HQ" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ignite Club HQ" />
    <link rel="apple-touch-icon" href="/ignite-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="Ignite Club HQ" />
    <meta property="og:description" content="Manage your sports club with ease — events, teams, chat, and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://igniteclubhq.app" />
    <meta property="og:image" content="https://igniteclubhq.app/ignite-logo.png" />
    <meta property="og:site_name" content="Ignite Club HQ" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ignite Club HQ" />
    <meta name="twitter:description" content="Manage your sports club with ease — events, teams, chat, and more." />
    <meta name="twitter:image" content="https://igniteclubhq.app/ignite-logo.png" />
    <!-- Theme initialization script - prevents flash of wrong theme -->
    <script>
      (function() {
        try {
          // CRITICAL: Check if this is an OAuth callback (Google login)
          // If so, localStorage may contain stale theme from previous user
          // Default to LIGHT mode and let React apply the correct theme after profile fetch
          var hash = window.location.hash;
          var search = window.location.search;
          var isOAuthCallback = (hash && (hash.includes('access_token') || hash.includes('refresh_token'))) ||
                                (search && search.includes('code='));
          
          if (isOAuthCallback) {
            // OAuth callback - default to light mode, don't trust localStorage
            // The useAuth hook will apply the correct theme after fetching the profile
            console.log('[Theme] OAuth callback detected - defaulting to light mode');
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            // Clear localStorage to ensure useAuth can apply the correct theme
            localStorage.removeItem('app-theme');
          } else {
            // Normal page load - use localStorage
            var theme = localStorage.getItem('app-theme');
            if (theme === 'dark') {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            } else {
              // Default to light theme if not set or if set to light
              document.documentElement.classList.remove('dark');
              document.documentElement.style.colorScheme = 'light';
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Initial background color based on theme - prevents flash during load -->
    <style>
      :root { background-color: #ffffff !important; }
      .dark { background-color: hsl(160 15% 6%); }
      /* Ensure body is never black during load */
      body { background-color: #ffffff !important; }
    </style>
  </head>

  <body style="background-color: #ffffff;">
    <div id="root">
      <!-- Fallback content visible until React mounts - prevents black screen on native -->
      <div id="app-loading-fallback" style="display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;background:#fff;font-family:system-ui,sans-serif;">
        <div style="text-align:center;">
          <div style="width:48px;height:48px;border:3px solid #e5e7eb;border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto;"></div>
          <p style="margin-top:16px;color:#6b7280;font-size:14px;">Loading...</p>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    
    <!-- Global error catcher for native app debugging -->
    <script>
      window.onerror = function(msg, url, line, col, err) {
        var el = document.getElementById('app-loading-fallback');
        var root = document.getElementById('root');
        // Show error regardless of children state
        if (root) {
          root.innerHTML = '<pre style="padding:20px;font-size:12px;word-wrap:break-word;white-space:pre-wrap;background:#fff;color:#000;min-height:100vh;">CRASH: ' + msg + '\nFile: ' + url + '\nLine: ' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '') + '</pre>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<pre style="padding:20px;font-size:12px;word-wrap:break-word;white-space:pre-wrap;background:#fff;color:#000;min-height:100vh;">UNHANDLED REJECTION:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
