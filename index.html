<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ignite-logo.png" />
    
    <!-- Google Fonts - fully async, no preload (preload can block on capacitor:// scheme) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ignite Club HQ</title>
    <meta name="description" content="Sports club management app" />
    <meta name="author" content="Ignite Club HQ" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ignite Club HQ" />
    <link rel="apple-touch-icon" href="/ignite-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="Ignite Club HQ" />
    <meta property="og:description" content="Manage your sports club with ease — events, teams, chat, and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://igniteclubhq.app" />
    <meta property="og:image" content="https://igniteclubhq.app/ignite-logo.png" />
    <meta property="og:site_name" content="Ignite Club HQ" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ignite Club HQ" />
    <meta name="twitter:description" content="Manage your sports club with ease — events, teams, chat, and more." />
    <meta name="twitter:image" content="https://igniteclubhq.app/ignite-logo.png" />
    <!-- CRITICAL: iOS native detection - MUST run before any CSS/JS to prevent viewport collapse -->
    <script>
      (function() {
        try {
          // Detect Capacitor native platform early
          // On native, window.Capacitor is injected by the native bridge before page load
          var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
          var isIOS = isNative && /iPhone|iPad|iPod/i.test(navigator.userAgent);
          
          // iOS WKWebView collapses to 0px height when html/body use position:fixed
          // This class MUST be added before CSS is parsed to prevent black screen
          if (isIOS) {
            document.documentElement.classList.add('ios-native');
          }
          if (isNative) {
            document.documentElement.classList.add('capacitor-native');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Theme initialization script - prevents flash of wrong theme -->
    <script>
      (function() {
        try {
          var hash = window.location.hash;
          var search = window.location.search;
          var isOAuthCallback = (hash && (hash.includes('access_token') || hash.includes('refresh_token'))) ||
                                (search && search.includes('code='));
          
          if (isOAuthCallback) {
            console.log('[Theme] OAuth callback detected - defaulting to light mode');
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
            localStorage.removeItem('app-theme');
          } else {
            var theme = localStorage.getItem('app-theme');
            if (theme === 'dark') {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.style.colorScheme = 'light';
            }
          }
        } catch (e) {}
      })();
    </script>
    <!-- Initial background color based on theme - prevents flash during load -->
    <style>
      :root { background-color: #ffffff !important; }
      .dark { background-color: hsl(160 15% 6%); }
      /* Ensure body is never black during load */
      body { background-color: #ffffff !important; }
    </style>
  </head>

  <body style="background-color: #ffffff;">
    <div id="root" style="min-height:100vh;min-height:100dvh;background:#ffffff;">
      <!-- Fallback content visible until React mounts - prevents black screen on native -->
      <div id="app-loading-fallback" style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#ffffff !important;font-family:system-ui,sans-serif;z-index:99999;">
        <div style="text-align:center;">
          <div style="width:48px;height:48px;border:3px solid #e5e7eb;border-top-color:#10b981;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto;"></div>
          <p style="margin-top:16px;color:#6b7280;font-size:14px;">Loading...</p>
          <p id="app-boot-status" style="margin-top:8px;color:#9ca3af;font-size:11px;"></p>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    
    <!-- Boot diagnostics - updates loading status for native debugging -->
    <script>
      try {
        var status = document.getElementById('app-boot-status');
        if (status) status.textContent = 'Scripts loaded...';
      } catch(e) {}
    </script>
    
    <!-- Global error catcher for native app debugging -->
    <script>
      window.onerror = function(msg, url, line, col, err) {
        var root = document.getElementById('root');
        if (root) {
          root.style.background = '#ffffff';
          root.innerHTML = '<pre style="padding:20px;font-size:12px;word-wrap:break-word;white-space:pre-wrap;background:#fff;color:#000;min-height:100vh;position:relative;z-index:999999;">CRASH: ' + msg + '\nFile: ' + url + '\nLine: ' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '') + '</pre>';
        }
      };
      window.addEventListener('unhandledrejection', function(e) {
        var root = document.getElementById('root');
        if (root) {
          root.style.background = '#ffffff';
          root.innerHTML = '<pre style="padding:20px;font-size:12px;word-wrap:break-word;white-space:pre-wrap;background:#fff;color:#000;min-height:100vh;position:relative;z-index:999999;">UNHANDLED REJECTION:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
