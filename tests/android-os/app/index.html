<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Android OS Resume Regression Harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101418; color: #e6edf3;
        font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
      #root { padding: 12px; }
      #tap { margin-top: 12px; width: 100%; height: 160px; border-radius: 12px;
        background: #1f6feb; color: #fff; display: flex; align-items: center;
        justify-content: center; font-size: 18px; user-select: none; }
      #spinner { width: 24px; height: 24px; margin-top: 12px; background: #3fb950;
        border-radius: 4px; }
      pre { white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root">
      <h3>Android OS resume regression harness</h3>
      <pre id="state">booting…</pre>
      <div id="spinner"></div>
      <div id="tap" data-testid="tap-target">TAP ME</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
