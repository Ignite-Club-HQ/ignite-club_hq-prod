[[edge_functions]]
  function = "share"
  path = "/share"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security headers (added by security audit — 2026-07-15)
# Applied to every response served by Netlify. Edge functions and the
# `_headers` file can still override on a per-path basis.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS for 2 years, include subdomains, allow preload list
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Deny framing (clickjacking protection). Change to SAMEORIGIN only if you embed the app in an iframe on your own domain.
    X-Frame-Options = "DENY"
    # Modern equivalent of X-Frame-Options + XSS-Protection
    Content-Security-Policy = "frame-ancestors 'none'"
    # Don't leak referrer URLs cross-origin
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Lock down powerful browser APIs we don't use
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(self), usb=(), magnetometer=(), accelerometer=(), gyroscope=()"
    # Legacy header — ignored by modern browsers but harmless
    X-XSS-Protection = "0"
    # Cross-origin isolation (safe defaults; relax if you embed 3rd-party widgets)
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
