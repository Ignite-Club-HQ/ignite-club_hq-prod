# Hybrid frontend deployment configuration.
# Build variables are configured privately in the hosting environment.
[build]
  base = "frontend"
  publish = "dist-live"
  command = "node ../scripts/host-build-env.mjs"
  # Skip pull-request previews: they build main against the live public key,
  # which host-build-env rightly refuses. Exit 0 = skip, anything else = build.
  ignore = 'test "$CONTEXT" = "deploy-preview"'

[build.environment]
  NODE_VERSION = "22.12.0"
  CI = "true"
  IGNITE_LIVE_BUILD = "1"

[context.production.environment]
  IGNITE_ICP_ENV = "prod"
  IGNITE_LIVE_SUPABASE_URL = "https://yabcfiuntwqjwvschnji.supabase.co"

[context.main.environment]
  IGNITE_ICP_ENV = "dev"
  IGNITE_LIVE_SUPABASE_URL = "https://ecsdwrarzfexssxtrymj.supabase.co"

# Same-origin server endpoints (replacements for the old Supabase edge
# functions giphy-search and fetch-link-preview, which are not deployed on
# the connected Supabase project). Handlers live in netlify/functions/ and
# are served under /api/* via the redirects below; the preview's Vite dev
# server middleware (frontend/vite.live.config.ts) serves the same paths.
[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "share"
  path = "/share"

[[redirects]]
  from = "/api/fetch-link-preview"
  to = "/.netlify/functions/fetch-link-preview"
  status = 200

[[redirects]]
  from = "/api/register-club-backend"
  to = "/.netlify/functions/register-club-backend"
  status = 200

# Public, brand-owned app-install links used by ChatGPT ICP onboarding.
# Place before the full-site ICP canister proxy. Never expose raw store IDs or
# Lovable project URLs in customer-facing invitation copy.
# All targets are fixed allowlisted store destinations, not user-supplied.
[[redirects]]
  from = "/get/ios"
  to = "https://apps.apple.com/au/app/ignite-club-hq/id6758928691"
  status = 302
  force = true

[[redirects]]
  from = "/get/android"
  to = "https://play.google.com/store/apps/details?id=app.lovable.igniteteamhub"
  status = 302
  force = true

# Whole site is served from the PROD frontend canister; Netlify only proxies.
# force = true so Netlify's own built files never shadow the canister.
# Rollback: delete this rule to fall back to the SPA rule below.
[[redirects]]
  from = "/*"
  to = "https://u3mrq-uiaaa-aaaac-bgioq-cai.icp0.io/:splat"
  status = 200
  force = true
  conditions = {}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Internet Identity alternative-origins manifest must be served as JSON,
# not fall through to the SPA index.html below.
[[headers]]
  for = "/.well-known/ii-alternative-origins"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Phone sign-in return allow-list read by Internet Identity (id.ai).
[[headers]]
  for = "/.well-known/ii-auth-callbacks"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.giphy.com https://ecsdwrarzfexssxtrymj.supabase.co https://yabcfiuntwqjwvschnji.supabase.co; font-src 'self'; connect-src 'self' https://api.giphy.com https://ecsdwrarzfexssxtrymj.supabase.co https://yabcfiuntwqjwvschnji.supabase.co wss://yabcfiuntwqjwvschnji.supabase.co wss://ecsdwrarzfexssxtrymj.supabase.co https://icp-api.io https://id.ai https://*.raw.icp0.io; frame-src https://id.ai https://www.google.com; object-src 'none'; worker-src 'self'; base-uri 'none'; form-action 'none'; manifest-src 'none'; media-src 'self' blob: https://ecsdwrarzfexssxtrymj.supabase.co https://yabcfiuntwqjwvschnji.supabase.co"
